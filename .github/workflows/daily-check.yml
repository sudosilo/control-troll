name: daily-check
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [check.js, apps.json, .github/workflows/daily-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node check.js
      - run: |
          git config user.name "control-troll-bot"
          git config user.email "control-troll-bot@users.noreply.github.com"
          git add status.json snapshots
          git diff --cached --quiet || git commit -m "daily status"
          git push
