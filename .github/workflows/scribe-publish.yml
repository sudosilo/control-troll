name: scribe-publish
# Claude sessions can write files but cannot create releases or change repo settings.
# The scribe queues that work in scribe/publish.json and this workflow carries it out
# with the account token stored in the SCRIBE_TOKEN secret.
on:
  push:
    branches: [main]
    paths: [scribe/publish.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish releases and repo settings
        env:
          GH_TOKEN: ${{ secrets.SCRIBE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SCRIBE_TOKEN secret is not set"; exit 1; fi
          python3 - <<'PY'
          import json, subprocess
          q = json.load(open("scribe/publish.json"))
          try: done = json.load(open("scribe/published.json"))
          except Exception: done = {"releases": [], "settings": {}}
          def gh(*a):
              r = subprocess.run(["gh", *a], capture_output=True, text=True)
              return r.returncode, (r.stdout + r.stderr).strip()
          for job in q.get("jobs", []):
              repo = "sudosilo/" + job["repo"]
              for rel in job.get("releases", []):
                  key = repo + "@" + rel["tag"]
                  if key in done["releases"]: continue
                  code, out = gh("api", f"repos/{repo}/releases/tags/{rel['tag']}")
                  if code != 0:
                      code, out = gh("api", "-X", "POST", f"repos/{repo}/releases", "-f", "tag_name=" + rel["tag"],
                                     "-f", "target_commitish=" + rel["target"], "-f", "name=" + rel["name"], "-f", "body=" + rel["body"])
                  print(("ok   " if code == 0 else "FAIL ") + key + ("" if code == 0 else " " + out[:200]))
                  if code == 0: done["releases"].append(key)
              want = {"d": job.get("description", ""), "h": job.get("homepage", ""), "t": sorted(job.get("topics", []))}
              if done["settings"].get(repo) != want:
                  c1, o1 = gh("api", "-X", "PATCH", f"repos/{repo}", "-f", "description=" + want["d"], "-f", "homepage=" + want["h"])
                  args = ["api", "-X", "PUT", f"repos/{repo}/topics"]
                  for t in want["t"]: args += ["-f", "names[]=" + t]
                  if not want["t"]: args += ["--input", "/dev/stdin"]
                  c2, o2 = gh(*args)
                  print(("ok   " if c1 == 0 and c2 == 0 else "FAIL ") + repo + " settings" + ("" if c1 == 0 and c2 == 0 else " " + (o1 + o2)[:200]))
                  if c1 == 0 and c2 == 0: done["settings"][repo] = want
          json.dump(done, open("scribe/published.json", "w"), indent=1)
          PY
      - run: |
          git config user.name "control-troll-bot"
          git config user.email "control-troll-bot@users.noreply.github.com"
          git add scribe/published.json
          git diff --cached --quiet || git commit -m "scribe published"
          git pull --rebase origin main
          git push
