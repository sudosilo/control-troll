name: auth-check
# Reports which credential the agents will use. Runs no Claude, costs nothing.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record the credential in use
        env:
          AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' && 'api key' || 'subscription token' }}
        run: |
          mkdir -p agents/runs
          echo "{\"checkedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"auth\": \"$AUTH\"}" > agents/runs/auth.json
          git config user.name control-troll-bot
          git config user.email control-troll-bot@users.noreply.github.com
          git add agents/runs/auth.json
          git commit -m "auth check" || true
          git pull --rebase origin main && git push
