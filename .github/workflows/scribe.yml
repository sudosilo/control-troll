name: scribe
# Runs the Control Troll scribe agent with Claude Code on the account's Claude subscription.
# CLAUDE_CODE_OAUTH_TOKEN comes from claude setup-token. SCRIBE_TOKEN gives git and gh access to every repo.
on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:
concurrency:
  group: scribe
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SCRIBE_TOKEN }}
          fetch-depth: 0
      - name: Sign git in as the account
        env:
          TOKEN: ${{ secrets.SCRIBE_TOKEN }}
        run: |
          git config --global user.name "control-troll-scribe"
          git config --global user.email "control-troll-scribe@users.noreply.github.com"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global pull.rebase true
      - name: Note the start time
        id: now
        run: echo "t=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          GH_TOKEN: ${{ secrets.SCRIBE_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ secrets.SCRIBE_TOKEN }}
          prompt: ${{ format('Read agents/scribe.md in the current folder and carry out every step in it. Today is {0}.', steps.now.outputs.t) }}
          claude_args: |
            --max-turns 250
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
      - name: Save the run result for review
        if: always() && steps.claude.outcome != 'skipped'
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
          AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' && 'api key' || 'subscription token' }}
        run: |
          mkdir -p agents/runs
          if [ -f "$EXEC" ]; then
            python3 -c "
          import json,sys
          d=json.load(open(sys.argv[1]))
          last=[m for m in d if m.get('type')=='result']
          json.dump(last[-1] if last else d[-3:], open('agents/runs/scribe-last.json','w'), indent=1)
          import os,datetime
          r=last[-1] if last else {}
          row={'at':datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),'agent':'scribe','auth':os.environ.get('AUTH'),'cost':round(r.get('total_cost_usd',0) or 0,4),'turns':r.get('num_turns'),'seconds':round((r.get('duration_ms') or 0)/1000),'models':sorted((r.get('modelUsage') or {}).keys())}
          open('agents/runs/cost-log.jsonl','a').write(json.dumps(row)+'\\n')
          " "$EXEC"
          else
            echo '{"note":"no execution file"}' > agents/runs/scribe-last.json
          fi
          git add agents/runs/scribe-last.json agents/runs/cost-log.jsonl agents/notes
          git commit -m "scribe run result" || true
          git pull --rebase origin main && git push || true
