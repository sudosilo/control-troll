<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Family Tree</title>
<style>
:root{--blue:#1f6feb;--blue2:#e3eeff;--ink:#1b2430;--muted:#6b7686;--bg:#f5f8fc;--card:#fff;--line:#d6dde8;--good:#1a8f4e;--bad:#c2412d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue)}
#top{position:fixed;top:0;left:0;right:0;height:150px;background:#fff;border-bottom:2px solid var(--blue);z-index:10}
.r1{height:52px;display:flex;align-items:center;gap:6px;padding:0 8px}
#burger{flex:0 0 44px;width:44px;height:44px;border:0;background:var(--blue2);border-radius:10px;font-size:22px;color:var(--blue)}
.stat{flex:1;min-width:0;font-size:11px;color:var(--muted);line-height:1.15}
.stat b{display:block;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r2{height:46px;display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;padding:2px 8px 6px;position:relative}
.r2 button{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:10px;font-weight:700;font-size:14px}
.r2 button.main{background:var(--blue);color:#fff}
.ybar{position:absolute;left:8px;right:8px;bottom:0;height:3px;background:var(--blue2);border-radius:3px;overflow:hidden}
.ybar i{display:block;height:100%;width:0;background:var(--blue)}
#tabs{height:50px;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:6px 6px}
#tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;font-size:12px;font-weight:600;color:var(--ink);padding:0}
#tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#main{position:fixed;top:150px;bottom:0;left:0;right:0;overflow-y:auto;padding:10px 10px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.card.tap{cursor:pointer}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch b{font-size:15px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.pill{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--blue2);color:var(--blue);font-weight:700;white-space:nowrap}
.pill.grey{background:#eef0f3;color:var(--muted)}
.pill.red{background:#fde8e4;color:var(--bad)}
.pill.green{background:#e2f5ea;color:var(--good)}
.pills{display:flex;gap:4px;align-items:center}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.bars.four{grid-template-columns:repeat(4,1fr)}
.bars div{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden}
.bars span{display:block;height:5px;background:#eef1f6;border-radius:4px;overflow:hidden;margin-top:2px}
.bars span i{display:block;height:100%;background:var(--blue)}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.slot{border:1px dashed var(--line);background:#fafcff;border-radius:9px;height:42px;font-size:12px;text-align:left;padding:4px 8px;overflow:hidden;color:var(--ink)}
.slot.f{border:1px solid var(--blue);background:var(--blue2)}
.slot small{display:block;color:var(--muted);font-size:10px}
.acts{display:grid;grid-template-columns:2fr 1fr;gap:6px;margin-top:8px}
.btn{height:40px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;font-size:13px;width:100%}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.red{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{background:#c9d3e2;color:#fff;border:0}
.btn.ghost:disabled{background:#fff;color:#b5c0d0;border:1px solid #d5dce6}
h3{margin:14px 2px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--blue)}
.banner{background:linear-gradient(135deg,#1f6feb,#4f93ff);color:#fff;border-radius:12px;padding:12px;margin-bottom:10px}
.banner small{opacity:.85}
.log div{font-size:13px;padding:7px 2px;border-bottom:1px solid #e8edf4}
.log b{color:var(--blue);margin-right:6px}
#ovBg,#drBg{position:fixed;inset:0;background:rgba(20,30,50,.35);z-index:50;display:none}
#ovBg.on,#drBg.on{display:block}
#ov{position:absolute;left:10px;right:10px;top:50px;max-height:calc(100% - 70px);overflow-y:auto;background:#fff;border-radius:14px;padding:14px;border-top:4px solid var(--blue)}
#ov h2{margin:0 0 4px;font-size:19px;padding-right:40px}
#ov .x{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;background:var(--blue2);color:var(--blue);border-radius:9px;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.grid3 .btn,.grid4 .btn{font-size:11px;height:50px;line-height:1.2;padding:0 2px}
.kv{font-size:13px;margin:3px 0}
.kv span{color:var(--muted)}
.pickrow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;border:1px solid var(--line);background:#fff;border-radius:10px;margin-top:6px;padding:4px 10px;font-size:14px;color:var(--ink);text-align:left;gap:8px}
.pickrow em{font-style:normal;color:var(--blue);font-weight:700;white-space:nowrap}
.pickrow small{display:block;color:var(--muted);font-size:11px}
.pickrow:disabled{opacity:.45}
#drawer{position:absolute;left:0;top:0;bottom:0;width:78%;max-width:320px;background:#fff;overflow-y:auto;padding:14px;border-right:4px solid var(--blue)}
details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:0 10px}
summary{height:44px;line-height:44px;font-weight:700;color:var(--blue);list-style:none}
details p{font-size:13px;line-height:1.45;margin:0 0 10px}
details .btn{margin-bottom:8px}
#treeWrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;height:calc(100vh - 230px)}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.ladder div{font-size:13px;padding:5px 0;border-top:1px solid #eef1f6;display:flex;justify-content:space-between;gap:6px}
.ladder small{color:var(--muted)}
.why{font-size:12px;background:var(--blue2);border-radius:9px;padding:8px;margin-top:8px;line-height:1.4}
</style>
</head>

function fmt(n){const neg=n<0;n=Math.abs(n);const u=[["",1],["K",1e3],["M",1e6],["B",1e9],["T",1e12],["Qa",1e15],["Qi",1e18],["Sx",1e21],["Sp",1e24]];let i=0;while(i<u.length-1&&n>=u[i+1][1])i++;const v=n/u[i][1];return(neg?"-":"")+"$"+(i?v.toFixed(v<10?2:v<100?1:0):Math.round(v))+u[i][0]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem(KEY);if(t){S=JSON.parse(t);idx();return true}}catch(e){}return false}
function idx(){M={};S.members.forEach(m=>M[m.id]=m)}
function log(t){S.log.unshift({y:S.year,t});if(S.log.length>300)S.log.length=300}
function living(){return S.members.filter(m=>m.alive)}
function nm(m){return m.first+" "+m.last}
function cap(){return HOMES[S.home].cap+S.wings*8}
function cityMult(){return 1+0.6*S.city}
function newCityName(){let n;do{n=pick(CS1)+pick(CS2)}while(S.cities.includes(n));return n}
function def(b){return BIZ.find(x=>x.k===b.k)}
function slotsOf(b){return def(b).slots+Math.floor((b.lvl-1)/3)}
function bizName(b){return def(b).n+(b.no>1?" #"+b.no:"")}
function blankSk(){const o={};DK.forEach(d=>o[d]=0);return o}
function randAl(){const r=Math.random();return r<.45?"L":r<.85?"N":"C"}
function newMember(o){const m=Object.assign({id:S.nextId++,sex:"F",age:0,alive:true,born:S.year,died:null,parents:null,spouse:null,blood:true,last:S.surname,smarts:ri(10,35),charm:ri(10,35),grit:ri(10,35),school:false,sk:blankSk(),al:randAl(),career:null,cyears:0,hist:[],wealth:0,hobby:null,hob:{},mode:"full",retired:false,kidjob:null,disabled:false,jail:0,lessons:0,lock:false,ra:ri(60,72),pay:0},o);if(!m.first)m.first=pick(m.sex==="F"?FN:MN);S.members.push(m);M[m.id]=m;S.ever++;return m}
function newGame(){
 S={year:1950,money:1500,nextId:1,members:[],biz:[],bizUid:1,home:0,wings:0,city:0,cities:[],log:[],surname:pick(SURN),speed:1,paused:false,boost:0,lastInc:0,ever:0,peak:0,found:[],unlocked:[]};
 M={};S.cities.push(newCityName());
 const a=newMember({sex:"M",age:24,born:1926,smarts:ri(25,45),charm:ri(25,45),grit:ri(25,45)});
 const b=newMember({sex:"F",age:22,born:1928,blood:false,last:pick(SURN.filter(s=>s!==S.surname)),smarts:ri(25,45),charm:ri(25,45),grit:ri(25,45)});
 a.sk[pick(DK)]=ri(10,25);b.sk[pick(DK)]=ri(10,25);[a,b].forEach(m=>{m.hobby=pick(HOBBIES).k;m.hob[m.hobby]=ri(5,30)});
 a.spouse=b.id;b.spouse=a.id;
 log("The "+S.surname+" family begins in "+S.cities[0]+" with "+a.first+" and "+b.first+".");
 T=totals();[a,b].forEach(m=>chooseCareer(m,true));
 save();
}
function totals(){const t=blankSk();living().forEach(m=>DK.forEach(d=>t[d]+=m.sk[d]));return t}
function jobOf(id){for(const b of S.biz){const i=b.staff.indexOf(id);if(i>=0)return{b,i}}return null}
function canWork(m){return m&&m.alive&&m.age>=16&&m.age<=72&&!m.disabled&&!m.jail}
function alOk(m,c){return !c.al||c.al===m.al}
function canTake(m,c){return alOk(m,c)&&effSk(m,c)>=c.req}
function streak(m,k,depth){depth=depth||0;if(!m.parents||depth>15)return 0;let best=0;m.parents.forEach(pid=>{const p=M[pid];if(p&&p.hist.includes(k))best=Math.max(best,1+streak(p,k,depth+1))});return best}
function careerPay(m,c){const yrs=m.career===c.k?m.cyears:0;const st=streak(m,c.k);const ln=1+0.3*st;let sm=1;const parts=[];c.syn.forEach(d=>{const b=Math.min(0.6,((T[d]||0)-m.sk[d])/500);if(b>0.02){sm*=1+b;parts.push([d,b])}});const hb=hobbyBoost(m,c);const v=c.pay*(1+m.sk[c.d]/40)*(0.6+m[c.a]/80)*ln*sm*hb*(1+Math.min(0.6,yrs*0.03))*cityMult();return{v,ln,st,sm,parts,hb}}
function an(w){return(/^[aeiou]/i.test(w)?"an ":"a ")+w}
function genWord(st){return st>=1?(GENW[st]||((st+1)+"th"))+" generation":""}
function roleLabel(m){if(!m.alive)return"Remembered";if(m.jail)return"In jail, "+m.jail+" yr left";if(m.disabled)return"Disabled, needs care"+(m.hobby?", "+hobbyLabel(m):"");const j=jobOf(m.id);if(j)return roleOf(j.b,j.i).n+" at "+bizName(j.b);if(m.age<18)return(m.kidjob?KJ[m.kidjob].n:"Kid")+(m.school?", in school":"")+(m.hobby?", "+hobbyLabel(m):"");if(m.retired)return"Retired, "+hobbyLabel(m);if(m.mode==="hobby")return"No job, "+hobbyLabel(m);if(m.career){const c=CK[m.career];const st=streak(m,c.k);return c.n+(st?", "+genWord(st):"")+(m.mode==="part"?", part time":"")}return"Between jobs"}
function roleOf(b,i){const d=def(b);if(i<ROLES.length){const r=ROLES[i];return{n:r.n,stat:i===0?d.stat:r.stat,dom:r.dom||d.dom}}return{n:"Worker",stat:d.stat,dom:d.dom}}
function unassign(id){const j=jobOf(id);if(j)j.b.staff[j.i]=null}
function staffVal(b,m,i){const d=def(b);const r=roleOf(b,i);const n=slotsOf(b);const base=d.inc*Math.pow(1.6,b.lvl-1);return base/n*(0.4+m[r.stat]/60+m.sk[r.dom]/80)*cityMult()}
function bizIncome(b){const d=def(b);const base=d.inc*Math.pow(1.6,b.lvl-1);const n=slotsOf(b);let sum=0;for(let i=0;i<n;i++){const m=M[b.staff[i]];const r=roleOf(b,i);sum+=m?(0.4+m[r.stat]/60+m.sk[r.dom]/80):0.15}const mg=M[b.staff[0]],bk=M[b.staff[1]],mt=M[b.staff[2]];const mm=(mg?1+mg.smarts/250:1)*(bk?1+bk.sk.money/400:1)*(mt?1+mt.sk.trade/400:1);return base/n*sum*mm*cityMult()*(S.boost?1.25:1)}
function careerIncome(){return living().reduce((t,m)=>t+(m.career&&m.mode!=="hobby"&&m.age>=18&&!m.jail&&!m.disabled&&!jobOf(m.id)?careerPay(m,CK[m.career]).v*0.85*(m.mode==="part"?0.5:1):0)+(m.kidjob?kidPay(m)*0.5:0),0)}
function upkeep(){return living().reduce((t,m)=>t+40*(1+S.city*0.4)*(1+S.home*0.15)*(m.disabled?3:m.jail?0.3:1)+(m.school?schoolCost():0),0)}
function schoolCost(){return Math.round(300*(1+S.city))}
function grossIncome(){return S.biz.reduce((t,b)=>t+bizIncome(b),0)+careerIncome()}
function netIncome(){return grossIncome()-upkeep()}
function worth(){return S.money+S.biz.reduce((t,b)=>t+b.spent*0.5,0)}
function buyCost(d){const owned=S.biz.filter(b=>b.k===d.k).length;return Math.round(d.cost*Math.pow(1.5,owned))}
function upCost(b){return Math.round(def(b).cost*Math.pow(1.8,b.lvl)*0.6)}
function homeNext(){if(S.home<HOMES.length-1)return{n:HOMES[S.home+1].n,cost:HOMES[S.home+1].cost,cap:HOMES[S.home+1].cap};return{n:"New wing",cost:Math.round(2.5e7*Math.pow(3,S.wings)),cap:cap()+8}}
function cityCost(){return Math.round(60000*Math.pow(12,S.city))}
function trainCost(m,s){return Math.round(100*Math.pow(1.07,m[s]-10)*(1+S.city*0.3))}
function matchCost(){return Math.round(1500*Math.pow(4,S.city))}
function retireGoal(){return Math.round(200000*cityMult())}
function mentor(m,d){return living().find(r=>r!==m&&(r.retired||r.mode==="hobby"||r.disabled||r.age>=60)&&r.sk[d]>=20)}
function famTrade(m){const ps=(m.parents||[]).map(p=>M[p]).filter(Boolean);let best=null,bv=19;ps.forEach(p=>DK.forEach(d=>{if(p.sk[d]>bv){bv=p.sk[d];best=d}}));return best}
function teachCost(m,d){return Math.round(400*Math.pow(1.35,m.lessons)*(1+S.city*0.5)*(mentor(m,d)?0.5:1))}
function head(){const l=living().filter(m=>m.blood).sort((a,b)=>b.age-a.age);return l[0]||living().sort((a,b)=>b.age-a.age)[0]}
function gens(){const g={};const f=m=>{if(g[m.id]!=null)return g[m.id];g[m.id]=0;let v=0;if(m.parents&&M[m.parents[0]])v=f(M[m.parents[0]])+1;else if(!m.blood&&M[m.spouse])v=f(M[m.spouse]);g[m.id]=v;return v};S.members.forEach(f);return g}
function relativeCop(m){return living().find(r=>r!==m&&r.career==="cop"||r!==m&&r.career==="detective")}
function discover(m,c,parts){parts.forEach(([d])=>{const key=c.k+"|"+d;if(!S.found.includes(key)){S.found.push(key);log("Synergy found: "+c.n+" gets a boost from "+DOM[d].n+" relatives ("+m.first+").")}})}
function setCareer(m,c,reason){if(m.career&&m.career!==c.k&&reason)log(m.first+" left "+CK[m.career].n+" to become "+an(c.n)+", "+reason+".");m.career=c.k;m.cyears=0;if(!m.hist.includes(c.k))m.hist.push(c.k);const st=streak(m,c.k);if(st>=1)log(m.first+" is now "+an(genWord(st))+" "+c.n+".")}
function chooseCareer(m,quiet){if(m.age<18)return;const opts=CAREERS.filter(c=>canTake(m,c)).map(c=>({c,v:careerPay(m,c).v*(0.7+Math.random()*0.6)})).sort((a,b)=>b.v-a.v);if(!opts.length)return;const c=opts[Math.random()<.6?0:Math.min(opts.length-1,ri(1,2))].c;const had=m.career;setCareer(m,c,null);if(!quiet&&!had)log(m.first+" started work as "+an(c.n)+".")}
function marry(m,q){if(living().length>=cap())return false;const sp=newMember({sex:m.sex==="F"?"M":"F",age:Math.max(18,m.age+ri(-4,4)),blood:false,last:pick(SURN.filter(s=>s!==S.surname)),smarts:ri(10,40)+q+S.city*4,charm:ri(10,40)+q+S.city*4,grit:ri(10,40)+q+S.city*4});sp.born=S.year-sp.age;sp.sk[pick(DK)]=ri(5,25)+q;if(Math.random()<.5)sp.sk[pick(DK)]+=ri(5,15);sp.al=Math.random()<.5?m.al:randAl();m.spouse=sp.id;sp.spouse=m.id;log(m.first+" married "+nm(sp)+", a "+AL[sp.al].n.toLowerCase()+".");T=totals();chooseCareer(sp,false);return true}
function die(m,why){m.alive=false;m.died=S.year;unassign(m.id);m.school=false;let t=nm(m)+" "+(why||"passed away")+" at "+m.age+".";if(m.wealth>1){S.money+=m.wealth;t+=" Left "+fmt(m.wealth)+" to the family.";m.wealth=0}log(t)}
function tierOf(l){let t=0;TIERS.forEach((x,i)=>{if(l>=x[1])t=i});return t}
function hobLvl(m){return m.hobby?(m.hob[m.hobby]||0):0}
function hobbyLabel(m){if(!m.hobby)return"";return HK[m.hobby].n+" ("+TIERS[tierOf(hobLvl(m))][0].toLowerCase()+")"}
function effSk(m,c){let s=m.sk[c.d];if(m.hobby&&HK[m.hobby].pro.includes(c.k))s+=Math.floor(hobLvl(m)/3);return s}
function hobbyBoost(m,c){if(!m.hobby)return 1;const h=HK[m.hobby],t=tierOf(hobLvl(m));if(h.pro.includes(c.k))return 1+t*0.06;if(h.d===c.d)return 1+t*0.03;return 1}
function kidPay(m){const j=KJ[m.kidjob];return j.pay*(1+m[j.a]/100)*cityMult()}
function hoursOf(m){if(m.disabled)return 4;if(m.age<18)return m.kidjob?3:5;if(m.retired||m.mode==="hobby")return 7;if(m.mode==="part")return 4;return 1.5}
function wf(k){return Math.round(Math.max(2000*cityMult(),upkeep())*k*(0.6+Math.random()*0.8))}
function yearTick(){
 if(!living().length)return;
 S.year++;
 living().forEach(m=>m.age++);
 T=totals();
 let gross=0;
 S.biz.forEach(b=>{b.staff.forEach((id,i)=>{const m=M[id];if(!m)return;if(m.age>72||!canWork(m)){b.staff[i]=null;return}const r=roleOf(b,i);m[r.stat]=Math.min(250,m[r.stat]+1);m.sk[r.dom]+=2;m.wealth+=staffVal(b,m,i)*0.1})});
 living().forEach(m=>{
  if(m.jail){m.jail--;if(!m.jail){log(m.first+" got out of jail.");if(Math.random()<.35){m.al="N";log(m.first+" says they are going straight.")}}return}
  if(m.school){if(m.age>17){m.school=false;log(m.first+" graduated.")}else m.smarts+=3}
  if(!m.hobby&&m.age>=6)m.hobby=pick(HOBBIES).k;
  if(m.hobby){const h=HK[m.hobby];const before=tierOf(hobLvl(m));m.hob[m.hobby]=(m.hob[m.hobby]||0)+hoursOf(m);const after=tierOf(hobLvl(m));if(after>before&&after>=2)log(m.first+" is now "+an(TIERS[after][0].toLowerCase())+" at "+h.n+".");if(after>=2&&Math.random()<.3)m.sk[h.d]+=1;
   if((m.mode==="hobby"||m.age<18||m.disabled||m.retired)&&Math.random()<0.08+after*0.05){const s=Math.round(150*Math.pow(after+1,2)*cityMult());gross+=s;if(Math.random()<.3)log(m.first+" made "+fmt(s)+" from "+h.n+".")}}
  if(m.retired||m.mode==="hobby")m.wealth*=0.95;
  if(m.kidjob){if(m.age>=18){log(m.first+" aged out of "+KJ[m.kidjob].n.toLowerCase()+".");m.kidjob=null}else{const j=KJ[m.kidjob];const v=kidPay(m);gross+=v*0.5;m.wealth+=v*0.5;m.sk[j.d]+=1;if(Math.random()<.3)m[j.a]+=1}}
  m.pay=0;
  if(m.career&&m.mode!=="hobby"&&!m.disabled&&!jobOf(m.id)&&m.age>=18){const c=CK[m.career];const p=careerPay(m,c);const f=m.mode==="part"?0.5:1;m.pay=p.v*f;gross+=m.pay*0.85;m.wealth+=m.pay*0.15;m.cyears+=f;m.sk[c.d]+=f===1?2:1;if(Math.random()<.4*f)m[c.a]=Math.min(250,m[c.a]+1);discover(m,c,p.parts)}
 });
 gross+=S.biz.reduce((t,b)=>t+bizIncome(b),0);
 const up=upkeep();S.money+=gross-up;S.lastInc=gross-up;
 const tight=S.money<up*2||S.lastInc<0,rich=S.money>up*40&&S.lastInc>up;
 living().filter(m=>m.age>=8&&m.age<18&&!m.disabled&&!m.jail).forEach(m=>{if(m.kidjob){if(!tight&&Math.random()<.1){log(m.first+" quit "+KJ[m.kidjob].n.toLowerCase()+".");m.kidjob=null}}else if(Math.random()<(tight?.45:.08)){const ops=KIDJOBS.filter(j=>j.age<=m.age);if(ops.length){const j=pick(ops);m.kidjob=j.k;log(m.first+(tight?" chipped in with money tight and started ":" started ")+j.n.toLowerCase()+".")}}});
 living().forEach(m=>{
  if(m.age<18||m.jail)return;
  const c=m.career?CK[m.career]:null;const working=!!(c&&m.mode!=="hobby"&&!jobOf(m.id));
  if(m.disabled){if(Math.random()<.04){m.disabled=false;log(m.first+" recovered and can work again.")}return}
  if(Math.random()<0.0015+(working&&c.risk?c.risk*0.6*(m.mode==="part"?.5:1):0)){m.disabled=true;unassign(m.id);m.career=null;m.mode="hobby";log(m.first+" was badly hurt"+(working?" on the job as "+an(c.n):"")+" and can no longer work. Their care costs the family more now.");return}
  if(working&&c.heat){const lawyers=(T.law-m.sk.law);const p=c.heat*(1-Math.min(0.7,lawyers/300))*(m.mode==="part"?.5:1);if(Math.random()<p){const cop=relativeCop(m);m.jail=ri(2,6);m.career=null;if(cop&&Math.random()<.35)log("Officer "+cop.first+" arrested their own relative "+m.first+" for working as "+an(c.n)+". "+m.jail+" years.");else log(m.first+" got busted working as "+an(c.n)+". "+m.jail+" years in jail.");return}else if(lawyers>40&&Math.random()<.05)log("The family lawyers kept "+m.first+" out of trouble again.")}
  if(Math.random()<.012){const old=m.al;m.al=m.al==="C"?(Math.random()<.5?"N":"L"):m.al==="L"?"N":(Math.random()<.5?"C":"L");if(old!==m.al)log(m.first+" is now "+AL[m.al].n.toLowerCase()+".");if(c&&!alOk(m,c))m.career=null}
  if(m.retired){if(tight&&m.age<70&&m.wealth<20000*cityMult()&&Math.random()<.15){m.retired=false;m.mode="full";log(m.first+" came out of retirement to help the family.")}return}
  if(m.age>=m.ra&&!m.lock){unassign(m.id);m.retired=true;m.mode="hobby";m.career=null;log(m.first+" retired at "+m.age+(m.hobby?" to focus on "+HK[m.hobby].n:"")+".");return}

 next(){if(modal)return;acc=0;yearTick()},
 close(){$("ovBg").classList.remove("on");modal=false;askOpen=false;render()},
 choose(i){const f=choices[i];askOpen=false;A.close();f&&f();T=totals();save();render()},
 treeMode(v){treeAll=v;render()},
 member(id){T=totals();const m=M[id];const par=m.parents?m.parents.map(p=>M[p]).filter(Boolean):[];const spo=M[m.spouse];const kids=S.members.filter(k=>k.parents&&k.parents.includes(id));
  let h=`<h2>${nm(m)}</h2><div class="sub">${m.alive?"Age "+m.age+" &middot; born "+m.born:"Lived "+m.born+" to "+m.died} &middot; ${AL[m.al].n}${m.blood?"":" &middot; married in"}</div>${bars(m)}${skBars(m)}
  <div style="margin-top:10px"><div class="kv"><span>Role</span> ${roleLabel(m)}</div><div class="kv"><span>Own savings</span> ${fmt(m.wealth)}</div>${m.hist.length?`<div class="kv"><span>Careers held</span> ${m.hist.map(k=>CK[k].n).join(", ")}</div>`:""}${par.length?`<div class="kv"><span>Parents</span> ${par.map(p=>`<a href="#" onclick="A.member(${p.id});return false">${p.first}</a>`).join(" and ")}</div>`:""}${spo?`<div class="kv"><span>Spouse</span> <a href="#" onclick="A.member(${spo.id});return false">${nm(spo)}</a></div>`:""}${kids.length?`<div class="kv"><span>Children</span> ${kids.map(k=>`<a href="#" onclick="A.member(${k.id});return false">${k.first}</a>`).join(", ")}</div>`:""}</div>`;
  if(m.alive&&m.career&&m.mode!=="hobby"&&!jobOf(id))h+=`<div class="why">${payWhy(m,CK[m.career])}</div>`;
  if(m.alive){
   if(m.age>=4&&m.age<=17){const ft=famTrade(m);h+=`<h3>Teach ${m.first}</h3><div class="sub">Each lesson costs more than the last. A parent skilled in a field teaches it better. A retired or older relative who knows the field cuts the cost in half.</div><div class="grid4">${DK.map(d=>{const c=teachCost(m,d);return`<button class="btn ${d===ft?'':'ghost'}" ${S.money<c?"disabled":""} onclick="A.teach(${id},'${d}')">${DOM[d].n}${d===ft?"<br>family trade":""}<br>${fmt(c)}</button>`}).join("")}</div>`}
   h+=`<h3>Training</h3><div class="grid3">${STATS.map(s=>{const c=trainCost(m,s);return`<button class="btn ghost" ${S.money<c?"disabled":""} onclick="A.train(${id},'${s}')">${s} plus five<br>${fmt(c)}</button>`}).join("")}</div>`;
   if(canWork(m)&&m.age>=18&&!jobOf(id)&&!m.retired)h+=`<h3>Work time</h3><div class="grid3">${[["full","Full time"],["part","Part time"],["hobby","Hobby only"]].map(([k,n])=>`<button class="btn ${m.mode===k?'':'ghost'}" onclick="A.mode(${id},'${k}')">${n}</button>`).join("")}</div>`;
   h+=`<h3>Hobby</h3><div class="sub">${m.hobby?HK[m.hobby].n+", "+TIERS[tierOf(hobLvl(m))][0].toLowerCase()+" at "+Math.floor(hobLvl(m))+". Can turn into "+HK[m.hobby].pro.map(k=>CK[k].n).join(" or ")+".":"No hobby yet."}</div>`;
   h+=`<h3>Choices</h3><div class="grid2">`;
   h+=`<button class="btn ghost" onclick="A.hobbies(${id})">Change hobby</button>`;
   if(m.age>=8&&m.age<=17&&!m.jail&&!m.disabled)h+=m.kidjob?`<button class="btn red" onclick="A.setKJ(${id},null)">Quit ${KJ[m.kidjob].n.toLowerCase()}</button>`:`<button class="btn ghost" onclick="A.kidjobs(${id})">Get a kid job</button>`;
   if(canWork(m)&&m.age>=18&&!jobOf(id)&&!m.retired)h+=`<button class="btn" onclick="A.careers(${id})">Pick a career</button><button class="btn ghost" onclick="A.lock(${id})">${m.lock?"Unlock career":"Lock career"}</button>`;
   if(m.age>=5&&m.age<=17)h+=`<button class="btn ghost" onclick="A.school(${id})">${m.school?"Leave school":"School "+fmt(schoolCost())+" a year"}</button>`;
   if(m.blood&&m.spouse==null&&m.age>=18&&m.age<=60)h+=`<button class="btn ghost" ${S.money<matchCost()||living().length>=cap()?"disabled":""} onclick="A.match(${id})">Find a strong match ${fmt(matchCost())}</button>`;
   if(canWork(m))h+=jobOf(id)?`<button class="btn red" onclick="A.fire(${id})">Remove from business</button>`:`<button class="btn ghost" onclick="A.jobs(${id})">Work in family business</button>`;
   if(m.retired)h+=`<button class="btn" onclick="A.unretire(${id})">Come out of retirement</button>`;else if(canWork(m)&&m.age>=18)h+=`<button class="btn ghost" onclick="A.retire(${id})">Retire</button>`;
   h+=`</div>`}
  openOv(h)},
 careers(id){T=totals();const m=M[id];const l=CAREERS.map(c=>({c,ok:canTake(m,c),v:careerPay(m,c).v})).sort((a,b)=>(b.ok-a.ok)||b.v-a.v);
  let h=`<h2>Career for ${m.first}</h2><div class="sub">${AL[m.al].n}. Gray ones need more skill or a different alignment.</div>`;
  l.forEach(o=>{const p=careerPay(m,o.c);h+=`<button class="pickrow" ${o.ok?"":"disabled"} onclick="A.setC(${id},'${o.c.k}')"><span>${o.c.n}${m.career===o.c.k?" (now)":""}<small>${DOM[o.c.d].n} ${effSk(m,o.c)} of ${o.c.req}${o.c.al?" &middot; "+(o.c.al==="C"?"crooked only":"straight only"):""}${p.st?" &middot; "+genWord(p.st):""}${p.parts.length?" &middot; synergy":""}${p.hb>1?" &middot; hobby boost":""}</small></span><em>${fmt(o.v)}</em></button>`});openOv(h)},
 setC(id,k){const m=M[id];unassign(id);if(m.mode==="hobby")m.mode="full";m.retired=false;setCareer(m,CK[k],m.career?"on the family's say so":null);save();A.member(id)},
 lock(id){M[id].lock=!M[id].lock;save();A.member(id)},
 teach(id,d){const m=M[id],c=teachCost(m,d);if(S.money<c)return;S.money-=c;const ps=(m.parents||[]).map(p=>M[p]).filter(Boolean);const pb=ps.some(p=>p.sk[d]>=20);const me=mentor(m,d);const g=6+(pb?4:0)+Math.floor(m.smarts/25);m.sk[d]+=g;m.lessons++;log(m.first+" learned "+DOM[d].n+(me?" from "+me.first:"")+(pb?" at the dinner table":"")+".");save();A.member(id);render()},
 train(id,s){const m=M[id],c=trainCost(m,s);if(S.money<c)return;S.money-=c;m[s]+=5;save();A.member(id);render()},
 school(id){const m=M[id];m.school=!m.school;save();A.member(id);render()},
 match(id){const m=M[id],c=matchCost();if(S.money<c)return;if(marry(m,25+S.city*8)){S.money-=c}save();A.member(id);render()},
 fire(id){unassign(id);save();A.member(id);render()},
 retire(id){const m=M[id];unassign(id);m.career=null;m.mode="hobby";m.retired=true;log(m.first+" retired"+(m.hobby?" to focus on "+HK[m.hobby].n:"")+".");save();A.member(id)},
 unretire(id){const m=M[id];m.retired=false;m.mode="full";log(m.first+" came out of retirement.");T=totals();chooseCareer(m,false);save();A.member(id)},
 mode(id,k){const m=M[id];m.mode=k;if(k==="hobby"){m.career=null;log(m.first+" stopped working to focus on "+(m.hobby?HK[m.hobby].n:"relaxing")+".")}else{T=totals();if(!m.career)chooseCareer(m,false)}save();A.member(id)},
 hobbies(id){const m=M[id];let h=`<h2>Hobby for ${m.first}</h2><div class="sub">Levels carry over if they come back to an old hobby. Expert hobbies can turn into a career.</div>`;HOBBIES.slice().sort((a,b)=>(m.hob[b.k]||0)-(m.hob[a.k]||0)).forEach(x=>{const l=m.hob[x.k]||0;h+=`<button class="pickrow" onclick="A.setH(${id},'${x.k}')"><span>${x.n}${m.hobby===x.k?" (now)":""}<small>${DOM[x.d].n} &middot; leads to ${x.pro.map(k=>CK[k].n).join(", ")}</small></span><em>${l?TIERS[tierOf(l)][0]+" "+Math.floor(l):"new"}</em></button>`});openOv(h)},
 setH(id,k){M[id].hobby=k;save();A.member(id)},
 kidjobs(id){const m=M[id];let h=`<h2>Kid job for ${m.first}</h2><div class="sub">Half the pay goes to ${m.first}'s savings and half to the family. It also builds a little skill in its field.</div>`;KIDJOBS.forEach(j=>{const ok=j.age<=m.age;const v=ok?j.pay*(1+m[j.a]/100)*cityMult():0;h+=`<button class="pickrow" ${ok?"":"disabled"} onclick="A.setKJ(${id},'${j.k}')"><span>${j.n}<small>${DOM[j.d].n} &middot; age ${j.age} and up</small></span><em>${ok?fmt(v):""}</em></button>`});openOv(h)},
 setKJ(id,k){const m=M[id];if(k&&m.kidjob!==k)log(m.first+" started "+KJ[k].n.toLowerCase()+".");m.kidjob=k;save();A.member(id)},
 jobs(id){const m=M[id];let h=`<h2>Business job for ${m.first}</h2><div class="sub">Value is what ${m.first} would add there. Taking a slot ends their outside career.</div>`;let any=false;
  S.biz.forEach(b=>{const d=def(b);for(let i=0;i<slotsOf(b);i++){if(b.staff[i]!=null)continue;any=true;const r=roleOf(b,i);h+=`<button class="pickrow" onclick="A.put(${b.uid},${i},${id})"><span>${r.n} at ${bizName(b)}<small>${r.stat} ${m[r.stat]} &middot; ${DOM[r.dom].n} ${m.sk[r.dom]}</small></span><em>${fmt(staffVal(b,m,i))}</em></button>`}});
  if(!any)h+=`<p class="sub">No open slots. Buy or upgrade a business to add jobs.</p>`;openOv(h)},
 slot(uid,i){const b=S.biz.find(x=>x.uid===uid),d=def(b);const cur=M[b.staff[i]];const l=living().filter(canWork).sort((a,c)=>staffVal(b,c,i)-staffVal(b,a,i));
  const rr=roleOf(b,i);let h=`<h2>${rr.n} at ${bizName(b)}</h2><div class="sub">Uses ${rr.stat} and ${DOM[rr.dom].n}. Sorted by value added.${i===0?" Managers add smarts to the whole business.":i===1?" Bookkeepers add Money skill to the whole business.":i===2?" Maintenance adds Trade skill to the whole business.":""}</div>`;
  if(cur)h+=`<button class="pickrow" onclick="A.put(${uid},${i},null)"><span>Leave this job open</span><em>remove ${cur.first}</em></button>`;
  l.forEach(m=>{h+=`<button class="pickrow" onclick="A.put(${uid},${i},${m.id})"><span>${nm(m)}<small>${roleLabel(m)}${m.pay?" &middot; "+fmt(m.pay):""}</small></span><em>${fmt(staffVal(b,m,i))}</em></button>`});
  if(!l.length)h+=`<p class="sub">Nobody able to work.</p>`;openOv(h)},
 put(uid,i,id){const b=S.biz.find(x=>x.uid===uid);if(id!=null){unassign(id);const m=M[id];m.career=null;m.mode="full";m.retired=false;m.kidjob=null;m.pay=0}else{const m=M[b.staff[i]];b.staff[i]=null;if(m){T=totals();chooseCareer(m,false)}}b.staff[i]=id;save();A.close()},
 auto(){T=totals();const open=[];S.biz.forEach(b=>{for(let i=0;i<slotsOf(b);i++)if(b.staff[i]==null)open.push({b,i,v:bizIncome(b)/slotsOf(b)})});open.sort((a,c)=>c.v-a.v);
  open.forEach(o=>{const f=living().filter(m=>canWork(m)&&!jobOf(m.id)&&m.age>=16&&!m.retired).map(m=>({m,gain:staffVal(o.b,m,o.i)-(m.career&&m.mode!=='hobby'?careerPay(m,CK[m.career]).v*0.85*(m.mode==='part'?0.5:1):0)})).filter(x=>x.gain>0).sort((a,c)=>c.gain-a.gain)[0];if(f){f.m.career=null;f.m.mode='full';f.m.kidjob=null;f.m.pay=0;o.b.staff[o.i]=f.m.id}});save();render()},
 buy(k){const d=BIZ.find(x=>x.k===k),c=buyCost(d);if(S.money<c)return;S.money-=c;const no=S.biz.filter(b=>b.k===k).length+1;S.biz.push({uid:S.bizUid++,k,lvl:1,no,staff:new Array(d.slots).fill(null),spent:c});if(!S.unlocked.includes(k))S.unlocked.push(k);log("Bought a "+d.n+".");save();render()},
 up(uid){const b=S.biz.find(x=>x.uid===uid),c=upCost(b);if(S.money<c)return;S.money-=c;b.spent+=c;b.lvl++;while(b.staff.length<slotsOf(b))b.staff.push(null);log("Upgraded the "+bizName(b)+" to level "+b.lvl+".");save();render()},
 sellAsk(uid){const b=S.biz.find(x=>x.uid===uid);const p=Math.round(b.spent*0.5);openOv(`<h2>Sell the ${bizName(b)}?</h2><p class="sub">You get ${fmt(p)}. Staff go find outside careers.</p><div class="grid2"><button class="btn red" onclick="A.sell(${uid})">Sell</button><button class="btn ghost" onclick="A.close()">Keep it</button></div>`)},
 sell(uid){const b=S.biz.find(x=>x.uid===uid);const st=b.staff.filter(x=>x!=null);sellBiz(b,Math.round(b.spent*0.5));T=totals();st.forEach(id=>{if(canWork(M[id]))chooseCareer(M[id],false)});save();A.close()},
 home(){const hn=homeNext();if(S.money<hn.cost)return;S.money-=hn.cost;if(S.home<HOMES.length-1){S.home++;log("Moved into a "+HOMES[S.home].n+".")}else{S.wings++;log("Built a new wing on the "+HOMES[S.home].n+".")}save();render()},
 city(){const c=cityCost();if(S.money<c)return;S.money-=c;S.city++;if(!S.cities[S.city])S.cities.push(newCityName());log("The family expanded to "+S.cities[S.city]+".");save();render()},
 drawer(){$("drawer").innerHTML=`<div style="font-weight:800;font-size:18px;color:#1f6feb;margin:4px 0 12px">The ${S.surname} Family</div>
  <details open><summary>Game</summary><button class="btn" onclick="save();A.drawerClose()">Save now</button><button class="btn red" onclick="A.resetAsk()">Start a new family</button></details>
  <details><summary>Speed</summary><div class="grid3" style="margin-bottom:10px">${[1,2,4].map(v=>`<button class="btn ${S.speed===v?'':'ghost'}" onclick="S.speed=${v};save();render();A.drawer()">${v}x</button>`).join("")}</div></details>
  <details><summary>How to play</summary><p>A year passes every few seconds. Kids and retirees spend most of their time on hobbies. Kids can take paper routes and other kid jobs, and they jump on them when money gets tight. Adults can work full time, part time, or drop work for a hobby, which costs the family upkeep but grows the hobby fast. One big earner can carry a houseful of hobbyists. Hobbies climb from dabbler to legend, boost matching careers, and can turn into a career outright, like RC airplanes into a drone pilot job. When money runs low, windfalls show up, like the mob dropping off a token of appreciation or old baseball cards in the attic.</p><p> Adults pick careers on their own and hop to better paying ones often. Each worker keeps part of their pay as their own savings, and the rest goes to the family.</p><p>Every career sits under a field: Law, Tech, Trade, Medicine, Money, Hustle, Showbiz, Civic, Western, Transport and Food. Skill in the field raises pay and unlocks the top careers in it.</p><p>Teach kids any field. Teaching the family trade goes further, and a retired relative who knows the field halves the cost. A child whose parents and grandparents held the same career gets a lineage bonus that stacks every generation.</p><p>Careers also earn more when relatives are skilled in certain other fields. A pawn shop owner with lawyers and hustlers in the family does better than one without. Find them all in the Skills tab.</p><p>Everyone is a straight arrow, neutral, or crooked. Crooked careers pay big but can land people in jail. Lawyers in the family cut the odds. Cops in the family might be the ones making the arrest.</p><p>Risky jobs can kill or disable people. Disabled relatives cannot work and cost more to care for. Anyone who saves enough may quit early for a hobby, and will go back to work if the money runs low.</p><p>Every business has a manager, a bookkeeper who uses Money skill and a maintenance person who uses Trade skill, plus workers. A bigger home and new cities still work the same as before. Nothing tops out.</p></details>
  <details><summary>Stats</summary><p>Members ever ${S.ever}<br>Living ${living().length}<br>Businesses ${S.biz.length}<br>Synergies found ${S.found.length} of ${SYN_TOTAL}<br>Net worth ${fmt(worth())}<br>Peak worth ${fmt(S.peak)}</p></details>`;$("drBg").classList.add("on")},
 drawerClose(){$("drBg").classList.remove("on")},
 resetAsk(){A.drawerClose();openOv(`<h2>Start over?</h2><p class="sub">This family and its whole tree will be erased.</p><div class="grid2"><button class="btn red" onclick="A.reset()">Erase and start</button><button class="btn ghost" onclick="A.close()">Keep playing</button></div>`)},
 reset(){newGame();tab="family";A.close()}
};
if(!load())newGame();
T=totals();
render();
let last=performance.now();
setInterval(()=>{const now=performance.now(),dt=(now-last)/1000;last=now;
 if(S.paused||modal||$("drBg").classList.contains("on")){$("yBar").style.width=(acc/YEARSEC*100)+"%";return}
 acc+=dt*S.speed;if(acc>=YEARSEC){acc=0;yearTick()}$("yBar").style.width=(acc/YEARSEC*100)+"%"},100);
</script>
</body>
</html>
