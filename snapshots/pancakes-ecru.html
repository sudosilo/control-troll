<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Pancakes — Promptchan Client</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #333;
      --text: #f0f0f0;
      --text-dim: #999;
      --accent: #ff6b35;
      --accent-hover: #ff8255;
      --danger: #ff4444;
      --success: #22c55e;
      --radius: 12px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    header {
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    header h1 span {
      color: var(--accent);
    }

    .gems {
      font-size: 0.8rem;
      color: var(--text-dim);
      background: var(--surface2);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .gems strong {
      color: var(--accent);
    }

    .settings {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      flex-shrink: 0;
    }

    .settings-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .settings input[type="password"],
    .settings input[type="text"] {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .settings input:focus {
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn:hover, .btn:active {
      background: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      font-size: 0.75rem;
      margin-top: 6px;
      color: var(--text-dim);
    }

    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }

    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-dim);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(80px + var(--safe-bottom));
    }

    .panel {
      display: none;
      padding: 16px;
      height: 100%;
    }

    .panel.active {
      display: flex;
      flex-direction: column;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 12px;
      min-height: 200px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #000;
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      align-self: flex-start;
      background: var(--surface2);
      border-bottom-left-radius: 4px;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--text-dim);
      font-size: 0.8rem;
      text-align: center;
    }

    .character-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .character-bar input {
      flex: 1;
      min-width: 120px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      position: sticky;
      bottom: 0;
      background: var(--bg);
      padding-top: 8px;
    }

    .chat-input-row textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      outline: none;
      font-family: inherit;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-group textarea,
    .form-group select,
    .form-group input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .result-area {
      margin-top: 16px;
      text-align: center;
    }

    .result-area img {
      max-width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface2);
    }

    .result-meta {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 8px;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      color: var(--text-dim);
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-banner {
      background: #1a2a1a;
      color: #86efac;
      font-size: 0.75rem;
      padding: 8px 16px;
      text-align: center;
      border-bottom: 1px solid #2a4a2a;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      color: var(--text-dim);
      padding: 40px 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🥞 <span>Pancakes</span></h1>
      <div class="gems" id="gemsDisplay">Gems: —</div>
    </header>

    <div class="info-banner">
      Using local proxy — CORS bypassed. API key stays in your browser only.
    </div>

    <div class="settings">
      <div class="settings-row">
        <input type="password" id="apiKey" placeholder="Paste your Promptchan API key" autocomplete="off" />
        <button class="btn" id="saveKeyBtn">Save</button>
      </div>
      <div class="status" id="keyStatus">Key is stored only in your browser (localStorage)</div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="chat">Chat</div>
      <div class="tab" data-tab="generate">Generate</div>
    </div>

    <div class="content">
      <div class="panel active" id="panel-chat">
        <div class="character-bar">
          <input type="text" id="charName" placeholder="Character name" value="Ashley" />
          <input type="text" id="charPersonality" placeholder="Personality" value="Warm, affectionate, loves attention and cuddles" />
        </div>

        <div class="chat-messages" id="chatMessages">
          <div class="msg system">Start chatting. Character settings above are sent with every message.</div>
        </div>

        <div class="chat-input-row">
          <textarea id="chatInput" rows="1" placeholder="Type a message..."></textarea>
          <button class="btn" id="sendChatBtn">Send</button>
        </div>
      </div>

      <div class="panel" id="panel-generate">
        <div class="form-group">
          <label>Prompt</label>
          <textarea id="prompt" placeholder="Describe the image you want..."></textarea>
        </div>

        <div class="form-group">
          <label>Negative Prompt (optional)</label>
          <input type="text" id="negPrompt" placeholder="Things to avoid..." />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Style</label>
            <select id="style">
              <option value="Cinematic">Cinematic</option>
              <option value="Anime">Anime</option>
              <option value="Hyperreal">Hyperreal</option>
              <option value="Photo XL+">Photo XL+</option>
              <option value="Anime XL+">Anime XL+</option>
              <option value="Hardcore XL">Hardcore XL</option>
              <option value="Cinematic XL">Cinematic XL</option>
              <option value="Hyperreal XL+">Hyperreal XL+</option>
              <option value="Render XL+">Render XL+</option>
              <option value="Illustration XL+">Illustration XL+</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quality</label>
            <select id="quality">
              <option value="Ultra">Ultra (1 gem)</option>
              <option value="Extreme">Extreme (+1 gem)</option>
              <option value="Max">Max (+2 gems)</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Size</label>
            <select id="imageSize">
              <option value="512x768">512×768 (portrait)</option>
              <option value="512x512">512×512 (square)</option>
              <option value="768x512">768×512 (landscape)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Creativity</label>
            <select id="creativity">
              <option value="30">30 (strict)</option>
              <option value="50" selected>50 (balanced)</option>
              <option value="70">70 (creative)</option>
            </select>
          </div>
        </div>

        <button class="btn" id="generateBtn" style="width:100%; padding:14px; font-size:1rem;">
          Generate Image
        </button>

        <div class="result-area" id="resultArea">
          <div class="empty">Generated images will appear here</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PROXY = "/api/proxy";
    let apiKey = localStorage.getItem("pancakes_api_key") || "";
    let chatHistory = [];
    let lastGems = localStorage.getItem("pancakes_gems");

    const $ = (id) => document.getElementById(id);
    const apiKeyInput = $("apiKey");
    const keyStatus = $("keyStatus");
    const gemsDisplay = $("gemsDisplay");
    const chatMessages = $("chatMessages");
    const chatInput = $("chatInput");
    const resultArea = $("resultArea");

    if (apiKey) {
      apiKeyInput.value = apiKey;
      keyStatus.textContent = "Key loaded from browser storage";
      keyStatus.className = "status success";
    }

    if (lastGems !== null) {
      gemsDisplay.innerHTML = `Gems: <strong>${lastGems}</strong>`;
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        $("panel-" + tab.dataset.tab).classList.add("active");
      });
    });

    $("saveKeyBtn").addEventListener("click", () => {
      const val = apiKeyInput.value.trim();
      if (!val) {
        keyStatus.textContent = "Please enter a key";
        keyStatus.className = "status error";
        return;
      }
      apiKey = val;
      localStorage.setItem("pancakes_api_key", apiKey);
      keyStatus.textContent = "Key saved to browser storage";
      keyStatus.className = "status success";
    });

    function updateGems(gems) {
      if (gems !== undefined && gems !== null) {
        lastGems = gems;
        localStorage.setItem("pancakes_gems", String(gems));
        gemsDisplay.innerHTML = `Gems: <strong>${gems}</strong>`;
      }
    }

    function requireKey() {
      if (!apiKey) {
        alert("Please save your API key first.");
        return false;
      }
      return true;
    }

    async function apiCall(path, body) {
      const res = await fetch(PROXY, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path, apiKey, body })
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.message || data.error || `HTTP ${res.status}`);
      }
      return data;
    }

    function addMessage(role, content) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = content;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    $("sendChatBtn").addEventListener("click", sendChat);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendChat();
      }
    });

    async function sendChat() {
      if (!requireKey()) return;
      const message = chatInput.value.trim();
      if (!message) return;

      const name = $("charName").value.trim() || "Ashley";
      const personality = $("charPersonality").value.trim() || "Warm and affectionate";

      addMessage("user", message);
      chatInput.value = "";
      chatInput.style.height = "auto";

      const loading = document.createElement("div");
      loading.className = "msg system";
      loading.id = "chatLoading";
      loading.innerHTML = '<div class="spinner" style="display:inline-block;vertical-align:middle;margin-right:8px;"></div> Thinking...';
      chatMessages.appendChild(loading);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const data = await apiCall("/api/external/chat", {
          message,
          userName: "You",
          isRoleplay: false,
          redo: false,
          characterData: {
            name,
            personality,
            scenario: "Casual conversation at home",
            sexuality: "straight",
            openness: 70,
            emotions: 60,
            age: 22,
            gender: "female"
          },
          chatHistory
        });

        if (data.chatHistory && Array.isArray(data.chatHistory)) {
          chatHistory = data.chatHistory;
        } else {
          chatHistory.push({ role: "user", content: message });
          chatHistory.push({ role: "assistant", content: data.message || "" });
        }

        if (data.gems !== undefined) updateGems(data.gems);

        $("chatLoading")?.remove();
        addMessage("ai", data.message || "(no response)");
      } catch (err) {
        $("chatLoading")?.remove();
        addMessage("system", "Error: " + err.message);
        console.error(err);
      }
    }

    $("generateBtn").addEventListener("click", async () => {
      if (!requireKey()) return;

      const prompt = $("prompt").value.trim();
      if (!prompt) {
        alert("Please enter a prompt");
        return;
      }

      const btn = $("generateBtn");
      btn.disabled = true;
      btn.textContent = "Generating...";

      resultArea.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <span>Generating image...</span>
        </div>
      `;

      try {
        const data = await apiCall("/api/external/create", {
          style: $("style").value,
          poses: "Default",
          filter: "Default",
          emotion: "Default",
          prompt: prompt,
          seed: -1,
          quality: $("quality").value,
          creativity: parseInt($("creativity").value, 10),
          image_size: $("imageSize").value,
          negative_prompt: $("negPrompt").value.trim() || "",
          restore_faces: false
        });

        updateGems(data.gems);

        const imgSrc = data.image?.startsWith("data:")
          ? data.image
          : "data:image/jpeg;base64," + (data.image || "");

        resultArea.innerHTML = `
          <img src="${imgSrc}" alt="Generated image" />
          <div class="result-meta">
            Remaining gems: <strong>${data.gems ?? "—"}</strong>
          </div>
        `;
      } catch (err) {
        resultArea.innerHTML = `
          <div class="empty" style="color:var(--danger)">
            Error: ${err.message}
          </div>
        `;
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate Image";
      }
    });

    chatInput.addEventListener("input", () => {
      chatInput.style.height = "auto";
      chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + "px";
    });
  </script>
</body>
</html>
