<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Ether Wand v4 -->
<meta name="theme-color" content="#faf6f0">
<title>Ether Wand</title>
<style>
/* Layout: one-screen tube-amp console. Readout on top, scope in the middle, controls at the thumb. Light by default, dark on request. */
:root{
  --bg:#faf6f0; --panel:#ffffff; --line:#e6d8c6; --ink:#2a1d14; --dim:#7a6552;
  --amber:#c96a00; --ember:#e5502a; --glow:#fde9cf;
  --power-a:#e88a1a; --power-b:#c96a00; --power-ink:#ffffff;
  --display:"Arial Narrow",Impact,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#120d0a; --panel:#1c1511; --line:#3a2c22; --ink:#f3e3cf; --dim:#9a8470;
  --amber:#ffb347; --ember:#ff6a3d; --glow:#2a1a10;
  --power-a:#ffb347; --power-b:#f08a2c; --power-ink:#1a0f08;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);margin:0;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;overflow-y:auto;
  padding-inline:16px;padding-block:14px;max-width:560px;margin:0 auto}
.app>*{flex-shrink:0}
.hdr{display:flex;align-items:center;gap:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.25rem,6vw,1.9rem);white-space:nowrap;overflow:hidden;text-overflow:clip;letter-spacing:.04em;margin:0;text-transform:uppercase;color:var(--amber)}
.mode{font-size:.62rem;line-height:1.3;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mode b{color:var(--ink);font-weight:600}
.readout{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.note{font-family:var(--display);font-weight:800;font-size:clamp(4rem,22vw,6.5rem);line-height:.85;color:var(--ink);
  text-shadow:0 0 calc(var(--v,0)*28px) var(--ember)}
.note small{font-size:.42em;color:var(--dim);margin-left:2px}
.meters{display:flex;flex-direction:column;gap:6px;flex:1;max-width:200px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.hz{font-size:1rem;color:var(--amber);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:0}
.meter{display:grid;grid-template-columns:6.2em 1fr;align-items:center;gap:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--ember))}
.scope{position:relative;flex:1 0 220px;border:1px solid var(--line);border-radius:14px;background:
  radial-gradient(120% 80% at 50% 100%,var(--glow) 0%,var(--panel) 60%);overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hint{position:absolute;left:10px;right:44px;bottom:10px;font-size:.72rem;color:var(--dim);line-height:1.45;pointer-events:none;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.axes{position:absolute;top:10px;left:12px;right:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-width:0;background:transparent;color:var(--dim);border:0;font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:11px 4px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--amber)}
.btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:11px 12px;cursor:pointer}
.btn.sm{padding:7px 10px;font-size:.64rem}
.btn[aria-pressed="true"]{color:var(--amber)}
.play{flex-wrap:nowrap}
.power{flex:1;font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.12em;text-transform:uppercase;
  padding:14px;border-radius:14px;border:0;cursor:pointer;color:var(--power-ink);background:linear-gradient(180deg,var(--power-a),var(--power-b))}
.power.on{background:var(--panel);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.fxbtn{border-radius:14px;padding:0 18px}
.fx{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px 14px}
.pane{display:flex;flex-direction:column;gap:16px}
.pane[hidden]{display:none}
.dhead{gap:10px}
.dhead .seg{flex:0 1 220px}
.fx .seg{grid-column:1/-1;margin-top:4px}
.knob{display:flex;flex-direction:column;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.knob span{display:flex;justify-content:space-between}
.knob output{color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--amber) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--panel);border:2px solid var(--amber)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--amber)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--panel);border:2px solid var(--amber)}
input[type=range]:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.burger{flex:0 0 40px;width:40px;max-width:15vw;height:40px;display:grid;place-items:center;padding:0;cursor:pointer;
  color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px}
.burger i{display:block;width:18px;height:2px;border-radius:1px;background:currentColor;box-shadow:0 -6px 0 currentColor,0 6px 0 currentColor}
.scrim{position:fixed;inset:0;z-index:10;background:rgba(20,12,6,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:11;width:min(84vw,340px);box-sizing:border-box;overflow-y:auto;
  display:flex;flex-direction:column;gap:16px;padding:14px 16px 24px;background:var(--bg);border-right:1px solid var(--line);
  transform:translateX(-102%);transition:transform .22s ease}
.drawer.open{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center}
.drawer h2{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--amber)}
.sect{margin:0 0 8px;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.drawer .power{width:100%;font-size:1.2rem;padding:12px}
.routines{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.routines .btn{text-align:left;padding:9px 10px;font-size:.64rem;line-height:1.3;letter-spacing:.05em}
.routines .btn[aria-pressed="true"]{border-color:var(--amber);background:var(--glow)}
.bpm{display:flex;align-items:center;gap:8px}
.bpm output{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.bpm output small{font-size:.4em;color:var(--dim);margin-left:4px}
.bpm .btn{min-width:46px}
.pair{display:flex;gap:8px}
.pair .btn{flex:1}
.demoTag{position:absolute;left:12px;bottom:10px;display:none;align-items:center;gap:10px;pointer-events:none;
  font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ember)}
.demoTag.on{display:flex}
.beats{display:flex;gap:4px}
.beats i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.beats i.on{background:var(--ember)}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.note{text-shadow:none}}
</style>
</head><body>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Menu">
  <div class="dhead">
    <div class="seg" id="tabSeg" role="group" aria-label="Menu section">
      <button data-t="demo" aria-pressed="true">Demo</button>
      <button data-t="fx" aria-pressed="false">Effects</button>
    </div>
    <button class="btn sm" id="closeMenu">Close</button>
  </div>
  <div class="pane" id="paneFx" hidden>
  <div class="fx" id="fx" role="group" aria-label="Effects">
    <div class="seg" id="presetSeg" role="group" aria-label="Presets">
      <button data-p="clean">Clean</button>
      <button data-p="classic">Classic</button>
      <button data-p="space">Space</button>
      <button data-p="fuzz">Fuzz</button>
    </div>
  </div>
  </div>
  <div class="pane" id="paneDemo">
  <button class="power" id="demoBtn">Start demo</button>
  <div>
    <p class="sect">Tempo</p>
    <div class="bpm">
      <button class="btn" id="bpmDown" aria-label="Slower">&minus;</button>
      <output id="bpmOut">96<small>BPM</small></output>
      <button class="btn" id="bpmUp" aria-label="Faster">+</button>
    </div>
    <input type="range" min="40" max="220" step="1" id="bpm" aria-label="Tempo in beats per minute">
    <div class="pair">
      <button class="btn" id="metroBtn" aria-pressed="false">Metronome</button>
      <button class="btn" id="tapBtn">Tap tempo</button>
    </div>
  </div>
  <div class="pair">
    <label class="knob" style="flex:1"><span>Demo level<output id="o_demoLvl"></output></span><input type="range" min="0" max="100" id="demoLvl"></label>
    <label class="knob" style="flex:1"><span>Click level<output id="o_clickLvl"></output></span><input type="range" min="0" max="100" id="clickLvl"></label>
  </div>
  <div>
    <p class="sect">Routines</p>
    <div class="routines" id="routines"></div>
  </div>
  </div>
</aside>

<div class="app">
  <header>
    <div class="brand">
      <button class="burger" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="drawer"><i></i></button>
      <h1>Ether Wand</h1>
    </div>
    <div class="hdr">
      <div class="mode" aria-label="Input mode"><b id="modeLabel">Tilt</b></div>
      <button class="btn sm" id="theme" aria-pressed="false">Dark</button>
    </div>
  </header>

  <div class="readout">
    <div class="note" id="note">A<small>4</small></div>
    <div class="meters">
      <div class="hz" id="hz">440.0 Hz</div>
      <div class="meter"><span>Pitch</span><div class="bar"><i id="mP"></i></div></div>
      <div class="meter"><span>Volume</span><div class="bar"><i id="mV"></i></div></div>
      <div class="meter"><span>Vibrato</span><div class="bar"><i id="mS"></i></div></div>
    </div>
  </div>

  <div class="scope" id="pad">
    <canvas id="cv"></canvas>
    <div class="axes" id="axes">Tilt pitch · roll volume · shake vibrato</div>
    <div class="demoTag" id="demoTag"><span class="beats" id="beats"><i></i><i></i><i></i><i></i></span><span id="demoText"></span></div>
    <div class="hint" id="hint">Tap Play, then tilt the top of the phone toward you to drop the pitch and away to raise it. Roll right for louder, left to fade out. Shake for vibrato.</div>
  </div>

  <div class="row">
    <div class="seg" id="rangeSeg" role="group" aria-label="Range">
      <button id="rLow" data-r="low" aria-pressed="false">Low</button>
      <button id="rMid" data-r="mid" aria-pressed="true">Mid</button>
      <button id="rHigh" data-r="high" aria-pressed="false">High</button>
    </div>
    <div class="seg" id="snapSeg" role="group" aria-label="Pitch mode">
      <button id="sGlide" data-s="glide" aria-pressed="true">Glide</button>
      <button id="sChrom" data-s="chrom" aria-pressed="false">Notes</button>
      <button id="sPent" data-s="pent" aria-pressed="false">Penta</button>
    </div>
  </div>
  <div class="row">
    <button class="btn" id="center" style="flex:1">Re-center</button>
    <button class="btn" id="invert" style="flex:1" aria-pressed="false">Flip pitch</button>
    <button class="btn" id="modeBtn" style="flex:1">Use touch</button>
  </div>
  <div class="row play">
    <button class="power" id="power">Play</button>
    <button class="btn fxbtn" id="fxBtn" aria-controls="drawer">Effects</button>
  </div>
</div>

<script>
(() => {
  const NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
  const RANGES = { low:[65.41,523.25], mid:[130.81,1046.5], high:[261.63,2093] }; // C2-C5, C3-C6, C4-C7
  const PENTA = [0,2,4,7,9];
  const $ = id => document.getElementById(id);

  // effect amounts, all 0..1
  const FX=[["vib","Vibrato"],["trem","Tremolo"],["echo","Echo"],["verb","Reverb"],["chorus","Chorus"],["drive","Drive"]];
  const PRESETS={
    clean:  {vib:.1, trem:0,  echo:.12,verb:.1, chorus:0,  drive:0},
    classic:{vib:.1, trem:0,  echo:.35,verb:.2, chorus:0,  drive:0},
    space:  {vib:.3, trem:.15,echo:.7, verb:.8, chorus:.5, drive:0},
    fuzz:   {vib:.15,trem:.35,echo:.3, verb:.2, chorus:.2, drive:.75}
  };
  const store={
    get(k,d){ try{ const v=localStorage.getItem("etherwand."+k); return v==null?d:JSON.parse(v); }catch(_){ return d; } },
    set(k,v){ try{ localStorage.setItem("etherwand."+k,JSON.stringify(v)); }catch(_){} }
  };
  const fx=Object.assign({},PRESETS.classic,store.get("fx",{}));

  let ctx=null, osc, vca, lfo, lfoAmt, filt, master, running=false;
  let shaper, post, trem, tremAmt, fb, echoWet, verbWet, chorusWet, lim;
  let demoOsc, demoVca, demoLfoAmt, clickBus;
  let range="mid", snap="glide", invert=false, mode="tilt";
  let pitchN=0.5, volN=0, shake=0;         // normalized controls 0..1
  let center=null, gotMotion=false, motionTimer=null, wake=null;
  let lastMag=1;
  const hist=[];

  // ---------- audio ----------
  function buildAudio(){
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    // theremin-ish timbre: mostly sine with a touch of 2nd and 3rd harmonic
    const real=new Float32Array([0,1,0.18,0.09,0.03,0.015]), imag=new Float32Array(real.length);
    osc=ctx.createOscillator(); osc.setPeriodicWave(ctx.createPeriodicWave(real,imag));
    osc.frequency.value=440;
    lfo=ctx.createOscillator(); lfo.frequency.value=5.6;
    lfoAmt=ctx.createGain(); lfoAmt.gain.value=4; lfo.connect(lfoAmt); lfoAmt.connect(osc.detune);
    filt=ctx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=3200; filt.Q.value=0.4;
    vca=ctx.createGain(); vca.gain.value=0;
    master=ctx.createGain(); master.gain.value=0.6;
    // drive: soft clipper ahead of the tone filter
    shaper=ctx.createWaveShaper(); shaper.oversample="4x"; post=ctx.createGain();
    // tremolo: a second LFO riding the amplitude
    trem=ctx.createGain(); tremAmt=ctx.createGain(); tremAmt.gain.value=0;
    const tlfo=ctx.createOscillator(); tlfo.frequency.value=6.2; tlfo.connect(tremAmt); tremAmt.connect(trem.gain);
    const bus=ctx.createGain();                                     // everything after this point is the send
    osc.connect(shaper); shaper.connect(post); post.connect(filt); filt.connect(vca); vca.connect(trem); trem.connect(bus);
    bus.connect(master);
    // tape echo, darkened a little on every repeat
    const dly=ctx.createDelay(2), tape=ctx.createBiquadFilter();
    fb=ctx.createGain(); echoWet=ctx.createGain();
    dly.delayTime.value=0.28; tape.type="lowpass"; tape.frequency.value=2600;
    bus.connect(dly); dly.connect(tape); tape.connect(fb); fb.connect(dly); dly.connect(echoWet); echoWet.connect(master);
    // chorus: two slowly wobbling short delays, spread left and right
    chorusWet=ctx.createGain(); chorusWet.connect(master);
    const lfos=[tlfo];
    [[0.012,0.7,-0.7],[0.019,1.1,0.7]].forEach(([base,rate,side])=>{
      const d=ctx.createDelay(0.05), l=ctx.createOscillator(), la=ctx.createGain(), pan=ctx.createStereoPanner?ctx.createStereoPanner():ctx.createGain();
      d.delayTime.value=base; l.frequency.value=rate; la.gain.value=0.003; if(pan.pan) pan.pan.value=side;
      l.connect(la); la.connect(d.delayTime); bus.connect(d); d.connect(pan); pan.connect(chorusWet); lfos.push(l);
    });
    // reverb: generated decaying-noise hall, fed by the dry signal and the echoes
    const verb=ctx.createConvolver(); verb.buffer=impulse(2.8);
    verbWet=ctx.createGain(); bus.connect(verb); echoWet.connect(verb); verb.connect(verbWet); verbWet.connect(master);
    // limiter so stacked effects never clip
    lim=ctx.createDynamicsCompressor();
    lim.threshold.value=-6; lim.knee.value=0; lim.ratio.value=12; lim.attack.value=0.003; lim.release.value=0.15;
    master.connect(lim); lim.connect(ctx.destination);
    // demo voice: brighter, reedier wave so it stands apart from yours, through the same effects
    const dreal=new Float32Array([0,1,0.42,0.26,0.14,0.08,0.05]);
    demoOsc=ctx.createOscillator(); demoOsc.setPeriodicWave(ctx.createPeriodicWave(dreal,new Float32Array(dreal.length)));
    demoOsc.frequency.value=440;
    demoLfoAmt=ctx.createGain(); lfo.connect(demoLfoAmt); demoLfoAmt.connect(demoOsc.detune);
    const dfilt=ctx.createBiquadFilter(); dfilt.type="lowpass"; dfilt.frequency.value=2400; dfilt.Q.value=0.5;
    demoVca=ctx.createGain(); demoVca.gain.value=0;
    demoOsc.connect(dfilt); dfilt.connect(demoVca); demoVca.connect(trem); demoOsc.start();
    // metronome skips the effects and goes straight to the limiter
    clickBus=ctx.createGain(); clickBus.connect(lim);
    osc.start(); lfo.start(); lfos.forEach(l=>l.start());
    applyFx(true);
  }

  function impulse(sec){
    const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2); }
    return b;
  }

  function driveCurve(a){
    if(a<0.01) return null;
    const k=1+a*24, n=2048, c=new Float32Array(n), norm=Math.tanh(k);
    for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=Math.tanh(k*x)/norm; }
    return c;
  }

  let lastDrive=-1;
  function applyFx(now){
    if(!ctx) return;
    const t=ctx.currentTime, tc=now?0.001:0.06;
    echoWet.gain.setTargetAtTime(fx.echo*0.6,t,tc);
    fb.gain.setTargetAtTime(0.12+fx.echo*0.45,t,tc);
    verbWet.gain.setTargetAtTime(fx.verb*0.9,t,tc);
    chorusWet.gain.setTargetAtTime(fx.chorus*0.8,t,tc);
    trem.gain.setTargetAtTime(1-fx.trem*0.5,t,tc);
    tremAmt.gain.setTargetAtTime(fx.trem*0.5,t,tc);
    if(fx.drive!==lastDrive){ lastDrive=fx.drive; shaper.curve=driveCurve(fx.drive); }
    post.gain.setTargetAtTime(1-fx.drive*0.45,t,tc);
    demoLfoAmt.gain.setTargetAtTime(fx.vib*40,t,tc);
    apply();
  }

  function freqFor(n){
    const [lo,hi]=RANGES[range];
    const midiLo=69+12*Math.log2(lo/440), midiHi=69+12*Math.log2(hi/440);
    let m=midiLo+(midiHi-midiLo)*n;
    if(snap==="chrom") m=Math.round(m);
    if(snap==="pent"){ const r=Math.round(m), pc=((r%12)+12)%12;
      let best=r, d=99; for(let k=-3;k<=3;k++){const c=r+k,p=((c%12)+12)%12; if(PENTA.includes(p)&&Math.abs(c-m)<d){d=Math.abs(c-m);best=c;}} m=best; }
    return {f:440*Math.pow(2,(m-69)/12), midi:m};
  }

  function apply(){
    const {f,midi}=freqFor(pitchN);
    const r=Math.round(midi), name=NAMES[((r%12)+12)%12], oct=Math.floor(r/12)-1;
    $("note").innerHTML=name+"<small>"+oct+"</small>";
    $("hz").textContent=f.toFixed(1)+" Hz";
    $("mP").style.width=(pitchN*100)+"%"; $("mV").style.width=(volN*100)+"%"; $("mS").style.width=(Math.min(1,shake)*100)+"%";
    $("note").style.setProperty("--v",running?volN:0);
    if(!ctx||!running) return;
    const t=ctx.currentTime;
    osc.frequency.setTargetAtTime(f,t,snap==="glide"?0.035:0.012);
    vca.gain.setTargetAtTime(Math.pow(volN,1.6)*0.9,t,0.04);
    lfoAmt.gain.setTargetAtTime(fx.vib*40+Math.min(1,shake)*45,t,0.08);
    lfo.frequency.setTargetAtTime(5.2+Math.min(1,shake)*2,t,0.2);
  }

  // ---------- motion (all three axes) ----------

    if(!center) center={p:pitchDeg,r:rollDeg};
    let dp=(pitchDeg-center.p); if(invert) dp=-dp;
    pitchN=clamp(0.5 - dp/80);                                     // ±40° spans the range
    volN=clamp(0.55 + (rollDeg-center.r)/60);
    const mag=Math.hypot(x,y,z), jolt=Math.abs(mag-lastMag); lastMag=mag;
    shake=shake*0.9 + Math.min(1.5,jolt*3)*0.1;                     // smoothed shake energy

  // ---------- demo routines ----------
  // Each routine maps a beat position b (0 at its start) to [pitch 0..1, volume 0..1].
  // Pitch is in the current range, so S(12) is the C one octave above the bottom of the range.
  const S=x=>x/36;
  const fr=x=>x-Math.floor(x);
  const env=(ph,len)=> ph<0||ph>=len?0:Math.min(1,ph/0.03)*Math.min(1,(len-ph)/0.08);
  const smooth=k=>k*k*(3-2*k);

    return [S(12),0];

  const ROUTINES=[
    {id:"taps",   name:"Two taps and a lift", f:b=>{ const t=b%4;

      const u=(t-2)/2; return [S(12+u*19),Math.min(1,(t-2)/0.08)*(u<0.8?0.85:0.85*(1-(u-0.8)/0.2))]; }},
    {id:"trace",  name:"Up and down trace", f:b=>{ const u=fr(b/4); return [0.1+0.8*(u<0.5?u*2:2-u*2),0.8]; }},
    {id:"swell",  name:"Sine swell", f:b=>[0.5+0.35*Math.sin(2*Math.PI*b/8),0.45+0.4*Math.sin(2*Math.PI*b/4-Math.PI/2)]},
    {id:"stairUp",name:"Staircase up", f:b=>[S(12+at(MAJOR,1,b)),env(fr(b),0.9)*0.85]},
    {id:"stairDn",name:"Staircase down", f:b=>[S(24-at(MAJOR,1,b)),env(fr(b),0.9)*0.85]},
    {id:"arp",    name:"Arpeggio", f:b=>[S(at([12,16,19,24,19,16],0.5,b)),env(b%0.5,0.42)*0.85]},
    {id:"heart",  name:"Heartbeat", f:b=>{ const t=fr(b); return [S(t<0.28?7:5),Math.max(env(t,0.16),env(t-0.28,0.16)*0.8)]; }},
    {id:"siren",  name:"Siren", f:b=>[0.55+0.25*Math.sin(2*Math.PI*b),0.75]},
    {id:"zigzag", name:"Zigzag ramp", f:b=>{ const u=fr(b/2); return [0.15+0.7*u,Math.min(1,u/0.03)*Math.min(1,(1-u)/0.02)*0.8]; }},
    {id:"call",   name:"Call and response", f:b=>{ const t=b%8; if(t>=4) return [S(31),0];
      const i=Math.floor(t); return [S([24,26,28,31][i]),env(t-i,0.9)*0.85]; }},
    {id:"octave", name:"Octave jumps", f:b=>[S(glideTo([12,24],1,b,0.2)),0.8]},
    {id:"spiral", name:"Spiral out", f:b=>{ const t=b%8; return [0.5+(t/8)*0.42*Math.sin(2*Math.PI*t),0.3+0.6*t/8]; }},
    {id:"bounce", name:"Bouncing ball", f:b=>{ const segs=[1.6,1,0.7,0.45,0.25]; let t=b%4, h=0.85;

      return [0.15,0.35]; }},
    {id:"walk",   name:"Random walk", f:b=>{ const i=Math.floor(b), a=12+Math.floor(hash(i-1)*17), c=12+Math.floor(hash(i)*17);

    {id:"pulse",  name:"Hold and pulse", f:b=>[S(at([19,17,14,12],4,b)),0.3+0.55*(0.5+0.5*Math.cos(2*Math.PI*b*2))]},
    {id:"run",    name:"Scale run", f:b=>[S(at(RUN,0.5,b)),env(b%0.5,0.45)*0.85]},
    {id:"quarter",name:"Quarter pulse", f:b=>[S(at([14,12,9,12],8,b)),env(fr(b),0.5)*0.85]},
    {id:"tune",   name:"Ether tune", f:b=>melody(TUNE,b)},
    {id:"glides", name:"Long glides", f:b=>{ const i=Math.floor(b/2), a=0.1+0.8*hash(i+40-1), c=0.1+0.8*hash(i+40);
      return [a+(c-a)*smooth(Math.min(1,(b-i*2)/1.5)),0.7]; }},
    {id:"offbeat",name:"Off-beat taps", f:b=>[S(at([12,19,16,21],1,b)),env(fr(b)-0.5,0.25)*0.9]},
    {id:"gallop", name:"Gallop", f:b=>{ const t=fr(b); return [S(at([12,12,19,17],1,b)),Math.max(env(t,0.2),env(t-0.5,0.15),env(t-0.75,0.15))*0.9]; }},
    {id:"breath", name:"Slow breath", f:b=>[S(at([12,16,19,14],8,b)),0.85*Math.pow(Math.sin(Math.PI*fr(b/8)),2)]},
    {id:"triplet",name:"Triplets", f:b=>{ const t=fr(b)*3, i=Math.floor(t);
      return [S([12,16,19][i]+(Math.floor(b)%2?5:0)),env((t-i)/3,0.26)*0.85]; }},
    {id:"chaos",  name:"Chaos sparkle", f:b=>{ const i=Math.floor(b*4); return [0.1+0.8*hash(i),hash(i+99)>0.35?env((b*4-i)/4,0.22)*0.8:0]; }}
  ];
  const ds=Object.assign({routine:"taps",bpm:96,demoLvl:0.7,clickLvl:0.6},store.get("demo",{}));

  function ensureAudio(){ if(!ctx) buildAudio(); return ctx.resume(); }

  function demoAt(b){ const [p,v]=routine().f(b); return [clamp(p),clamp(v)]; }
  function transport(){

  function click(t,accent){
    const o=ctx.createOscillator(), g=ctx.createGain();

  }

  ROUTINES.forEach(r=>{

  });

  function draw(){
    const w=cv.clientWidth, h=cv.clientHeight, Y=p=>h-p*(h-40)-20;
    // demo position right now, plus the beat for the dots
    let dNow=null, bn=0;
    if(ctx&&tr.run){
      bn=beatNow();
      const rel=bn-(demoOn?demoOff:0);
      if(demoOn&&rel>=0) dNow=demoAt(rel);
      const beat=rel>=0?Math.floor(rel)%4:-1;
      [...$("beats").children].forEach((d,i)=>d.classList.toggle("on",i===beat));
      if(dNow){ const {midi}=freqFor(dNow[0]), r=Math.round(midi);
        $("demoText").textContent=routine().name+" · "+NAMES[((r%12)+12)%12]+(Math.floor(r/12)-1)+" · "+ds.bpm+" BPM"; }
      else $("demoText").textContent=(demoOn?routine().name+" · next beat":"Metronome")+" · "+ds.bpm+" BPM";
    }
    hist.push({p:pitchN,v:running?volN:0,dp:dNow?dNow[0]:null,dv:dNow?dNow[1]:0}); if(hist.length>180) hist.shift();
    g2.clearRect(0,0,w,h);
    // octave lines at each C in the current range
    const [lo,hi]=RANGES[range], oct=Math.round(Math.log2(hi/lo));
    g2.strokeStyle=LINE; g2.lineWidth=1; g2.fillStyle=DIM; g2.font="10px "+css.getPropertyValue("--mono");
    for(let i=0;i<=oct;i++){ const y=h-(i/oct)*(h-40)-20; g2.beginPath(); g2.moveTo(0,y); g2.lineTo(w,y); g2.stroke();
      const o=Math.round(Math.log2(lo/16.35))+i; g2.fillText("C"+o,w-24,y-4); }

    const nowX=demoOn?w*0.7:w, step=nowX/179, off=(180-hist.length)*step;
    if(demoOn){
      g2.strokeStyle=LINE; g2.setLineDash([3,4]); g2.beginPath(); g2.moveTo(nowX,0); g2.lineTo(nowX,h); g2.stroke(); g2.setLineDash([]);
      // demo trail behind now
      for(let i=1;i<hist.length;i++){ const a=hist[i-1], b=hist[i]; if(a.dp==null||b.dp==null) continue;
        g2.strokeStyle=EMBER; g2.globalAlpha=0.08+b.dv*0.6; g2.lineWidth=1+b.dv*3;

          g2.beginPath(); g2.moveTo(prev[0],Y(prev[1])); g2.lineTo(x,Y(p)); g2.stroke(); }
        prev=[x,p]; }
      g2.globalAlpha=1;
      if(dNow){ g2.strokeStyle=EMBER; g2.lineWidth=2; g2.beginPath(); g2.arc(nowX,Y(dNow[0]),5+dNow[1]*5,0,Math.PI*2); g2.stroke(); }
    }
    // your pitch trail, brightness = volume
    for(let i=1;i<hist.length;i++){ const a=hist[i-1], b=hist[i];
      g2.strokeStyle=AMBER; g2.globalAlpha=0.12+b.v*0.88; g2.lineWidth=1+b.v*4;
      g2.beginPath(); g2.moveTo(off+(i-1)*step,Y(a.p)); g2.lineTo(off+i*step,Y(b.p)); g2.stroke(); }
    g2.globalAlpha=1;
    const last=hist[hist.length-1], lx=off+(hist.length-1)*step, ly=Y(last.p);
    g2.fillStyle=AMBER; g2.shadowColor=AMBER; g2.shadowBlur=running?12+last.v*20:0;
    g2.beginPath(); g2.arc(lx,ly,4+last.v*5,0,Math.PI*2); g2.fill(); g2.shadowBlur=0;
    requestAnimationFrame(draw);
  }
  apply(); draw();
})();
</script>
