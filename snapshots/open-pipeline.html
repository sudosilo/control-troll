<!DOCTYPE html>
<!-- ============================================================================
  OPEN PIPELINE  -  HANDOFF NOTES   (forked from Stumbler, BLUE PHONE -> next phone)
  ============================================================================
  WHAT IT IS
  Fork of Stumbler (stumbler.vercel.app), same core loop: generate <host>.vercel.app
  names, open in a new tab, keep the live ones. Forked to run a SEPARATE dataset
  under its own name/backend rather than mixing into Stumbler's finds.
  Lives at open-pipeline.vercel.app. Deployed from ~/open-pipeline via Vercel CLI.

  WHAT'S DIFFERENT FROM STUMBLER AT FORK TIME
    - No 160-url seed. Starts EMPTY. This dataset is its own thing.
    - api/hits.js ships from the first deploy (Upstash REST, zero deps) instead
      of being bolted on after months of running with no backend.
    - CLONES walks its site list in order (like DICTIONARY) instead of random
      sampling, so it covers all ~100 sites with no repeats before looping.
    - Generation is dedupe-checked against kept hits before it's shown, in all
      three modes, so you're never re-served a host you already kept.
    - Category sync to the cloud is NOT half-done here - pushCloud() has sent
      {url,cat} since the first commit, and api/hits.js stores/returns it.

  DEPLOY (termux)
    cd ~/open-pipeline
    cp "$(ls -t ~/storage/downloads/index*.html | head -1)" index.html
    vercel --prod
    rm ~/storage/downloads/index*.html
  Firefox caches hard - hard-refresh the live page after a deploy or you will
  think nothing changed.

  THREE MODES (tabs)
    STUMBLE  - word-word combos; biased by stems of kept hits (the feedback loop)
    DICTIONARY - walks a single-word list in order (dictIdx persists)
    CLONES   - walks ~100 popular site names in order (cloneIdx persists),
               mangling each the way clone-builders actually name things
               ({site}-clone, clone-{site}, {site}-next, backwards, etc.)

  KEPT HITS + SYNC
    Local cache: localStorage key "pipeline.hits.v1" (array of url strings).
    Cloud: frontend calls fetch("/api/hits") GET and POST.
      GET  -> { hits:[{url,cat,found_at}], times:{url:{l:ts}} }
      POST {hits:[{url,cat}], urls:[...]} -> upsert, same response shape
      POST {action:"visit", url} -> stamps last-checked, cross-device
    LIVE backend = Upstash Redis via the Vercel function at /api/hits
      (api/hits.js in this project; HASH "pipeline:hits" + HASH "pipeline:visits").
      Env vars (Production + Preview + Development, all three):
        UPSTASH_REDIS_REST_URL  -- the https://xxxx.upstash.io REST url,
                                    NOT the rediss:// connection string
        UPSTASH_REDIS_REST_TOKEN

  CATEGORIES
    CATS    = { url -> category }  in localStorage "pipeline.cats.v1"
    CATLIST = user-growable names  in localStorage "pipeline.catlist.v1",
              starts ["Stumble","Dictionary","Clone"], case-insensitive dedupe.
    Helpers: catOf(), setCat(), ensureCat(), guessCat(), modeCat().
    Kept hits auto-tag by the mode they were found in and sync to the cloud
    on every change via pushCloud(). EXPORT writes [{url,cat}].

  AGE COLUMN
    Left of each row: minutes/hours/days since a REAL tap on that url
    (markVisited -> VISITED[u], local + pushed to /api/hits as action:"visit").
    Blank ("-") until the first tap - no fake baseline stamp. 30d+ turns amber,
    99d (the display cap) turns red.

  STILL OPEN / NEXT TASK CANDIDATES
    - Live/dead recheck of kept hits: Stumbler had a half-built version of this
      (a /api/check endpoint + button) that got pulled entirely rather than
      fixed. Worth deciding whether Open Pipeline wants it as a real feature -
      needs a batch endpoint that fetches each kept url and a place to store
      state (up/dead/broken) per url, ideally not blocking the UI thread.

  CONVENTIONS
    - Mark every contribution with a "<COLOR> PHONE:" comment.
    - Backgrounds must stay LIGHT (no black/near-black panels). Warm accents ok.
    - Project hands off across RED / GREEN / ORANGE / BLUE phones.
  ============================================================================ -->

<script>
// BLUE PHONE: STUMBLE vocab -> app words, ordered most-likely first.
//   Combined as word-word / wordword. NEVER numbered (fresh guesses
//   resolve better bare). Numbers only come from saved hits below.
const BASE = ["app","my","dev","web","site","ai","api","dashboard","admin","portal",
"blog","docs","store","shop","portfolio","resume","todo","task","notes","chat","bot",
"game","play","music","photo","video","draw","paint","canvas","news","feed","social",
"link","bio","form","poll","quiz","map","weather","clock","timer","calendar","recipe",
"food","menu","order","book","travel","trip","fit","gym","run","health","learn","course",
"study","card","test","demo","hello","world","example","sample","project","starter",
"template","clone","hub","lab","studio","next","react","vue","svelte","astro","node",
"data","cloud","edge","pixel","retro","neon","snake","chess","arcade","stream","gallery",
"wiki","kanban","board","tracker","budget","finance","crypto","wallet","pay","invoice",
"ledger","stock","crew","shift","team","home","landing","page","portal","tool","kit",
"flow","spark","forge","build","stack","core","loop","wave","field","quick","cool","tiny"];

// BLUE PHONE: DICTIONARY vocab -> SINGLE words, ordered roughly by how
//   common / likely-as-an-app they are. Walked sequentially, one per
//   tap. Other-language words mixed in near the end for fun (ascii only).
const DICT = ["app","home","hello","world","test","demo","game","play","blog","shop",
"store","music","photo","video","news","food","travel","book","money","work","time",
"life","love","light","dark","fire","water","earth","wind","star","moon","sun","sky",
"cloud","rain","snow","storm","ocean","river","lake","mountain","forest","desert","island",
"city","town","road","bridge","tower","castle","garden","field","farm","market","money",
"gold","silver","copper","iron","steel","stone","glass","paper","wood","cotton","silk",
"coffee","tea","sugar","honey","bread","apple","orange","lemon","cherry","grape","mango",
"berry","mint","ginger","pepper","tiger","lion","wolf","fox","bear","eagle","hawk","owl",
"raven","robin","sparrow","swan","crane","heron","dove","falcon","panther","cobra","viper",
"dragon","phoenix","griffin","unicorn","pixel","vector","matrix","cipher","kernel","binary",
"signal","beacon","compass","anchor","arrow","blade","shield","spear","crown","throne","quest",
"legend","myth","fable","saga","echo","whisper","shadow","ember","frost","flame","spark","glow",
"prism","crystal","quartz","amber","jade","opal","ruby","pearl","ivory","onyx","cobalt","indigo",
"violet","crimson","scarlet","azure","amber","olive","maroon","teal","coral","ivory","slate",
"comet","meteor","nebula","galaxy","orbit","cosmos","lunar","solar","stellar","nova","pulsar",
"zenith","apex","summit","ridge","valley","canyon","cliff","glacier","tundra","savanna","jungle",
"meadow","prairie","lagoon","reef","tide","wave","current","breeze","gale","mist","fog","dew",
"casa","sol","luna","mar","fuego","agua","tierra","cielo","flor","gato","perro","rojo","verde",
"azul","oro","noche","dia","mundo","vida","amor","fiesta","maison","soleil","lune","feu","eau",
"ciel","fleur","chat","chien","rouge","vert","bleu","nuit","jour","reve","vie","amour","liberte",
"haus","sonne","mond","feuer","wasser","himmel","blume","katze","hund","rot","gruen","blau",
"nacht","tag","welt","leben","licht","wald","berg","stern","sora","hikari","yume","neko","mizu",
"hoshi","kaze","tsuki","hana","yama","umi","kawa","mori","sakura","kumo","tori","ame","yuki",
"cielo","stella","luce","fuoco","acqua","terra","fiore","gatto","rosso","verde","notte","vita"];

// BLUE PHONE: CLONES vocab -> well-known site base-names (no TLD). Clone-builders
//   recreate these and name them similarly, so we mangle each into the
//   conventions people actually use. Trim/extend this list freely.
const SITES = ["youtube","netflix","spotify","twitter","instagram","facebook","reddit",
"amazon","google","tiktok","discord","twitch","github","gitlab","notion","figma","canva",
"airbnb","uber","lyft","doordash","grubhub","venmo","paypal","stripe","slack","zoom",
"dropbox","gmail","outlook","linkedin","pinterest","snapchat","whatsapp","telegram",
"tinder","bumble","hinge","soundcloud","bandcamp","vimeo","hulu","disney","crunchyroll",
"steam","roblox","minecraft","fortnite","leetcode","hackerrank","codepen","codesandbox",
"replit","stackoverflow","medium","substack","wordpress","wix","squarespace","shopify",
"etsy","ebay","walmart","target","wayfair","ikea","zillow","redfin","indeed","glassdoor",
"coursera","udemy","khanacademy","duolingo","quizlet","chegg","wikipedia","quora","yelp",
"tripadvisor","booking","expedia","kayak","robinhood","coinbase","binance","cashapp",
"openai","chatgpt","claude","gemini","perplexity","midjourney","huggingface","vercel",
"netlify","heroku","railway","supabase","firebase","cloudflare","trello","asana","jira",
"clickup","airtable","calendly","loom","miro","framer","webflow","cursor","linktree"];

// BLUE PHONE: clone naming conventions seen in the wild
const PRE = ["my","new","mini","free","open","the","get","go","try","not","fake","re","just"];
const SUF = ["clone","app","web","next","react","demo","lite","pro","ai","x","io","hub","js","now"];
const reverse = (s) => s.split("").reverse().join("");
let cloneTarget = "";

// BLUE PHONE: clone host -> walks SITES in order (like dictHost), so all
//   ~100 sites get covered with no repeats before it loops, instead of
//   randomly re-sampling the same popular ones. Mangle pattern is still
//   randomized per visit -- only WHICH site is picked is now ordered.
const CIDX_KEY = "pipeline.cloneidx.v1";
let cloneIdx = (() => {
  try { const v = parseInt(localStorage.getItem(CIDX_KEY), 10); return Number.isFinite(v) ? v : 0; } catch { return 0; }
})();
function cloneHost() {
  const b = SITES[cloneIdx];
  cloneIdx = (cloneIdx + 1) % SITES.length;
  try { localStorage.setItem(CIDX_KEY, String(cloneIdx)); } catch {}
  cloneTarget = b;
  const r = Math.random();
  if (r < 0.34) return b + "-clone" + (Math.random() < 0.25 ? "-" + (2 + (Math.random()*7|0)) : "");
  if (r < 0.46) return "clone-" + b;
  if (r < 0.55) return b + "clone";
  if (r < 0.72) return b + "-" + pick(SUF);
  if (r < 0.86) return pick(PRE) + "-" + b;
  if (r < 0.94) return reverse(b);          // spelled backwards
  return pick(PRE) + b;                       // glued prefix
