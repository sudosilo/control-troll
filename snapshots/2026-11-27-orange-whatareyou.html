<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>WHAT ARE YOU?</title>
<style>
:root{

}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100vh;
  background-image:radial-gradient(#e9dcb8 1.2px,transparent 1.2px);background-size:18px 18px}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
header{text-align:center;margin-bottom:18px}
.logo{display:inline-block;background:var(--y);border:3px solid var(--line);box-shadow:5px 5px 0 var(--line);
  padding:10px 20px;transform:rotate(-2deg);font-family:Impact,"Arial Black",sans-serif;font-size:clamp(2rem,8vw,3.2rem);letter-spacing:1px}
.tag{margin-top:12px;font-size:.9rem;font-style:italic}
.nav{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.btn{background:var(--card);border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:9px 14px;
  font:inherit;font-weight:bold;cursor:pointer;color:var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--t)}
.btn.pink{background:var(--p);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:14px}
.tile{border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:14px 10px;text-align:center;cursor:pointer;
  transition:transform .12s;position:relative;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.tile:hover{transform:rotate(-1.5deg) scale(1.03)}
.tile .ic{font-size:2.4rem}
.tile .nm{font-weight:bold;font-size:.95rem}
.tile .done{position:absolute;top:6px;right:6px;background:var(--ink);color:#fff;font-size:.65rem;padding:2px 6px}
.panel{background:var(--card);border:3px solid var(--line);box-shadow:6px 6px 0 var(--line);padding:20px;margin-top:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;margin-bottom:10px;font-weight:bold}
.bar{height:12px;border:2px solid var(--line);background:#fff;margin-bottom:16px}
.fill{height:100%;background:var(--p);transition:width .3s}
.qtext{font-size:1.3rem;font-weight:bold;margin-bottom:16px;line-height:1.35}
.ans{display:block;width:100%;text-align:left;margin-bottom:10px;background:#fff;border:3px solid var(--line);
  padding:12px 14px;font:inherit;font-size:1rem;cursor:pointer;box-shadow:3px 3px 0 var(--line);color:var(--ink)}
.ans:hover{background:var(--y)}
.ans span{font-weight:bold;margin-right:8px}
.res{text-align:center}
.res .big{font-size:4.5rem;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.res .youare{font-size:.85rem;letter-spacing:3px;margin-top:6px}
.res h2{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(1.8rem,7vw,2.6rem);margin:6px 0 10px;letter-spacing:.5px}
.res p{font-size:1.05rem;line-height:1.55;max-width:520px;margin:0 auto 14px}
.meter{max-width:420px;margin:0 auto 16px;text-align:left;font-size:.8rem}
.mrow{display:flex;align-items:center;gap:8px;margin:4px 0}
.mrow b{width:130px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtrack{flex:1;height:10px;border:2px solid var(--line);background:#fff}
.mfill{height:100%}
.code{font-family:"Courier New",monospace;background:var(--bg);border:2px dashed var(--line);padding:10px;margin:10px auto;
  max-width:420px;word-break:break-all;font-weight:bold}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
input.inp{font:inherit;border:3px solid var(--line);padding:10px;width:100%;max-width:420px;font-family:"Courier New",monospace}
.match-out{margin-top:16px;text-align:center}
.pct{font-family:Impact,"Arial Black",sans-serif;font-size:4rem;color:var(--p)}
.small{font-size:.85rem;margin-top:6px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
.wcard{border:3px solid var(--line);padding:12px;box-shadow:3px 3px 0 var(--line)}
.wcard .q{font-size:.75rem;font-weight:bold;letter-spacing:1px}
.wcard .r{font-size:1.1rem;font-weight:bold;margin-top:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;
  font-weight:bold;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{text-align:center;font-size:.75rem;margin-top:30px}
</style>
</head>

<div class="wrap">

</div>

function traitScores(ans){
  const t=[0,0,0,0,0];
  ans.forEach((v,i)=>{const [_,f,k]=BIG[i];t[f]+=k>0?v-3:3-v});
  return t.map(x=>x/20);
}
function profileMatch(id,t){
  const groups=PROFILES[id].split(" ");
  let best=0,bs=-1e9;
  groups.forEach((g,ri)=>{
    let sc=0;
    for(let k=0;k<5;k++){const c=g[k];const p=c==="+"?1:c==="-"?-1:0;sc+=p===0?-Math.abs(t[k])*0.3:p*t[k]}
    if(sc>bs){bs=sc;best=ri}
  });
  return best;
}

function tally(quiz,p){
  const sc=new Array(quiz.results.length).fill(0);
  p.forEach((o,i)=>{const a=quiz.q[i][o+1];sc[a[1]]+=2;sc[a[2]]+=1});
  let best=0;sc.forEach((v,i)=>{if(v>sc[best])best=i});
  return {sc,best};
}

function finish(){
  const {sc,best}=tally(cur,picks);
  const code=cur.id+"."+picks.join("");
  save(cur.id,{best,code});
  showResult(cur,sc,best,code);
}

function parseCode(c){
  c=(c||"").trim().toLowerCase();
  const m=c.match(/^([a-z]+)\.([0-3]{10})$/);
  if(!m)return null;
  const quiz=QUIZZES.find(z=>z.id===m[1]);
  if(!quiz)return null;
  return {quiz,picks:m[2].split("").map(Number)};
}

function runMatch(){
  const out=document.getElementById("mout");
  const r1=document.getElementById("c1").value.trim().toLowerCase(),r2=document.getElementById("c2").value.trim().toLowerCase();
  const bigRe=/^big\.([1-5]{50})$/;
  if(bigRe.test(r1)||bigRe.test(r2)){
    if(!(bigRe.test(r1)&&bigRe.test(r2))){out.innerHTML='<div class="small">Big Test codes only match other Big Test codes.</div>';return}
    const ta=traitScores(r1.match(bigRe)[1].split("").map(Number)),tb=traitScores(r2.match(bigRe)[1].split("").map(Number));
    let d=0;ta.forEach((v,i)=>d+=Math.abs(v-tb[i]));
    const pct=Math.max(1,Math.min(100,Math.round(100-d/10*100*1.6)));
    let same=0;QUIZZES.forEach(z=>{if(profileMatch(z.id,ta)===profileMatch(z.id,tb))same++});
    const verdict=pct>=85?"Soulmates. Book the venue.":pct>=65?"Strong match. Go get pancakes.":pct>=45?"Could work with effort and snacks.":pct>=25?"Opposites attract, allegedly.":"Run. Both directions.";
    out.innerHTML='<div class="pct">'+pct+'%</div><div class="qtext" style="margin:0">'+verdict+'</div>'+
      '<div class="small">Same result on '+same+' of '+QUIZZES.length+' quizzes</div>'+
      '<div class="meter" style="margin-top:10px">'+TRAITS.map((n,i)=>'<div class="mrow"><b>'+n+'</b><span>'+Math.round((ta[i]+1)*50)+' vs '+Math.round((tb[i]+1)*50)+'</span></div>').join("")+'</div>';
    return;
  }
  const a=parseCode(r1);
  const b=parseCode(r2);
  if(!a||!b){out.innerHTML='<div class="small">One of those codes is busted. Codes look like cheese.0123012301</div>';return}
  if(a.quiz.id!==b.quiz.id){out.innerHTML='<div class="small">Different quizzes. You cannot compare a cheese to a dinosaur. Well, you can, but not here.</div>';return}
  const q=a.quiz;
  const ta=tally(q,a.picks),tb=tally(q,b.picks);
  let same=0;a.picks.forEach((p,i)=>{if(p===b.picks[i])same++});
  let dot=0,na=0,nb=0;ta.sc.forEach((v,i)=>{dot+=v*tb.sc[i];na+=v*v;nb+=tb.sc[i]*tb.sc[i]});
  const cos=(na&&nb)?dot/Math.sqrt(na*nb):0;
  let pct=Math.round(same*4+cos*50+(ta.best===tb.best?10:0));
  pct=Math.max(1,Math.min(100,pct));
  const verdict=pct>=85?"Soulmates. Book the venue.":pct>=65?"Strong match. Go get pancakes.":pct>=45?"Could work with effort and snacks.":pct>=25?"Opposites attract, allegedly.":"Run. Both directions.";
  out.innerHTML='<div class="pct">'+pct+'%</div><div class="qtext" style="margin:0">'+verdict+'</div>'+
    '<div class="small">'+esc(q.results[ta.best][0])+' + '+esc(q.results[tb.best][0])+'</div>'+
    '<div class="small">Same answers on '+same+' of 10 questions</div>';
}

function wrap(ctx,text,x,y,maxW,lh,maxLines){
  const words=String(text).split(" ");let line="",lines=[];
  words.forEach(w=>{const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t});
  if(line)lines.push(line);
  if(maxLines&&lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]+="..."}
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));
  return y+lines.length*lh;
}

function cardBase(W,H,color){
  const c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");
  x.fillStyle="#fff8e7";x.fillRect(0,0,W,H);
  x.fillStyle="#e9dcb8";
  for(let i=0;i<W;i+=28)for(let j=0;j<H;j+=28){x.beginPath();x.arc(i,j,2.5,0,6.283);x.fill()}
  x.fillStyle="#1c1c1c";x.fillRect(76,76,W-120,H-120);
  x.fillStyle="#ffffff";x.fillRect(60,60,W-120,H-120);
  x.lineWidth=8;x.strokeStyle="#1c1c1c";x.strokeRect(60,60,W-120,H-120);
  x.fillStyle=color;x.fillRect(64,64,W-128,360);
  x.fillStyle="#1c1c1c";x.fillRect(64,424,W-128,8);
  return {c,x};
}

function logo(x,W,y){
  x.save();x.translate(W/2,y);x.rotate(-0.03);
  x.font="bold 46px Impact, 'Arial Black', sans-serif";
  const tw=x.measureText("WHAT ARE YOU?").width+50;
  x.fillStyle="#1c1c1c";x.fillRect(-tw/2+8,-38,tw,72);
  x.fillStyle="#ffd23f";x.fillRect(-tw/2,-46,tw,72);
  x.lineWidth=5;x.strokeRect(-tw/2,-46,tw,72);
  x.fillStyle="#1c1c1c";x.textAlign="center";x.fillText("WHAT ARE YOU?",0,8);
  x.restore();
}

function makeCard(id,best){
  const qi=QUIZZES.findIndex(z=>z.id===id),quiz=QUIZZES[qi],r=quiz.results[best];
  const W=1080,H=1350,{c,x}=cardBase(W,H,HEX[qi%HEX.length]);
  x.textAlign="center";x.textBaseline="alphabetic";
  x.font="200px sans-serif";x.fillText(quiz.icon,W/2,320);
  x.fillStyle="#1c1c1c";x.font="bold 34px 'Trebuchet MS', Verdana, sans-serif";
  x.fillText(quiz.title.toUpperCase(),W/2,510);
  x.font="bold 30px 'Trebuchet MS', Verdana, sans-serif";x.fillText("I AM",W/2,580);
  x.font="92px Impact, 'Arial Black', sans-serif";
  let y=wrap(x,r[0].toUpperCase(),W/2,680,W-220,100,2);
  x.font="40px 'Trebuchet MS', Verdana, sans-serif";
  wrap(x,r[1],W/2,y+40,W-240,56,6);
  logo(x,W,H-150);
  return c;
}

function makeWallCard(done,s){
  const W=1080,H=1350,{c,x}=cardBase(W,H,"#3bceac");
  x.textAlign="center";x.fillStyle="#1c1c1c";
  x.font="150px sans-serif";x.fillText(done.slice(0,4).map(z=>z.icon).join(""),W/2,290);
  x.font="bold 34px 'Trebuchet MS', Verdana, sans-serif";x.fillText("MY WALL: "+done.length+" OF "+QUIZZES.length,W/2,510);
  x.font="38px 'Trebuchet MS', Verdana, sans-serif";
  wrap(x,identity(done,s),W/2,590,W-220,54,11);
  logo(x,W,H-150);
  return c;
}

function cardOut(id,best,mode){
  const c=id==="wall"?(()=>{const s=store();return makeWallCard(QUIZZES.filter(z=>s[z.id]),s)})():makeCard(id,best);
  const name="whatareyou-"+id+"-"+Date.now()+".png";
  const dl=()=>{const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Saved")};
  if(mode==="share"){
    c.toBlob(b=>{
      try{const f=new File([b],name,{type:"image/png"});
        if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"WHAT ARE YOU?"}).catch(()=>{});return}
      }catch(e){}
      dl();
    },"image/png");
  }else dl();
}

function identity(done,s){
  if(!done.length)return "";
  const parts=done.map(z=>PHRASE[z.id].replace("{r}",z.results[s[z.id].best][0]));
  if(parts.length===1)return "Behold, a being who "+parts[0]+".";
  return "Behold, a being who "+parts.slice(0,-1).join(", ")+", and "+parts[parts.length-1]+".";
}

  const s=store();
  const done=QUIZZES.filter(z=>s[z.id]);
  const prompt=done.length?imagePrompt(done,s):"";
  window._wallPrompt=prompt;
  app.innerHTML='<div class="panel"><div class="qtext">📌 My Wall</div><div class="small">'+done.length+' of '+QUIZZES.length+' quizzes complete</div>'+
    (done.length?'<div class="panel" style="margin-top:14px;background:#fffdf5"><div class="q" style="font-weight:bold;font-size:.8rem;letter-spacing:1px">YOUR TRUE FORM</div>'+
      '<p style="margin-top:8px;line-height:1.55">'+esc(identity(done,s))+'</p>'+
      '<div class="q" style="font-weight:bold;font-size:.8rem;letter-spacing:1px;margin-top:14px">IMAGE PROMPT</div>'+
      '<div class="small">Paste into any image generator to see your mashup creature.</div>'+
      '<div class="code" style="max-width:none;font-weight:normal;word-break:normal;font-family:Trebuchet MS,Verdana,sans-serif">'+esc(prompt)+'</div>'+
      '<div class="row"><button class="btn primary" onclick="copyText(window._wallPrompt)">Copy Prompt</button>'+
      '<button class="btn pink" onclick="cardOut(\'wall\',0,\'save\')">Save Wall Card</button>'+
      '<button class="btn pink" onclick="cardOut(\'wall\',0,\'share\')">Share Wall Card</button></div></div>':'')+
    (done.length?'<div class="wall">'+done.map((z,i)=>'<div class="wcard" style="background:'+COLORS[QUIZZES.indexOf(z)%COLORS.length]+'">'+
      '<div class="q">'+z.icon+' '+esc(z.title.toUpperCase())+'</div><div class="r">'+esc(z.results[s[z.id].best][0])+'</div></div>').join("")+'</div>'
      :'<div class="small" style="margin-top:12px">Take a quiz and your results stack up here.</div>')+
    '<div class="row"><button class="btn primary" onclick="home()">Take More</button></div></div>';
  scrollTo(0,0);
}

home();
</script>
</body>
</html>
