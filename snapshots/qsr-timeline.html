<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QSR TIMELINE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,600;1,400&family=Share+Tech+Mono&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #f0e8d5;
    font-family: 'Share Tech Mono', monospace;
    overflow-x: hidden;
  }

  #header {
    position: sticky; top: 0; z-index: 60;
    background: #f0e8d5;
    border-bottom: 2px solid #c8940a;
    padding: 6px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  #header h1 { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#b87000; letter-spacing:0.2em; white-space:nowrap; }
  #header .sub { font-size:10px; color:#a08040; letter-spacing:0.12em; overflow:hidden; text-overflow:ellipsis; }

  /* hamburger button -- lives inside header */
  #menu-btn {
    flex-shrink: 0;
    width: 34px; height: 34px;
    background: #c8940a; border: none; border-radius: 4px;
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px;
  }
  #menu-btn span {
    display: block; width: 18px; height: 2px;
    background: #fff; border-radius: 1px;
    transition: all 0.2s;
  }
  #menu-btn.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
  #menu-btn.open span:nth-child(2) { opacity: 0; }
  #menu-btn.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

  /* slide-in panel -- left side, scaled down ~20% */
  #menu-panel {
    position: fixed; top: 0; left: -260px; width: 240px; height: 100vh;
    background: #fffdf5; border-right: 2px solid #c8940a;
    z-index: 79; overflow-y: auto;
    transition: left 0.25s ease;
    padding: 52px 12px 20px;
    box-shadow: 4px 0 20px rgba(0,0,0,0.12);
    font-size: 90%;
  }
  #menu-panel.open { left: 0; }

  .menu-section { margin-bottom: 16px; }
  .menu-section-title {
    font-size: 9px; color: #8a6e3a; letter-spacing: 0.18em;
    margin-bottom: 6px; border-bottom: 1px solid #e0d0a0; padding-bottom: 3px;
  }

  /* search box */
  #search-box {
    width: 100%; padding: 5px 8px;
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    border: 1px solid #c8a060; border-radius: 3px;
    background: #fff8ec; color: #3a2a10;
    outline: none; letter-spacing: 0.04em;
  }
  #search-box:focus { border-color: #c8940a; }
  #search-count { font-size: 9px; color: #8a6e3a; margin-top: 4px; letter-spacing: 0.08em; }
  .search-highlight { background: #fff3cc !important; }

  /* sort buttons inside panel */
  .sort-btn {
    font-family:'Share Tech Mono',monospace; font-size:10px; color:#8a6e3a;
    background:#fff8ec; border:1px solid #c8a060; border-radius:3px;
    padding:4px 10px; cursor:pointer; letter-spacing:0.06em; white-space:nowrap;
    transition:background 0.15s,color 0.15s;
  }
  .sort-btn.active, .sort-btn:hover { background:#c8940a; color:#fff; border-color:#c8940a; }

  #zoom-slider { width:140px; accent-color:#c8940a; cursor:pointer; }
  #zoom-val { font-size:10px; color:#c8940a; letter-spacing:0.05em; }

  /* cat filters inside panel */
  .cat-filter {
    font-family:'Share Tech Mono',monospace; font-size:10px;
    padding:3px 8px; border-radius:3px; border:1px solid;
    cursor:pointer; letter-spacing:0.04em; white-space:nowrap;
    transition:opacity 0.15s; display:flex; align-items:center; gap:5px;
  }
  .cat-filter.off { opacity:0.3; }

  /* overlay behind panel */
  #menu-overlay {
    display: none; position: fixed; inset: 0; z-index: 78;
    background: rgba(0,0,0,0.15);
  }
  #menu-overlay.open { display: block; }
  #chart-wrap { overflow:auto; max-height:calc(100vh - 88px); }

  #axis-row {
    position:sticky; top:0; z-index:20;
    background:#f8f2e4; border-bottom:2px solid #c8a060;
    display:flex; margin-left:160px;
  }
  .year-tick {
    font-size:9px; color:#8a6e3a; text-align:center;
    border-left:1px solid #e0d4b0; padding:3px 0;
    flex-shrink:0; overflow:hidden; white-space:nowrap;
  }
  .year-tick.decade { border-left-color:#c8a060; color:#5a4010; font-weight:bold; }

  /* rows */
  .row {
    display:flex; align-items:flex-start;
    border-bottom:1px solid #e8dfc8;
    contain:layout style;
  }
  .row:hover { background:rgba(200,148,10,0.04); }

  .row-label {
    width:160px; min-width:160px;
    padding:4px 6px 4px 10px;
    position:sticky; left:0;
    background:#f0e8d5; z-index:10;
    border-right:2px solid #ddd0a0;
    cursor:pointer;
    min-height:32px;
  }
  .row-label .lname { font-size:10px; color:#3a2a10; display:block; line-height:1.3; letter-spacing:0.02em; }
  .row-label .lyear { font-size:9px; color:#8a6e3a; display:block; }
  .row-label .lacq  { font-size:8px; color:#7744bb; display:block; letter-spacing:0.04em; }
  .row.dead .row-label .lname { color:#999; text-decoration:line-through; text-decoration-color:#bbb; }

  .row-track { flex:1; position:relative; background-repeat:repeat-y; background-position:0 0; }
  /* height depends on whether ownership ribbon exists */
  .row-track.has-ribbon { padding-bottom:10px; }

  /* main bar */
  .bar {
    position:absolute; top:4px; height:16px;
    border-radius:3px; cursor:pointer;
    display:flex; align-items:center; padding:0 5px;
    overflow:hidden;
    transition:height 0.12s, filter 0.12s;
    z-index:3;
  }
  .bar:hover { height:20px; filter:brightness(1.1); z-index:5; }
  .bar.dead {
    background-image:repeating-linear-gradient(
      45deg, transparent, transparent 3px,
      rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 6px
    ) !important;
    opacity:0.6;
  }
  .bar-label {
    font-size:9px; font-family:'Share Tech Mono',monospace;
    color:rgba(255,255,255,0.95);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,0.45);
  }

  /* ownership ribbon */
  .ribbon {
    position:absolute; top:24px; height:8px; z-index:2;
    display:flex; align-items:center; overflow:hidden;
    border-radius:1px;
  }
  .ribbon-seg {
    height:100%; cursor:pointer;
    position:relative; overflow:hidden;
    transition:filter 0.12s;
    display:flex; align-items:center;
  }
  .ribbon-seg:hover { filter:brightness(1.2); z-index:4; }
  .ribbon-seg-label {
    font-size:7px; font-family:'Share Tech Mono',monospace;
    color:rgba(255,255,255,0.9); white-space:nowrap;
    overflow:hidden; padding:0 2px;
    pointer-events:none; text-shadow:0 1px 1px rgba(0,0,0,0.5);
  }
  /* divider triangle between ownership segments */
  .ribbon-div {
    position:absolute; top:0; right:-4px;
    width:0; height:0;
    border-top:4px solid transparent;
    border-bottom:4px solid transparent;
    border-left:4px solid;
    z-index:5; pointer-events:none;
  }

  /* tooltip / detail panel */
  #tooltip {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    background:#fffdf5; border:2px solid #c8940a;
    padding:13px 16px; max-width:380px; width:92vw;
    border-radius:6px; box-shadow:0 6px 28px rgba(0,0,0,0.15);
    display:none; z-index:200; max-height:50vh; overflow-y:auto;
    contain:layout style;
  }
  #tooltip h2 { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.1em; margin-bottom:2px; }
  #tooltip .tip-meta { font-size:10px; color:#8a6e3a; letter-spacing:0.1em; margin-bottom:7px; }
  #tooltip p { font-family:'Lora',serif; color:#3a2a10; font-size:12px; line-height:1.7; }
  #tooltip .tip-tagline { font-family:'Lora',serif; font-style:italic; color:#5a4a20; font-size:12px; margin-bottom:6px; }

  .own-chain { margin-top:10px; border-top:1px solid #e0d0a0; padding-top:8px; }
  .own-chain-title { font-size:9px; color:#8a6e3a; letter-spacing:0.12em; margin-bottom:5px; }
  .own-chain-row {
    display:flex; align-items:center; gap:6px;
    font-size:10px; color:#3a2a10; padding:2px 0;
    cursor:pointer;
  }
  .own-chain-row:hover { color:#b87000; }
  .own-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .own-years { color:#8a6e3a; font-size:9px; white-space:nowrap; }

  .era-block { margin-top:8px; border-top:1px solid #e0d0a0; padding-top:6px; }
  .era-decade { font-size:9px; color:#c8940a; letter-spacing:0.1em; margin-bottom:2px; }
  .era-text { font-family:'Lora',serif; font-size:11px; color:#3a2a10; line-height:1.6; margin-bottom:6px; }

  #tip-close { position:absolute; top:7px; right:11px; font-size:17px; color:#bbb; cursor:pointer; font-weight:bold; }
  #tip-link { position:absolute; top:9px; right:33px; font-size:14px; color:#c8940a; cursor:pointer; user-select:none; }
  #tip-link:active { color:#8a6e3a; }
  #tip-copied { display:none; position:absolute; bottom:10px; right:11px; font-size:10px; color:#8a6e3a; letter-spacing:0.08em; background:#fff8ec; padding:3px 8px; border:1px solid #c8a060; border-radius:3px; }

  #tip-locations { margin:6px 0 8px; }
  #tip-locations:empty { display:none; }
  .tip-loc-row { display:flex; gap:8px; font-size:10px; color:#3a2a10; padding:2px 0; align-items:baseline; }
  .tip-loc-label { font-size:8px; color:#8a6e3a; letter-spacing:0.12em; min-width:54px; flex-shrink:0; padding-top:1px; }
  .tip-loc-value { font-family:'Lora',serif; color:#3a2a10; }
  .tip-loc-year { color:#8a6e3a; font-size:9px; }
  .tip-franchise-spark { font-size:9px; color:#8a6e3a; margin-top:2px; font-family:'Share Tech Mono',monospace; }

  /* tabs */
  #tab-bar {
    display: flex; gap: 2px;
    background: #e0d4b0;
    border-bottom: 2px solid #c8940a;
    padding: 0 14px;
    overflow-x: auto; scrollbar-width: none;
  }
  #tab-bar::-webkit-scrollbar { display:none; }
  .tab-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em;
    color: #8a6e3a; background: transparent;
    border: none; border-bottom: 3px solid transparent;
    padding: 7px 12px 5px; cursor: pointer; white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn.active { color: #b87000; border-bottom-color: #c8940a; background: #f0e8d5; }
  .tab-btn:hover { color: #b87000; }

  /* lifespan view */
  #lifespan-wrap { overflow-y: auto; max-height: calc(100vh - 88px); }
  .ls-row { display:flex; align-items:center; border-bottom:1px solid #e8dfc8; min-height:26px; }
  .ls-row:hover { background:rgba(200,148,10,0.04); }
  .ls-label {
    width:160px; min-width:160px; padding:3px 6px 3px 10px;
    position:sticky; left:0; background:#f0e8d5;
    border-right:2px solid #ddd0a0; cursor:pointer;
  }
  .ls-label .lname { font-size:10px; color:#3a2a10; display:block; line-height:1.3; }
  .ls-label .lyrs  { font-size:9px; color:#8a6e3a; display:block; }
  .ls-row.dead .ls-label .lname { color:#999; text-decoration:line-through; text-decoration-color:#bbb; }
  .ls-track { flex:1; padding:4px 8px; }
  .ls-bar {
    height:16px; border-radius:3px; cursor:pointer;
    display:flex; align-items:center; padding:0 6px;
    transition:filter 0.12s, height 0.12s; min-width:4px;
    overflow:hidden;
  }
  .ls-bar:hover { filter:brightness(1.1); height:20px; }
  .ls-bar.dead {
    background-image:repeating-linear-gradient(
      45deg,transparent,transparent 3px,rgba(0,0,0,0.18) 3px,rgba(0,0,0,0.18) 6px
    ) !important; opacity:0.6;
  }
  .ls-bar-label {
    font-size:9px; font-family:'Share Tech Mono',monospace;
    color:rgba(255,255,255,0.95); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
    pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,0.4);
  }
  #ls-axis, #gy-axis {
    display:flex; margin-left:160px;
    background:#f8f2e4; border-bottom:2px solid #c8a060;
    position:sticky; top:0; z-index:20;
  }
  .ls-tick {
    font-size:9px; color:#8a6e3a; text-align:center;
    border-left:1px solid #e0d4b0; padding:3px 0;
    flex-shrink:0; white-space:nowrap; overflow:hidden;
  }
  .ls-tick.major { border-left-color:#c8a060; color:#5a4010; font-weight:bold; }

  /* snapshot view */
  #snapshot-wrap { overflow-y:auto; max-height:calc(100vh - 88px); }
  #snap-controls {
    padding:10px 14px; background:#f8f2e4;
    border-bottom:1px solid #ddd0a0;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    position:sticky; top:0; z-index:20;
  }
  #snap-year-display {
    font-family:'Bebas Neue',sans-serif; font-size:32px;
    color:#b87000; letter-spacing:0.1em; min-width:70px;
  }
  #snap-slider { flex:1; min-width:120px; accent-color:#c8940a; }
  .snap-stat { font-size:10px; color:#8a6e3a; letter-spacing:0.08em; }
  #snap-grid { display:flex; flex-wrap:wrap; gap:8px; padding:12px 14px; }
  .snap-card {
    border-radius:5px; padding:7px 10px; cursor:pointer;
    min-width:130px; flex:1; border:1px solid;
    transition:filter 0.15s; max-width:200px;
  }
  .snap-card:hover { filter:brightness(0.94); }
  .snap-card .sc-name { font-size:11px; font-family:'Share Tech Mono',monospace; font-weight:bold; display:block; }
  .snap-card .sc-owner { font-size:9px; opacity:0.8; display:block; margin-top:2px; }
  .snap-card .sc-age  { font-size:9px; opacity:0.7; display:block; margin-top:1px; }
  .snap-card .sc-count { font-size:10px; opacity:0.95; display:block; margin-top:3px; font-weight:bold; }
  .snap-card .sc-count.interp { font-style:italic; opacity:0.7; font-weight:normal; }
  .snap-card .sc-marker { display:inline-block; width:11px; font-weight:bold; opacity:0.7; }
  .snap-card .sc-delta { font-size:9px; padding:1px 5px; margin-left:4px; border-radius:8px; font-weight:bold; }
  .snap-card .sc-delta.up   { background:rgba(0,128,0,0.18); color:#2a6a2a; }
  .snap-card .sc-delta.down { background:rgba(180,30,30,0.18); color:#8a2a2a; }
  .snap-card .sc-hq    { font-size:9px; opacity:0.7; display:block; margin-top:1px; }
  /* map view */
  #map-wrap { padding:0 0 20px; }
  #map-controls {
    padding:10px 14px; background:#f8f2e4;
    border-bottom:1px solid #ddd0a0;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    position:sticky; top:0; z-index:20;
  }
  #map-year-display {
    font-family:'Bebas Neue',sans-serif; font-size:32px;
    color:#b87000; letter-spacing:0.1em; min-width:70px;
  }
  #map-slider { flex:1; min-width:120px; accent-color:#c8940a; }
  #map-stats-line { font-size:10px; color:#8a6e3a; letter-spacing:0.08em; }
  #map-chain-select-wrap {
    padding:6px 14px; background:#f0e8d5; border-bottom:1px solid #ddd0a0;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .map-mode-btn {
    font-family:'Share Tech Mono',monospace; font-size:10px; color:#8a6e3a;
    background:#fff8ec; border:1px solid #c8a060; border-radius:3px;
    padding:4px 10px; cursor:pointer; letter-spacing:0.06em;
    transition:background 0.15s,color 0.15s;
  }
  .map-mode-btn.active, .map-mode-btn:hover { background:#c8940a; color:#fff; border-color:#c8940a; }
  #map-chain-select {
    font-family:'Share Tech Mono',monospace; font-size:11px;
    border:1px solid #c8a060; border-radius:3px;
    background:#fff8ec; color:#3a2a10; padding:4px 8px; outline:none;
  }
  #map-svg-container { padding:8px 14px; }
  #map-svg-container svg { width:100%; max-width:860px; display:block; }
  .state-path {
    stroke:#c8b070; stroke-width:0.8; fill:#e8dfc8;
    cursor:pointer; transition:fill 0.2s;
  }
  .state-path:hover { stroke:#c8940a; stroke-width:1.5; }
  .state-path.origin-state { fill:#c8940a; }
  .state-path.hq-state    { fill:#b87000; }
  .state-path.both-state  { fill:#8a4400; }
  .state-path.chain-active { fill:#cc4400; }
  .state-path.chain-origin { fill:#c8940a; }
  #map-legend {
    padding:6px 14px; display:flex; flex-wrap:wrap; gap:10px;
    font-size:9px; color:#5a4a20; font-family:'Share Tech Mono',monospace;
    letter-spacing:0.08em;
  }
  .map-leg-item { display:flex; align-items:center; gap:4px; }
  .map-leg-swatch { width:12px; height:12px; border-radius:2px; border:1px solid #c8a060; }
  #map-state-tip {
    position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
    background:#fffdf5; border:2px solid #c8940a; padding:8px 14px;
    border-radius:5px; font-size:11px; color:#3a2a10;
    font-family:'Share Tech Mono',monospace; letter-spacing:0.06em;
    display:none; z-index:100; max-width:340px; width:92vw;
    box-shadow:0 4px 18px rgba(0,0,0,0.13);
  }
</style>
</head>
<body>

<div id="header">
  <button id="menu-btn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
  <h1>QSR TIMELINE</h1>
  <input type="range" id="zoom-slider" min="2" max="32" value="8" step="1" style="width:90px;accent-color:#c8940a;cursor:pointer;flex-shrink:0;">
  <span id="zoom-val" style="font-size:10px;color:#c8940a;white-space:nowrap;flex-shrink:0;">8px/yr</span>
</div>

<div id="menu-overlay"></div>

<div id="menu-panel">
  <div class="menu-section">
    <div class="menu-section-title">SEARCH</div>
    <input type="search" id="search-box" placeholder="Type to filter..." autocomplete="off">
    <div id="search-count"></div>
  </div>
  <div class="menu-section">
    <div class="menu-section-title">SORT BY</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      <button class="sort-btn" data-sort="duration">LIFESPAN</button>
      <button class="sort-btn active" data-sort="founded">YEAR FOUNDED</button>
      <button class="sort-btn" data-sort="name">NAME</button>
      <button class="sort-btn" data-sort="cat">CATEGORY</button>
    </div>
  </div>
  <div class="menu-section">
    <div class="menu-section-title">FILTER BY CATEGORY</div>
    <div id="cat-filters" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>
  <div class="menu-section">
    <div class="menu-section-title">RADIAL METRIC</div>
    <div style="font-size:9px;color:#7a5a20;margin-bottom:6px;line-height:1.5;">
      Spoke length on the RADIAL view encodes this metric. Chains without data are hidden.
    </div>
    <div id="radial-metric-buttons" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>
  <div class="menu-section">
    <div class="menu-section-title">OWNERSHIP RIBBON</div>
    <div style="font-size:10px;color:#5a4a20;line-height:1.6;">
      Colored strip below each bar shows parent company history. Tap a segment for that ownership era.
    </div>
  </div>
</div>

<div id="tab-bar">
  <button class="tab-btn active" data-tab="timeline">TIMELINE</button>
  <button class="tab-btn" data-tab="lifespan">LIFESPAN</button>
  <button class="tab-btn" data-tab="graveyard">GRAVEYARD</button>
  <button class="tab-btn" data-tab="snapshot">SNAPSHOT</button>
  <button class="tab-btn" data-tab="radial">RADIAL</button>
  <button class="tab-btn" data-tab="map">MAP</button>
</div>

<div id="chart-wrap">
  <div id="chart"></div>
</div>

<div id="lifespan-wrap" style="display:none;">
  <div id="ls-axis"></div>
  <div id="ls-chart"></div>
</div>

<div id="graveyard-wrap" style="display:none; overflow-y:auto; max-height:calc(100vh - 88px);">
  <div id="gy-axis"></div>
  <div id="gy-chart"></div>
</div>

<div id="snapshot-wrap" style="display:none;">
  <div id="snap-controls">
    <div id="snap-year-display">2026</div>
    <input type="range" id="snap-slider" min="1880" max="2026" value="2026" step="1">
    <div>
      <div class="snap-stat" id="snap-alive-count"></div>
      <div class="snap-stat" id="snap-cat-count"></div>
    </div>
  </div>
  <div id="snap-grid"></div>
</div>

<div id="radial-wrap" style="display:none; overflow:auto; max-height:calc(100vh - 88px);">
  <canvas id="radial-canvas"></canvas>
</div>

<div id="map-wrap" style="display:none; overflow-y:auto; max-height:calc(100vh - 88px);">
  <div id="map-controls">

  // ---- POS / PAYMENT ----
  { name:'NCR Corporation',         cat:'pos', founded:1884, closed:null, tagline:'Invented the cash register.', desc:'National Cash Register Company. Dayton Ohio. The company that invented the cash register. Powered the transaction layer of virtually every American diner, restaurant, and retail store for over a century. POS terminals, ATMs, self-checkout.' },
  { name:'IBM POS Systems',         cat:'pos', founded:1973, closed:null, tagline:'The first modern restaurant POS.', desc:'IBM enters the point-of-sale market with the IBM 3650/3660 restaurant system -- the first modern POS system. Installed at McDonald\'s and Burger King in the mid-1970s. IBM defines what a restaurant register looks like for a generation.' },
  { name:'Verifone',                cat:'pos', founded:1981, closed:null, tagline:'The swipe terminal.', desc:'William Melton. Honolulu Hawaii. The company that puts the credit card swipe terminal on every counter in America. Before Verifone, card authorization was a phone call or a paper imprinter. Verifone makes the swipe instant.' },
  { name:'PAR Technology',          cat:'pos', founded:1968, closed:null, tagline:'Brink POS. Drive-thru screens.', desc:'Originally PAR Government Systems. Pivots to restaurant POS in the 1980s. Brink POS becomes the cloud-native system of choice for major QSR chains. PAR powers the drive-thru order screen at thousands of locations.' },
  { name:'Micros Systems',          cat:'pos', founded:1977, closed:null, tagline:'Dominant full-service POS.', desc:'College Park Maryland. MICROS becomes the dominant POS platform for full-service restaurants and hotels. Acquired by Oracle 2014 for $5.3 billion. Oracle MICROS still runs in tens of thousands of restaurants worldwide.' },
  { name:'Aloha POS (Radiant)',     cat:'pos', founded:1985, closed:null, tagline:'Standard in casual dining.', desc:'Aloha Technologies builds one of the most widely deployed restaurant POS systems in America. Acquired by Radiant Systems, then by NCR in 2011. NCR Aloha becomes a standard in casual dining.' },
  { name:'Heartland Payment Sys.',  cat:'pos', founded:1997, closed:null, tagline:'Major restaurant processor.', desc:'Princeton New Jersey. Heartland becomes one of the largest payment processors in America, focused heavily on restaurants. Breached in 2008 in one of the largest card data heists in history. Acquired by Global Payments 2016.' },
  { name:'Square (restaurant)',     cat:'pos', founded:2009, closed:null, tagline:'The dongle that democratized POS.', desc:'Jack Dorsey and Jim McKelvey. The dongle that turns an iPhone into a card reader. Democratizes payment processing for small restaurants and food trucks. Square for Restaurants becomes a standalone product 2018.' },
  { name:'Toast POS',               cat:'pos', founded:2012, closed:null, tagline:'Restaurant-native cloud POS.', desc:'Boston. Restaurant-specific cloud POS that goes public 2021. Dominates the independent restaurant market. Brings online ordering, loyalty, and payroll under one platform. One of the fastest-growing restaurant tech companies in history.' },
  { name:'Revel Systems',           cat:'pos', founded:2010, closed:null, tagline:'iPad POS.', desc:'iPad-based POS. San Francisco. Part of the wave that brought tablet POS to restaurants. Acquired by Shift4 2023.' },

  // ---- SUPPLY / DISTRIBUTION ----
  { name:'Performance Food Group', cat:'supply', founded:1885, closed:null, tagline:'Third national distributor.', desc:'Richmond Virginia. Third major national food distributor. Origins in a 19th-century butter and egg business. Now publicly traded supplying restaurants, schools, and healthcare.' },
  { name:'Gordon Food Service',    cat:'supply', founded:1897, closed:null, tagline:'Largest private distributor.', desc:'Grand Rapids Michigan. Family-owned food distributor. Largest privately held food distributor in North America. Never went public. Still family-controlled after 125+ years.' },
  { name:'McLane Company',         cat:'supply', founded:1894, closed:null, tagline:'Berkshire Hathaway distribution.', desc:'Originally a Texas grocery. Became a Walmart subsidiary 1990. Acquired by Berkshire Hathaway 2003. Delivers to 7-Eleven, Yum Brands, and hundreds of chains.' },
  { name:'Ben E. Keith Foods',     cat:'supply', founded:1906, closed:null, tagline:'Southwest regional distributor.', desc:'Fort Worth Texas. Regional food distributor with deep roots in Texas and the Southwest. Also operates a major beer distribution arm. Family-owned.' },
  { name:'Martin-Brower',         cat:'supply', founded:1934, closed:null, tagline:"McDonald's dedicated supplier.", desc:"Chicago. One of McDonald's primary distribution partners for decades. Operates dedicated supply chain infrastructure exclusively for McDonald's in many markets. The company that gets the buns and beef to the store before dawn." },
  { name:'Sysco Corporation',      cat:'supply', founded:1969, closed:null, tagline:'Largest food distributor in N.A.', desc:'Houston Texas. The largest food distribution company in North America. If a restaurant is not growing its own food, Sysco probably delivered it. The invisible supply chain of the American restaurant.' },
  { name:'US Foods',               cat:'supply', founded:1989, closed:null, tagline:'Second largest distributor.', desc:'Merger of several regional distributors. Second largest food distributor in America behind Sysco. The two companies attempted to merge 2015; the FTC blocked it.' },
  { name:'Reinhart Foodservice',   cat:'supply', founded:1972, closed:null, tagline:'Top-10 independent distributor.', desc:'La Crosse Wisconsin. Regional distributor that becomes one of the top ten in North America. Acquired by Performance Food Group 2019.' },

  // ---- HYGIENE / UNIFORM ----
  { name:'Vulcan Equipment',   cat:'hygiene', founded:1865, closed:null, tagline:'The commercial range.', desc:'Louisville Kentucky. Commercial ranges, fryers, and steamers. The gas range and fryer in the back of the house is likely a Vulcan. Standard equipment in institutional and restaurant kitchens for over 150 years.' },
  { name:'Bunn-O-Matic',       cat:'hygiene', founded:1840, closed:null, tagline:'The diner coffee brewer.', desc:'Springfield Illinois. The commercial coffee brewer. The Bunn brewer is the standard drip coffee machine in diners and fast food restaurants across America.' },
  { name:'ServiceMaster',      cat:'hygiene', founded:1929, closed:null, tagline:'Cleaning and pest control.', desc:'Memphis. Cleaning services, pest control, and disaster restoration. Parent of Terminix and other brands. Historically provided cleaning and maintenance services to restaurant chains.' },
  { name:'Diversey',           cat:'hygiene', founded:1923, closed:null, tagline:'Commercial kitchen sanitation.', desc:'Originally part of Lever Brothers. Cleaning and hygiene products for commercial kitchens. Competes directly with Ecolab. Sold to Bain Capital, then public.' },
  { name:'Ecolab',             cat:'hygiene', founded:1923, closed:null, tagline:'Cleans the kitchen you eat in.', desc:'St. Paul Minnesota. Sanitizers, pest control, dishwashing systems, kitchen hygiene. If a commercial kitchen is operating to code, Ecolab is almost certainly involved. Operates in 170 countries.' },
  { name:'Aramark',            cat:'hygiene', founded:1936, closed:null, tagline:'Uniform and facilities services.', desc:'Philadelphia. Uniform services, food service management, and facility services. Operates cafeterias in stadiums, hospitals, universities, and prisons.' },
  { name:'Cintas Corporation', cat:'hygiene', founded:1929, closed:null, tagline:'The uniform on the employee.', desc:'Cincinnati Ohio. The company that supplies the uniform on the employee behind the counter. Also supplies restroom services, floor mats, and first aid stations.' },
  { name:'Steritech (Rentokil)',cat:'hygiene', founded:1987, closed:null, tagline:'The health inspector you hire.', desc:'Charlotte North Carolina. Food safety auditing and pest prevention for restaurant chains. The company that shows up unannounced to grade your kitchen. Acquired by Rentokil.' },

  // ---- ADJACENT / EQUIPMENT ----
  { name:'Hobart Corporation',    cat:'adjacent', founded:1897, closed:null, tagline:'The commercial mixer and slicer.', desc:'Troy Ohio. Commercial kitchen equipment. Hobart makes the mixer, the slicer, the dishwasher, and the scale in virtually every commercial kitchen in America. The KitchenAid mixer is a Hobart invention.' },
  { name:'Manitowoc Foodservice', cat:'adjacent', founded:1902, closed:null, tagline:'The ice machine.', desc:'Manitowoc Wisconsin. Ice machines. The Manitowoc ice machine is in more restaurants than any other brand. Also makes commercial cooking equipment.' },
  { name:'Taylor Company',        cat:'adjacent', founded:1926, closed:null, tagline:'The McFlurry machine.', desc:'Rockton Illinois. Makes the soft serve and milkshake machines in McDonald\'s. For decades McDonald\'s had an exclusive service agreement that only Taylor-certified technicians could repair Taylor machines. This is why the McFlurry machine is always broken.' },
  { name:'Henny Penny',           cat:'adjacent', founded:1957, closed:null, tagline:'The pressure fryer.', desc:'Eaton Ohio. Commercial pressure fryers. The Henny Penny fryer is what KFC and Church\'s Chicken use to pressure-fry. The machine that makes the chicken.' },
  { name:'Rational AG',           cat:'adjacent', founded:1973, closed:null, tagline:'The combi oven.', desc:'Landsberg Germany. The Rational SelfCooking Center is the single most transformative piece of commercial kitchen equipment of the last 40 years. Steam plus convection. In every airport, hospital, hotel, and large QSR kitchen worldwide.' },
  { name:'Middleby Corporation',  cat:'adjacent', founded:1888, closed:null, tagline:'Commercial cooking equipment holding co.', desc:'Elgin Illinois. Holds Blodgett ovens, Pitco fryers, Welbilt brands, and dozens more. The invisible conglomerate behind the equipment in the commercial kitchen.' },
  { name:'Loomis (Armored Car)',  cat:'adjacent', founded:1853, closed:null, tagline:'Cash pickup from restaurants.', desc:'Originally Wells Fargo armored transport. Before digital payments dominated, armored car services collected daily cash drops from every fast food location in America. The company that moved the money out.' },

  // ---- BERTO\'S / SOUTHWEST BURRITO CHAINS ----
  // The "-berto's" family of Mexican fast food chains is a regional phenomenon
  // centered in Phoenix AZ, Southern California, and the Pacific Northwest.
  // Most trace back to Roberto Robledo, who opened the original Roberto's in
  // San Diego in 1964. Former employees spread out and opened their own shops
  // with similar names (Filiberto's, Adalberto's, Julioberto's, Rigoberto's,
  // Herberto's, Humberto's, Salberto's, etc.). They are not a franchise system
  // -- they are a cultural diaspora of a single cooking style.
  { name:"Roberto's Mexican Food", cat:'mexican', founded:1964, closed:null, tagline:'The original -berto\'s.',
    origin:{ city:'San Diego', state:'CA' },
    hq:[
      { city:'San Diego', state:'CA', from:1964, to:2026 },
    ],
    eras:{ 1960:'Roberto Robledo opens the first Roberto\'s in San Diego 1964. Rolled and deep-fried tacos, carne asada burritos, and horchata. 24-hour service. Inexpensive.', 1970:'Former employees and family members open their own shops with similar names throughout Southern California and Arizona. The -berto\'s naming convention is born.', 1990:'The brand is centered on San Diego but the cultural format spreads north into Phoenix and east into Nevada as Mexican-American families settle those markets.', 2020:'Roberto\'s itself has roughly 70+ locations in San Diego County. The brand has never franchised in the traditional sense -- it operates through family-owned and operator-owned units. The -berto\'s ecosystem now numbers over 1,000 total locations across all variants.' },
    desc:'Roberto Robledo, San Diego 1964. The original. Cheap, 24-hour, carne asada burritos, rolled tacos, horchata. Former employees opened their own shops with similar names across the Southwest, creating the -berto\'s ecosystem: Filiberto\'s, Adalberto\'s, Julioberto\'s, Rigoberto\'s, Herberto\'s, Humberto\'s, Salberto\'s, and dozens of regional variants. Not a franchise -- a cultural diaspora of one cooking style.' },

  { name:"Filiberto's Mexican Food", cat:'mexican', founded:1993, closed:null, tagline:'Phoenix -berto\'s.',
    origin:{ city:'Mesa', state:'AZ' },
    hq:[
      { city:'Tempe', state:'AZ', from:1993, to:2026 },
    ],
    eras:{ 1990:'First Filiberto\'s opens in Mesa AZ 1993. Operated by a family connected to the broader berto\'s cultural network out of San Diego.', 2000:'Rapid expansion across the Phoenix metro. The 24-hour drive-thru model with $2-4 tacos and burritos dominates late-night and early-morning in the Valley.', 2020:'Roughly 45-50 locations in the Phoenix metro and scattered across Arizona. Competes directly with Taco Bell on price but with a more authentic product at comparable or lower cost.' },
    desc:'Mesa Arizona. The dominant -berto\'s brand in the Phoenix Valley. ~50 locations across Arizona. 24-hour drive-thru, carne asada, machaca, green chile burritos, chile colorado. The late-night burrito option that most Phoenix residents have a strong opinion about. Part of the broader Roberto\'s-origin berto\'s ecosystem, not a formal franchise of the San Diego chain.' },

  { name:"Adalberto's Mexican Food", cat:'mexican', founded:1979, closed:null, tagline:'Southern California -berto\'s.',
    origin:{ city:'National City', state:'CA' },
    desc:'National City California. One of the earliest -berto\'s offshoots from the Roberto\'s model. Spread through San Diego and Southern California. Roughly 30+ locations. 24-hour, carne asada, pollo asado, red and green chile. A fixture of San Diego County late-night eating alongside the original Roberto\'s locations.' },

  { name:"Rigoberto's Mexican Food", cat:'mexican', founded:1985, closed:null, tagline:'San Diego -berto\'s variant.',
    origin:{ city:'San Diego', state:'CA' },
    desc:'San Diego California. Another -berto\'s family member spread from the Roberto\'s origin. Roughly 20+ locations in San Diego County. Indistinguishable from the others to outsiders -- locals have fierce loyalties between the different -berto\'s chains.' },

  { name:"Alberto's Mexican Food",  cat:'mexican', founded:1981, closed:null, tagline:'The common -berto\'s.',
    origin:{ city:'Spring Valley', state:'CA' },
    desc:'Spring Valley California (San Diego County). One of the most widespread -berto\'s variants with locations scattered across San Diego, Los Angeles, and the Inland Empire. The name Alberto\'s is one of the most commonly reused in the berto\'s ecosystem, making exact location counts difficult. Estimated 50+ locations across California.' },

  { name:"Julioberto's Mexican Food", cat:'mexican', founded:1998, closed:null, tagline:'Phoenix -berto\'s variant.',
    origin:{ city:'Phoenix', state:'AZ' },
    desc:'Phoenix Arizona. Part of the -berto\'s ecosystem in the Valley of the Sun. Similar menu to Filiberto\'s -- carne asada burritos, tacos, huevos rancheros, machaca, flour tortillas made in-house at some locations. Roughly 10-15 locations in Phoenix and Tucson metro areas. The berto\'s naming convention continues: if you worked at a -berto\'s and opened your own, you named it after your own first name plus -berto\'s.' },

  { name:"Humberto's Mexican Food",  cat:'mexican', founded:1989, closed:null, tagline:'California -berto\'s.',
    origin:{ city:'Santa Ana', state:'CA' },
    desc:'Santa Ana California. -Berto\'s variant primarily in Orange County and the San Fernando Valley. Roughly 15-20 locations. The same 24-hour carne asada and pollo asado format. Known in some areas for slightly larger portions than competitors.' },

  { name:"Herberto's Mexican Food",  cat:'mexican', founded:1991, closed:null, tagline:'Desert Southwest -berto\'s.',
    origin:{ city:'El Centro', state:'CA' },
    desc:'El Centro California (Imperial Valley, near the Arizona border). The -berto\'s ecosystem extends into the desert communities east of San Diego. Herberto\'s locations appear in El Centro, Yuma AZ, and scattered across the border region. Roughly 10 locations.' },

  { name:'Muchas Gracias Mexican Food', cat:'mexican', founded:1985, closed:null, tagline:'Pacific Northwest -berto\'s style.',
    origin:{ city:'Portland', state:'OR' },
    hq:[
      { city:'Portland', state:'OR', from:1985, to:2026 },
    ],
    eras:{ 1980:'First Muchas Gracias opens in Portland OR 1985 by a family with roots in the same San Diego taqueria culture that produced the berto\'s chains. 24-hour drive-thru, carne asada burritos.', 1990:'Expands across Oregon, Washington, and Idaho. Becomes the dominant late-night Mexican food chain in the Pacific Northwest -- a region that was underserved by Mexican fast food until this chain arrived.', 2020:'Roughly 30+ locations across Oregon, Washington, and Idaho. In Portland and Salem, Muchas Gracias has the same cultural role that Filiberto\'s has in Phoenix -- the default late-night Mexican option after midnight.' },
    desc:'Portland Oregon. The -berto\'s equivalent for the Pacific Northwest. Founded 1985 with the same 24-hour carne asada burrito model as the San Diego original. Dominant late-night Mexican in Oregon, Washington, and Idaho. ~30+ locations. Not technically a berto\'s but same cultural lineage -- a family bringing San Diego taqueria culture to a northern market.' },

  { name:'La Salsa Fresh Mexican Grill', cat:'mexican', founded:1979, closed:null, tagline:'LA fresh-Mex.',
    origin:{ city:'Los Angeles', state:'CA' },
    desc:'Los Angeles. Fresh-Mex competitor to Baja Fresh and Rubio\'s. Open-kitchen, marinated grilled meats. Peaked at ~120 locations in California and Arizona. Acquired by Kahala Brands. About 30 locations remain, mostly California.' },

  { name:'Nico\'s Mexican Food',  cat:'mexican', founded:1979, closed:null, tagline:'Phoenix Tex-Mex institution.',
    origin:{ city:'Phoenix', state:'AZ' },
    desc:'Phoenix Arizona. Multiple independently operated Nico\'s locations across the Valley -- not a unified franchise but a family-run group. Famous for the green corn tamale and the #6 combo plate. A Phoenix institution that predates most chain Mexican food in the market. The boundary between Nico\'s and Roberto\'s/Filiberto\'s turf is contested in every Phoenix neighborhood.' },

  { name:'Garcia\'s Mexican Restaurant', cat:'mexican', founded:1956, closed:2017, tagline:'Phoenix original, now closed.',
    origin:{ city:'Phoenix', state:'AZ' },
    eras:{ 1950:'John Garcia opens the first Garcia\'s in Phoenix 1956. Sit-down Mexican restaurant with margaritas, chips and salsa, enchilada plates.', 2000:'Multiple Valley locations. A Phoenix institution for six decades.', 2017:'All Garcia\'s locations close 2017, ending a 61-year run.' },
    desc:'John Garcia, Phoenix 1956. The sit-down Mexican dining institution that the drive-thru -berto\'s chains existed alongside. Margaritas, combo plates, chile rellenos. All locations closed 2017 after 61 years. A piece of Phoenix Mexican food culture that the chains never replaced.' },

  { name:'Hardee\'s (Burger Chef)', cat:'burger', founded:1954, closed:1996, tagline:'The chain McDonald\'s absorbed.',
    eras:{ 1950:'Frank Thomas opens the first Burger Chef in Indianapolis in 1954. Creates a Flame Broiler and automated kitchen system designed to speed up production -- one of the first assembly-line burger kitchens.', 1960:'Goes public 1961. By the late 1960s had 1,000 locations making it the second largest burger chain in America behind McDonald\'s.', 1970:'General Foods acquires 1968. Pillsbury (owner of Burger King) considers acquiring but doesn\'t.', 1980:'Imasco (Hardee\'s parent) acquires Burger Chef from General Foods for $40M in 1981. Over the next decade all Burger Chef locations are rebranded as Hardee\'s.', 1990:'Last Burger Chef location converted 1996.' },
    desc:'Indianapolis Indiana. The burger chain that almost beat McDonald\'s. 1,000 locations by 1968 -- America\'s number two burger chain. General Foods acquires 1968, mismanages it, sells to Hardee\'s parent Imasco 1981 for $40M. Converted to Hardee\'s over the next 15 years. One of the great what-ifs of American fast food.' },

  { name:'Raising Cane\'s NYC',   cat:'chicken', founded:2024, closed:null, tagline:'Cane\'s hits New York.',

    eras:{ 1920:'Howard Deering Johnson borrows $500 and takes over a failing drugstore in Quincy MA in 1925, later 1929. Develops 28 ice cream flavors. First franchise deal 1935 -- one of the earliest franchise agreements in American history.', 1950:'The definitive American highway restaurant. Orange-roofed roadside diners dot every major US highway by the late 1950s. Peak of 770 locations in 1965. Bigger than McDonald\'s at that moment.', 1970:'McDonald\'s and the interstate highway system reroute traffic away from HoJo\'s traditional roadside locations. Sales collapse through the 1970s and 1980s.', 2020:'The very last Howard Johnson\'s -- in Lake George NY -- closes in 2022, ending 93 years of continuous operation. Its closing is international news.' },

  { name:'Stuckey\'s',             cat:'diner', founded:1937, closed:1985, tagline:'Pecan logs and roadside candy.',
    origin:{ city:'Eastman', state:'GA' },
    eras:{ 1930:'W.S. Stuckey Sr. borrows $35 and buys a truckload of pecans to sell roadside in Eastman GA during the Depression. Expands into candy, souvenirs, and restrooms.', 1960:'Over 350 locations on major US highways. The pecan log roll is the signature product.', 1980:'Sold to Pet Inc. 1964. Interstate highways bypass original locations. Chapter 11 1983. Closed 1985. Brand later revived as a travel plaza concept.' },
    desc:'W.S. Stuckey Sr. Georgia Depression-era roadside candy stand becomes a 350-location highway institution. Pecan log rolls. Turquoise roofs. Another victim of the interstate highway bypass era.' },

  { name:'Sambo\'s',               cat:'diner', founded:1957, closed:1982, tagline:'The pancake house that named itself poorly.',
    origin:{ city:'Santa Barbara', state:'CA' },
    eras:{ 1950:'Sam Battistone and Newell Bohnett open in Santa Barbara 1957. Name is a portmanteau of their names (SAM and BOhnett) but also the title of the children\'s book Little Black Sambo. By 1979 there are 1,117 locations -- one of the largest restaurant chains in America.', 1970:'NAACP and civil rights groups campaign against the name throughout the 1970s as explicitly racist. Franchisees change names to various alternatives to avoid boycotts.', 1980:'Mounting boycotts, management disputes, and the recession collapse the chain. Bankruptcy 1981. Nearly all locations close by 1982. One original location survives in Santa Barbara to this day, renamed "The Original Sambo\'s."' },
    desc:'Santa Barbara 1957. Sam Battistone + Newell Bohnett portmanteau of their names. 1,117 locations at peak in 1979. The name also references Little Black Sambo. NAACP boycotts through the 1970s. Bankruptcy 1981. One original location survives in Santa Barbara.' },

  { name:'Rax Roast Beef',         cat:'diner', founded:1967, closed:1998, tagline:'The Arby\'s almost-was.',
    origin:{ city:'Findlay', state:'OH' },
    eras:{ 1960:'General Mills invests in a roast beef chain concept. Competes directly with Arby\'s through the 1970s and early 1980s.', 1980:'Rebrands as Rax and introduces a radically different fast casual concept: full salad bar, baked potatoes, pasta -- years ahead of its time. Confuses customers. Sales collapse. Down from 500 locations to near zero by the late 1990s.', 1990:'A handful of locations survive in Ohio into the 2010s as holdouts. Rax is remembered as the chain that tried to invent fast casual 20 years too early.' },
    desc:'General Mills-backed roast beef chain that competed with Arby\'s. Tried to invent fast casual with salad bars and baked potatoes in the early 1980s -- too early for the market. Went from 500 locations to near zero by 1998. A cult favorite among QSR historians.' },

  { name:'Minnie Pearl\'s Chicken', cat:'chicken', founded:1968, closed:1974, tagline:'The franchise bubble that burst.',
    origin:{ city:'Nashville', state:'TN' },
    eras:{ 1960:'John Jay Hooker Jr. licenses the name of country music star Minnie Pearl for a fried chicken franchise chain. Raises $25M through a stock offering in 1968 at $20/share. Speculative restaurant franchise bubble -- stock hits $68 before collapsing.', 1970:'Chain never reaches meaningful scale. The franchise collapses by 1974, becoming one of the defining examples of the 1968-1970 "franchise bubble" that cost thousands of investors their savings. SEC investigates multiple chains from this era.' },
    desc:'John Jay Hooker licenses Minnie Pearl\'s name for a fried chicken chain in 1968. Raises $25M in a stock offering. Part of the infamous 1968-1970 franchise bubble where hundreds of celebrity-branded chains sold stock to speculators, collapsed, and wiped out investors. A cautionary tale taught in business schools.' },

  { name:'Red Barn',               cat:'burger', founded:1961, closed:1988, tagline:'When the hungries hit.',
    origin:{ city:'Springfield', state:'OH' },
    eras:{ 1960:'Opens in Springfield OH 1961. The actual buildings are shaped like red barns -- one of the most distinctive building designs in fast food history. Competes with McDonald\'s and Burger King on burgers and chicken.', 1970:'Acquired by Servomation in 1969. Over 400 locations at peak. "When the hungries hit, hit the Red Barn" jingle runs nationally.', 1980:'Servomation sold to Imasco (Hardee\'s parent) 1979. Locations converted to Hardee\'s or closed. Last Red Barn closes 1988.' },
    desc:'Springfield Ohio. Buildings shaped like actual red barns. "When the hungries hit, hit the Red Barn." Over 400 locations at peak. Acquired by Servomation 1969, sold to Hardee\'s parent Imasco 1979, locations converted or closed by 1988. The red barn buildings are now collector-documented landmarks -- some survive repurposed as other businesses.' },

  { name:'Biff Burger',            cat:'burger', founded:1956, closed:1990, tagline:'Florida burger chain, coal-broiled.',
    origin:{ city:'St. Petersburg', state:'FL' },
    eras:{ 1950:'Louis Schweitzer opens Biff Burger in St. Petersburg FL 1956. Coal-broiled burgers -- a heat-lamp-free chain. Expands along the Southeast coast through the 1960s.', 1970:'~70 locations at peak in the Southeast US.', 1980:'Competition from McDonald\'s and Burger King erodes market share through the 1980s. Last locations close ~1990.' },
    desc:'St. Petersburg Florida. Coal-broiled burgers served fresh. One of many regional burger chains that briefly competed with McDonald\'s in the Southeast in the 1960s before being overwhelmed. ~70 locations at peak.' },

  { name:'Gino\'s Hamburgers',     cat:'burger', founded:1957, closed:1982, tagline:'Baltimore-based burger chain.',
    origin:{ city:'Baltimore', state:'MD' },
    eras:{ 1950:'Founded by Baltimore Colts football player Gino Marchetti and teammates 1957. 300+ Mid-Atlantic locations at peak. Early partnership with Kentucky Fried Chicken gave many locations a dual concept.', 1970:'Pillsbury (Burger King parent) acquires Gino\'s 1982 and converts all locations to Burger King. The Gino\'s / KFC dual-concept locations become the footprint for BK\'s Mid-Atlantic expansion.' },
    desc:'Baltimore Colts defensive end Gino Marchetti founds this Mid-Atlantic burger chain in 1957. 300+ locations. Many co-branded with KFC. Pillsbury acquires and converts all to Burger King in 1982 -- one of the most significant single-event expansions in BK history.' },

  { name:'White Tower',            cat:'burger', founded:1926, closed:2004, tagline:'The original White Castle knockoff.',
    origin:{ city:'Milwaukee', state:'WI' },
    eras:{ 1920:'John E. Saxe opens White Tower in Milwaukee 1926, deliberately copying the White Castle model -- white porcelain tiles, towers, small square burgers. White Castle sues and wins the right to use the look, but White Tower continues.', 1950:'Primarily a Northeast US chain -- New York, Connecticut, Pennsylvania, Massachusetts. Never reached the Midwest dominance of White Castle.', 1980:'Slow decline through the 1980s and 1990s. Last locations close in 2004.' },
    desc:'Milwaukee 1926. A deliberate White Castle knockoff that was successfully sued for copying the look, then allowed to continue under a modified design. A Northeast US chain that lasted until 2004.' },

  { name:'Wetson\'s',              cat:'burger', founded:1959, closed:1975, tagline:'New York\'s McDonald\'s.',
    origin:{ city:'Syosset', state:'NY' },
    eras:{ 1950:'Herbert Wetson opens a hamburger stand on Long Island NY in 1959. Grows to 50+ locations across New York, New Jersey, and Connecticut by the mid-1960s. A direct McDonald\'s competitor in the NYC metro.', 1960:'McDonald\'s and Burger King enter the NYC market in force. Wetson\'s unable to compete nationally. Sells locations to Burger King 1975 -- one of the key deals that gave BK a strong NYC foothold.' },
    desc:'Long Island New York. Herbert Wetson\'s hamburger chain that dominated the NYC metro before McDonald\'s arrived. ~50 locations. Sold to Burger King 1975, directly funding BK\'s Northeast expansion.' },

  { name:'Carrols',                cat:'burger', founded:1960, closed:1976, tagline:'The Burger King prototype.',
    origin:{ city:'Syracuse', state:'NY' },
    eras:{ 1960:'Daniel Paster opens Carrols in Syracuse NY 1960. Grows to 300+ locations in the Northeast and Midwest. Becomes the largest Burger King franchisee in the country by the mid-1970s.', 1976:'Carrols as an independent brand ceases when all locations convert to Burger King 1976. The Carrols Restaurant Group continues to exist as a major BK franchisee -- today one of the largest in the country.' },
    desc:'Syracuse New York. Grew to 300+ locations before converting entirely to Burger King 1976. Carrols Restaurant Group survives to this day as one of the largest BK franchise operators -- they still operate ~1,000 Burger Kings.' },

  { name:'Kenny Rogers Roasters',  cat:'chicken', founded:1991, closed:2011, tagline:'Celebrity chicken, Malaysia survivor.',
    origin:{ city:'Ft. Lauderdale', state:'FL' },
    eras:{ 1990:'Country music legend Kenny Rogers and former KFC owner John Y. Brown Jr. open the first Kenny Rogers Roasters in Ft. Lauderdale 1991. Wood-roasted rotisserie chicken, fresh sides.', 1990:'A Seinfeld episode (1996) mocks the Roasters sign blocking the light from Jerry\'s apartment -- free advertising watched by millions.', 2000:'Franchising deals in Asia save the brand after US closures. The chain survives in Malaysia and China where it becomes extremely popular. ~180 Asia-Pacific locations as of 2010.', 2011:'US and Canada operations wind down. The brand lives on in Malaysia under Berjaya Corp, which had acquired the rights. One of the only American fast food chains to have a larger footprint in Southeast Asia than in its home market.' },
    desc:'Kenny Rogers and John Y. Brown Jr. (the man who sold KFC to Heublein). Rotisserie chicken. A Seinfeld episode makes them accidentally famous. US locations mostly close. The brand survives and thrives in Malaysia under Berjaya Corp -- more popular there than it ever was in America.' },

  { name:'Arby\'s (Roy Rogers)',   cat:'diner', founded:1968, closed:1990, tagline:'Roy Rogers cowboy chicken.',

  { name:'Zantigo',                cat:'mexican', founded:1969, closed:1986, tagline:'Midwest Mexican before Taco Bell arrived.',

    eras:{ 1960:'Sam Erickson opens Zantigo Mexican Restaurants in Minneapolis 1969. Introduces Tex-Mex fast food to the upper Midwest -- a region Taco Bell had not yet reached.', 1980:'Grows to 100+ Midwest locations. Yum! Brands (then PepsiCo) acquires Zantigo 1975 as a hedge against regional Taco Bell competition. Eventually PepsiCo converts most locations to Taco Bell as that brand reaches the Midwest.', 1986:'Last Zantigo converts or closes. A handful of independently owned Zantigo locations survive in the Twin Cities to this day, maintained by franchise holdouts.' },

  { name:'Chi-Chi\'s',             cat:'mexican', founded:1975, closed:2004, tagline:'Suburban Mexican dining, tragic end.',
    origin:{ city:'Louisville', state:'KY' },
    eras:{ 1970:'Marno McDermott and Max McGee open Chi-Chi\'s in Louisville KY 1975. Sit-down Mexican casual dining -- margaritas, chimichangas, fried ice cream. Named after McDermott\'s wife\'s nickname.', 1980:'Rapid national expansion. Over 200 locations at peak. One of the first national Mexican sit-down casual dining chains.', 2003:'A Hepatitis A outbreak at the Beaver PA location in October 2003 infects 660 people and kills 4 -- the largest Hepatitis A outbreak in US food service history. Chi-Chi\'s files bankruptcy Nov 2003.', 2004:'All Chi-Chi\'s locations in the US close by 2004. The Chi-Chi\'s name survives as a grocery store salsa brand. Locations in Belgium and Luxembourg continue operating.' },
    desc:'Louisville Kentucky. Sit-down Mexican with margaritas and fried ice cream. Over 200 locations at peak. A 2003 Hepatitis A outbreak in Beaver PA infects 660 people and kills 4 -- the worst foodborne illness event in US restaurant history. Bankruptcy filed Nov 2003. All US locations closed by 2004. The salsa brand survives in grocery stores.' },

  { name:'Quincy\'s Family Steakhouse', cat:'diner', founded:1974, closed:2001, tagline:'Southeastern steakhouse chain.',
    origin:{ city:'Spartanburg', state:'SC' },
    eras:{ 1970:'Opens in Spartanburg SC 1974. Family-style steakhouse and yeast rolls -- a Blue-collar sit-down option across the Southeast.', 1990:'Over 200 locations at peak, primarily in the Carolinas, Georgia, Virginia, and Tennessee.', 1990:'Acquired by Flagstar Companies (Denny\'s parent) 1988. Financial troubles cascade from the Denny\'s discrimination lawsuit and settlements. All locations close or convert by 2001.' },
    desc:'Spartanburg South Carolina. Southeast family steakhouse with legendary yeast rolls. ~200 locations. Acquired by Flagstar/Denny\'s parent 1988. Flagstar\'s financial collapse from the Denny\'s discrimination settlement takes Quincy\'s down with it. All closed by 2001.' },

  { name:'Steak \'n Ale',          cat:'diner', founded:1966, closed:2008, tagline:'Norman Brinker\'s first success.',
    origin:{ city:'Dallas', state:'TX' },
    eras:{ 1960:'Norman Brinker -- the man who later creates Chili\'s, inspires the entire casual dining category, and nearly dies in a 1993 polo accident -- opens the first Steak \'n Ale in Dallas 1966. The format: affordable steaks, salad bar, English pub decor.', 1970:'Pillsbury acquires 1971. Brinker leaves. The chain peaks at ~300 locations.', 1990:'Sold by Pillsbury to Metromedia 1982. Competitors like Chili\'s (Brinker\'s own company) and Applebee\'s eat its market share. Chapter 11 2008. All locations close.' },
    desc:'Norman Brinker, Dallas 1966. The first Steak \'n Ale is the origin of the entire American casual dining category. Brinker invented the salad bar, the open kitchen, and the idea of affordable but non-fast-food eating. He goes on to build Chili\'s into the dominant chain -- while Steak \'n Ale rots under Pillsbury/Metromedia. All locations close in 2008 Chapter 11.' },

  { name:'Lum\'s',                 cat:'diner', founded:1956, closed:1983, tagline:'Beer-steamed hot dogs, Caesars Palace.',

    desc:'Miami Beach Florida. Beer-steamed hot dogs. Used burger profits to buy Caesars Palace Las Vegas in 1969. Bankrupt 1982. One of the great what-is-your-core-business cautionary tales in American business.' },

  // ---- FOOD TRUCK / MOBILE ----
  // The food truck category tracks the mobile food movement as a distinct business format.
  // Modern US food trucks emerged from the taco truck tradition of LA and the Southwest,
  // and were legitimized as a prestige format by the 2008 recession and Kogi BBQ's Twitter-
  // based location sharing model, which changed the economics of mobile food permanently.

  { name:'Food Truck Era (origin)', cat:'food-truck', founded:1974, closed:null, tagline:'Mobile food as a format.',
    eras:{ 1970:'Roy Choi notes that taco trucks -- loncheras -- have operated in Los Angeles and the Southwest US since the early 1970s, serving construction workers and laborers. They are the true origin of modern food trucks, predating the "gourmet" truck movement by 35 years.', 1980:'Hot dog carts and street food vendors proliferate in NYC and other dense urban markets.', 2000:'The 2008 financial crisis forces laid-off chefs and restaurant workers to seek low-overhead food business models. The food truck becomes the affordable entry into the food business.', 2008:'Kogi BBQ (Roy Choi, Los Angeles, Nov 2008) uses Twitter to announce truck locations in real time. 800+ Twitter followers on day one. Lines around the block. The modern gourmet food truck is born. Food Network covers it. The format goes national.', 2010:'Food truck festivals, food truck parks, and city regulations defining truck zones emerge across the US. Hundreds of regional truck brands launch.', 2020:'The COVID-19 pandemic paradoxically benefits food trucks -- outdoor, pre-packaged, and mobile works when indoor dining is closed. Ghost kitchens and food halls absorb former truck operators.' },
    desc:'The food truck as a legitimate business format. Taco truck loncheras in LA from the early 1970s are the true origin. Kogi BBQ\'s Twitter location model in 2008 creates the gourmet food truck movement. The 2008 recession makes the low-overhead mobile format attractive to displaced restaurant workers. City regulations, food truck parks, and TV coverage legitimize it as a restaurant category.' },

  { name:'Kogi BBQ',              cat:'food-truck', founded:2008, closed:null, tagline:'The truck that started it all.',
    origin:{ city:'Los Angeles', state:'CA' },
    hq:[{ city:'Los Angeles', state:'CA', from:2008, to:2026 }],
    leadership:{ ceo:'Roy Choi', founder:'Roy Choi + Mark Manguera + Caroline Shin', notes:'Choi (CIA-trained, Korean-American chef from LA) is considered the godfather of the modern food truck movement. Also opened Chego, POT, A-Frame. Consulted on the movie Chef (2014). ~4 trucks as of 2025.' },
    eras:{ 2000:'Roy Choi is laid off from a hotel kitchen in 2008 during the financial crisis. Mark Manguera pitches a Korean BBQ taco truck concept. First Kogi truck launches Nov 2008 in Los Angeles. Uses Twitter to announce location in real time. 800 followers on launch day. Lines of 300+ people for a taco.', 2010:'Food Network and every major US food publication covers Kogi. The format goes national. Time Magazine names Roy Choi one of the 100 most influential people in 2010. The term "gourmet food truck" enters the vocabulary.', 2020:'Kogi remains a Los Angeles institution. ~4 trucks. Roy Choi becomes a food justice advocate -- opens Locol (low-cost healthy food in food deserts) in 2016 as a separate venture.' },
    desc:'Roy Choi, Los Angeles, November 2008. Korean BBQ short rib tacos from a Twitter-located truck. 800 followers on day one. Lines around the block. The Food Network shows up. Time Magazine names Choi one of the 100 most influential people on Earth. The gourmet food truck movement begins here.' },

    eras:{ 1970:'Ben Cohen and Jerry Greenfield take a $5 correspondence course in ice cream making from Penn State. Open their first scoop shop in a renovated gas station in Burlington VT May 5 1978. Ben\'s inability to smell means flavors must have big texture -- thus the legendary chunk-heavy style.', 1980:'Cherry Garcia (named for Jerry Garcia, Grateful Dead) and Chunky Monkey launch and become cult products. The company becomes as known for activism as ice cream.', 1990:'Goes public 1984. Sells to Unilever 2000 for $326M after resisting for years. Kept an unusual independent social mission board as a condition of the sale.', 2020:'Ongoing legal dispute between the independent board (which voted to stop Israel-occupied territory sales 2021) and Unilever (which overrode them). Ben & Jerry\'s sues Unilever 2023 for violating the acquisition agreement. The ice cream brand as an active geopolitical participant is unique in QSR history.' },

  { name:'Steak \'n Shake COVID closures', cat:'diner', founded:2020, closed:null, tagline:'51 locations never reopened.',

    desc:'Brio Italian Mediterranean + Bravo Fresh Italian under FoodFirst Global Restaurants. 92 combined locations. Chapter 11 April 2020. Robert Earl buys 45 for $50,000 cash -- a remarkable distressed asset deal. 47 locations close permanently. The surviving 45 continue under Earl\'s management.' },

    eras:{ 1970:'Mike McMenamin buys Produce Row Cafe in Portland 1974 with two college friends. Sells it and Bogart\'s Joint by 1980. Opens wine distributorship. It fails.', 1980:'Mike buys the Fat Little Rooster tavern on SE Hawthorne 1983, renames it the Barley Mill Pub. Brian joins. They lobby the Oregon legislature with Portland Brewing, BridgePort Brewing, and Widmer Brothers to legalize on-premises beer sales. Gov. Vic Atiyeh signs the Brewpub Bill into law July 13 1985. McMenamins opens Hillsdale Brewery and Public House Oct 31 1985 -- Oregon\'s first brewpub since Prohibition.', 1987:'Mission Theater and Pub opens 1987 -- Oregon\'s first theater pub. The McMenamins formula emerges: buy a historic building other developers would demolish, rehabilitate it, cover every surface in murals by local artists, install a brewery, and open it as a community gathering place.', 1990:'Kennedy School (a former Portland elementary school) opens. Cornelius Pass Roadhouse (a 125-year-old farmhouse). Edgefield (a former county poor farm). The pattern: the weirder and more historically layered the building, the better the McMenamins.', 2020:'COVID is devastating -- McMenamins lays off 3,000 of 3,500 employees in 2020. Survives. Remains family-owned. 60+ properties as of 2025, including 12 hotels, 27 breweries, multiple movie theaters, spas, music venues, a coffee roaster, winery, cidery, and distillery. ~20 properties on the National Register of Historic Places.' },
    desc:'Mike and Brian McMenamin, Portland Oregon, 1983. Buy the Fat Little Rooster tavern. Lobby the state legislature to legalize brewpubs. Open Oregon\'s first post-Prohibition brewpub in 1985. Then spend the next four decades finding the most interesting historic buildings in the Pacific Northwest -- schoolhouses, farms, poorhouses, theaters, churches -- and turning them into beer halls covered in murals. 60+ properties. 27 breweries. Never franchised outside the Pacific Northwest. Never sold. One of the most distinctive hospitality brands in the United States.' },

    desc:'Steve Herrell. Somerville Massachusetts 1973. Herrell invents the mix-in concept -- cookies and candy bars smooshed into ice cream on a marble slab. He sells the store, copies appear everywhere. Cold Stone Creamery and Marble Slab are both direct descendants. Herrell later opens Herrell\'s Ice Cream in Northampton MA. The Steve\'s brand now sells in grocery.' },

  { name:"Handel\'s Homemade",     cat:'frozen', founded:1945, closed:null, tagline:'Youngstown Ohio institution.',
    origin:{ city:'Youngstown', state:'OH' },
    desc:'Alice Handel. Youngstown Ohio 1945. Homemade high-butterfat ice cream, small-batch. ~100 locations in Ohio, Pennsylvania, Georgia, and Florida. A regional institution consistently rated among the top ice cream chains in America.' },

  { name:"Andy\'s Frozen Custard", cat:'frozen', founded:1986, closed:null, tagline:'Midwest frozen custard.',

  // ===== BOWL / GRAIN BOWL CATEGORY =====
  // Session 7 -- Orange requests: Café Yumm, rice bowl chains, Salad and Go
  // The bowl category covers: rice bowls, grain bowls, poke bowls, Mediterranean bowls,
  // salad-as-a-meal fast casual, and any chain where the primary product is a
  // composed bowl of grains + protein + vegetables + sauce at fast-casual speed.
  // This is the defining restaurant format of the 2010s-2020s.

  // ---- BOWL ORIGIN / ERA MARKER ----
  { name:'Bowl Era (origin)',      cat:'bowl', founded:2003, closed:null, tagline:'Chipotle creates the bowl format.',
    eras:{ 2000:'Chipotle notices customers unwrapping their burritos and eating them with a fork. Launches the Chipotle Bowl in 2003 -- the same ingredients as a burrito, no tortilla. The burrito bowl is the product that turns Chipotle into the dominant fast casual chain of the 2000s-2010s and directly creates the bowl category.', 2010:'Every major fast casual chain launches a bowl option. Sweetgreen, CAVA, Poke concepts, grain bowl concepts -- all trace directly to the 2003 Chipotle Bowl. The bowl becomes the defining American fast food format of the decade.', 2020:'The "bowl" as a restaurant category -- grain bowls, rice bowls, poke bowls, Mediterranean bowls, salad bowls -- is worth billions in annual revenue and has its own sub-segments, brands, and consumer tribes.' },
    desc:'Chipotle launches the Chipotle Bowl in 2003 after noticing customers unwrapping their burritos and eating with a fork. This single product decision creates the bowl category. Every grain bowl, poke bowl, Mediterranean bowl, and salad bowl chain of the 2010s and 2020s traces back to this moment.' },

  // ---- PACIFIC NORTHWEST BOWL ----
  { name:"Café Yumm!",             cat:'bowl', founded:1997, closed:null, tagline:'Eugene Oregon rice and beans bowl.',
    origin:{ city:'Eugene', state:'OR' },
    hq:[{ city:'Eugene', state:'OR', from:1997, to:2026 }],
    leadership:{ ceo:'Mark Beauchamp', founder:'Mary Ann & Mark Beauchamp', notes:'Mary Ann is the culinary creator. Mark handles operations. Family-owned and operated. ~20 locations in OR and WA. Oregon\'s first Benefit Company (2014). First LEED Gold certified restaurant in Oregon (2011 Portland location). First solar-powered EV charging station at a restaurant (Eugene).' },
    franchises:[
      { year:2007, count:6 },
      { year:2013, count:15 },
      { year:2019, count:23 },
      { year:2024, count:20 },
    ],
    ownership:[
      { owner:'Mary Ann & Mark Beauchamp (private)', from:1997, to:2026, color:'#6b8e23' },
    ],
    stateExpansion:[
      { state:'OR', year:1997, notes:'First Café Yumm! opens in downtown Eugene 1997 in the former juice bar space. Expands to 6 Eugene locations before franchising begins.' },
      { state:'WA', year:2013, notes:'First location outside Oregon opens at 7th & Pine in downtown Seattle Oct 25 2013. Seattle franchise closes Nov 2023 after 10 years. Vancouver WA locations continue.' },
      { state:'ID', year:2019, notes:'Eagle Idaho location opens 2019 as part of three-store expansion plan.' },
    ],
    eras:{ 1990:'Mary Ann Beauchamp, a vegetarian chef with a Japanese mother (rice) and Kentuckian father (beans), is serving Yumm! Bowls off-menu at her Wild Rose Café & Deli in Eugene. Customers keep asking for them. She and husband Mark convert the adjacent juice bar into the first Café Yumm! in 1997.', 1997:'The Yumm! Bowl: organic brown rice + black beans + Yumm! Sauce (garbanzo beans, almonds, lemon, basil, garlic, nutritional yeast -- sugar-free, dairy-free, gluten-free, vegan) + salsa + toppings. The sauce is the product. It goes into 110 Pacific Northwest grocery stores and ships nationally.', 2007:'Franchising begins 2007. First Café Yumm! outside Eugene opens in Bend OR Dec 2007.', 2011:'Portland location opens 2011 -- first LEED Gold certified restaurant in Oregon. Same year: first solar-powered EV charging station at any restaurant in the US (Eugene On Broadway location, 172 solar panels, 6 charging stations).', 2014:'Becomes Oregon\'s first Benefit Company (B Corp legal status) Jan 2 2014.', 2020:'~20 locations in Oregon, Washington, and Idaho as of 2024. Sauce sold in grocery stores and by mail order. A Pacific Northwest institution.' },
    desc:'Mary Ann and Mark Beauchamp. Eugene Oregon 1997. The Yumm! Bowl: rice, beans, Yumm! Sauce. Mary Ann\'s mother was Japanese (rice), her father was from Kentucky (beans) -- she discovered they form a complete protein together. The sauce is garbanzo beans, almonds, lemon, basil, garlic, nutritional yeast. First LEED Gold restaurant in Oregon. First solar-powered EV charging station at any restaurant in the US. Oregon\'s first Benefit Company. ~20 locations. The Pacific Northwest bowl chain before bowl was a category.' },

    eras:{ 2010:'Hawaiian poke -- marinated raw fish traditionally sold by the pound at fish counters -- begins appearing as fast casual "poke bowls" on the US mainland around 2012-2014. The format: choose base (rice, salad, or mixed), choose protein (ahi, salmon, octopus, tofu), choose sauce, add mix-ins and toppings. Chipotle-for-sushi.', 2015:'Pokeworks opens its first location in 2015. Lines out the door. Viral social media from the bowl\'s visual appeal -- the bowl is photographed as often as it is eaten. "Poke Your Way" customization system.', 2020:'~180 locations across North America. Adds Hawaiian Hot Plates in 2025 -- a pivot toward warm bowls beyond raw fish.' },
    desc:'Mike Wu and Chris Birkinshaw. Vancouver BC 2015. Customizable poke bowls -- Hawaiian raw fish tradition turned into a Chipotle-format fast casual. The visual appeal of the bowl drives social media. "Poke Your Way." ~180 US and Canadian locations. The largest poke chain in North America.' },

  { name:'Poke Bowl Era (origin)', cat:'bowl', founded:2012, closed:null, tagline:'Hawaiian fish salad goes mainland.',
    eras:{ 2010:'Poke (pronounced POH-kay) is a Hawaiian fish salad traditionally sold at fish counters and supermarkets by the pound. In Hawaii it is eaten as a snack, potluck dish, or light meal -- not a restaurant category. Mainland chefs begin serving it over rice in restaurant formats around 2012 in Los Angeles, New York, and San Francisco.', 2014:'The poke bowl becomes a social media phenomenon -- colorful, photogenic, and positioned as a health-forward alternative to sushi. Chains proliferate rapidly: Pokeworks, Ahi Poké, Poke to the Max, Sweetfin, and dozens of regional brands.', 2020:'The poke bowl is a permanent fixture of American fast casual. The format\'s visual appeal (bright colors, visible ingredients, customizable assembly) makes it uniquely suited to the Instagram era.' },

  // ===== RESTAURANT-ADJACENT INFRASTRUCTURE =====
  // The technology, payment, and supply systems that enabled modern restaurants
  // to exist at all. Diners Club is the foundational one -- the restaurant industry
  // as we know it could not have scaled without the credit card payment infrastructure
  // that Diners Club created in 1950.

  { name:'Diners Club',            cat:'adjacent', founded:1950, closed:null, tagline:'The card that invented the modern restaurant.',
    origin:{ city:'New York', state:'NY' },
    hq:[

    ],
    leadership:{ ceo:'Discover Financial Services', founder:'Frank McNamara + Ralph Schneider + Matty Simmons', notes:'McNamara conceives the idea after forgetting his wallet at Major\'s Cabin Grill in NYC 1949. The "First Supper" is February 8 1950 at Major\'s Cabin Grill with 14 NYC restaurants accepting the card. Citigroup acquired 1981. Discover Financial Services acquired the North American franchise 2008. Diners Club International continues globally under BMO Financial Group.' },
    franchises:[
      { year:1950, count:14 },
      { year:1951, count:330 },
      { year:1955, count:9000 },

    ownership:[
      { owner:'McNamara + Schneider + Simmons',  from:1950, to:1981, color:'#8a5a2a' },
      { owner:'Citigroup',                       from:1981, to:2008, color:'#3a6e8f' },
      { owner:'Discover Financial Services',     from:2008, to:2024, color:'#d4a017' },
      { owner:'Capital One (via Discover)',      from:2024, to:2026, color:'#c8340a' },
    ],
    eras:{ 1940:'Frank McNamara, a New York businessman, dines at Major\'s Cabin Grill near the Empire State Building in late 1949 and discovers he\'s left his wallet at home. His wife brings cash to pay the bill. The embarrassment becomes the founding story. McNamara conceives a card that could be used at multiple restaurants -- a single payment method accepted across many establishments.', 1950:'McNamara, his attorney Ralph Schneider, and Matty Simmons launch Diners Club February 8 1950. The "First Supper" takes place at Major\'s Cabin Grill -- McNamara pays for the meal with the first card. 200 cardholders, mostly friends and business associates, plus 14 NYC restaurants accept it. By year end: 35,000 members, 330 restaurants, hotels, and travel businesses. Annual fee $5. Merchant discount 7% (versus modern 2-3%).', 1955:'9,000 establishments worldwide accept Diners Club. The card is the first widely accepted multi-merchant charge card in history -- predates American Express (1958) by 8 years and BankAmericard (later Visa, 1958) by 8 years. The very category of "credit card" descends from Diners Club\'s 1950 launch.', 1960:'Diners Club International expands globally. Card becomes synonymous with business travel and corporate dining. The expense account itself -- a major restaurant industry revenue category -- exists because Diners Club made it possible to track and reimburse meals.', 1965:'Plastic cards replace the original cardboard-stock cards 1961. Magnetic stripe added 1969.', 1970:'Visa and Mastercard surpass Diners Club in cardholder count through the 1970s as bank cards become dominant. Diners Club focuses on the premium business travel segment.', 1980:'Citigroup acquires Diners Club 1981 for $200M. Becomes Citigroup\'s upscale charge card brand alongside (and competing with) American Express.', 2008:'Discover Financial Services acquires the North American Diners Club franchise from Citigroup for $165M April 2008. Diners Club International (the global business) continues separately and is acquired by BMO Financial Group of Canada.', 2024:'Capital One announces $35B acquisition of Discover Financial Services Feb 2024, completed 2025. Diners Club becomes part of Capital One\'s payment network portfolio. ~8M global cardholders. The original card that started everything is now a niche premium product, but every modern credit card payment at a restaurant traces directly to Major\'s Cabin Grill February 8 1950.' },
    desc:'Frank McNamara forgets his wallet at Major\'s Cabin Grill in NYC in late 1949. His wife pays the bill. He conceives Diners Club. February 8 1950 -- the "First Supper" -- 14 NYC restaurants accept the card. The first multi-merchant charge card in history. Predates American Express by 8 years. The very category of "credit card at a restaurant" descends from this single founding moment. Citigroup acquires 1981. Discover acquires North American operations 2008. Capital One acquires Discover 2024-2025. ~8M global cardholders today. Every restaurant POS terminal in America descends from the cardboard cards used at Major\'s Cabin Grill in 1950.' },

  { name:'Major\'s Cabin Grill (note)', cat:'origin', founded:1949, closed:null, tagline:'The restaurant where Diners Club was born.',
    origin:{ city:'New York', state:'NY' },
    desc:'Steakhouse near the Empire State Building in midtown Manhattan. Site of two events that defined the modern restaurant industry: (1) late 1949 -- Frank McNamara forgets his wallet here and conceives Diners Club, and (2) February 8 1950 -- the "First Supper," where McNamara pays for dinner with the first Diners Club card, making it the first restaurant in history to accept a credit card payment. The restaurant itself was unremarkable -- a typical 1940s midtown steakhouse. The location closed sometime in the 1970s and the building has been redeveloped. The site at 33 W 33rd Street is a piece of restaurant history that almost no one visits. Every credit card transaction at every restaurant in the world for the past 75 years descends from this address.' },

  { name:"Pal\'s Sudden Service",  cat:'burger', founded:1956, closed:null, tagline:'Triple 100. The most studied QSR in America.',
    origin:{ city:'Kingsport', state:'TN' },
    hq:[{ city:'Kingsport', state:'TN', from:1956, to:2026 }],
    leadership:{ ceo:'Thom Crosby', chair:'Adam Crosby (President & COO)', founder:'Fred "Pal" Barger', notes:'Thom Crosby joined 1981, became CEO 1999/2001. Prior: corporate McDonald\'s, corporate Long John Silver\'s, Wendy\'s franchisee. Personally interviews every owner-operator candidate 12-22 times. Adam Crosby (next generation) is President & COO. Owner-operator model -- not franchised. Pal Barger died Oct 29 2020 at age 90.' },
