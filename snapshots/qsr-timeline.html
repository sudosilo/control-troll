    ],
    stateExpansion:[
      { state:'TN', year:1956, notes:'Pal\'s #1 opens on Revere Street in Kingsport TN 1956 -- "Burgers, Shakes, 19 Cents." Fred "Pal" Barger had attended the 1955 National Restaurant Convention in Chicago and met Ray Kroc and Fred Turner, touring the first McDonald\'s equipment. Pal\'s is built directly on that template but localized for East Tennessee.' },
      { state:'VA', year:2020, notes:'Abingdon VA location opens 2020 -- first Pal\'s outside Tennessee. Marks expansion into southwest Virginia. The slow geographic growth is deliberate: the owner-operator model requires a fully trained operator (48-month pipeline) before any new store opens.' },
    ],
    eras:{ 1950:'Fred "Pal" Barger -- nicknamed as a toddler when he became the mascot of his father\'s city basketball team -- graduates from East Tennessee State University 1955 with a business degree. While serving in the U.S. Air Force in 1952 he sees a quick-service restaurant in Austin TX and the format sticks with him. Attends the 1955 National Restaurant Convention in Chicago, meets Ray Kroc and Fred Turner, tours the first McDonald\'s equipment. Opens Pal\'s #1 on Revere Street in Kingsport 1956.', 1960:'Pal\'s #2 opens 1962 on Lynn Garden Drive in Kingsport with the iconic 20-foot fiberglass Muffler Man out front. The deliberate visual identity of Pal\'s buildings begins here.', 1980:'Pal\'s #3 opens 1985 in Colonial Heights -- the first store with the Karen and Tony Barone-designed "step" architecture, featuring giant fiberglass food sculptures (a huge burger, fries, hot dog). Every subsequent location uses this signature visual language. Thom Crosby joins 1981 from McDonald\'s corporate and Long John Silver\'s.', 1990:'Crosby becomes CEO 1999. Begins systematic operational excellence transformation working with David McClaskey (Eastman Chemical Baldrige veteran from Kingsport). Pal\'s Business Excellence Institute founded 2000.', 2000:'Pal\'s wins the Tennessee Award for Performance Excellence 2001. Wins the Malcolm Baldrige National Quality Award 2001 (small-business category) -- the first restaurant company ever to win Baldrige. President George W. Bush presents the award to Pal Barger and Thom Crosby personally March 7 2002 at the White House. Wins Tennessee Award again 2006.', 2010:'Harvard Business School publishes "Pal\'s Sudden Service -- Scaling an Organizational Model to Drive Growth" (Pisano/Gino/Staats, case 916-052) May 2016. Bill Taylor\'s book Simply Brilliant (2016) features Pal\'s as a model. Inc. magazine names Pal\'s one of the 25 Most Audacious Companies 2014. Washington Post profiles by Jena McGregor Nov 2014.', 2020:'Pal Barger dies Oct 29 2020 at age 90. Pal\'s BEI spins out as independent McClaskey Excellence Institute Jan 1 2020. First store outside Tennessee opens in Abingdon VA 2020. 31 locations by year-end 2024 per Technomic. $2.67M AUV per ~1,100-sq-ft drive-thru-only building. ~1,300 employees. Adam Crosby (next generation) now President & COO.' },
    desc:'Fred "Pal" Barger. Kingsport Tennessee 1956. The most operationally excellent QSR in America. 31 drive-thru-only locations in TN and southwest VA. 18-second drive-thru cadence ("wheels stop to wheels go"). One mistake per 3,600 orders -- 10x more accurate than the nearest national competitor. 1.4% annual assistant manager turnover. 32% crew turnover (vs. industry 100%+). 143 inventory turns per year (vs. industry ~40). $30,000 customer LTV. 120 hours of training before solo work, plus daily randomized pop quizzes that can decertify employees on the spot. Every leader spends 10% of every day coaching one named employee on one specific skill. The Triple 100 standard: 100% execution, 100% of the time, even at 100% of capacity. First restaurant company ever to win the Malcolm Baldrige National Quality Award (2001). Presented to Pal Barger by President George W. Bush March 7 2002. Featured in HBS case 916-052, Bill Taylor\'s Simply Brilliant, Inc. magazine 25 Most Audacious Companies, Washington Post, QSR Magazine, Forbes. Deliberately rejects fads: no app, no loyalty program, no bundled meals, no speaker boxes, no credit cards. Pal Barger\'s famous one-liner on training in a high-turnover industry: "Suppose we don\'t [train] and then they stay?" Karen and Tony Barone-designed step buildings with giant fiberglass food sculptures. The 20-foot Muffler Man at Pal\'s #2 (1962) is a Kingsport landmark.' },

// =============================================================================
// YEAR-RESOLUTION HELPERS
// =============================================================================
// These resolve point-in-time data for views that are time-aware (snapshot,
// tooltip when called with contextYear, ownership-segmented radial spokes).
// All return null gracefully when the chain has no data for the requested
// metric or the year is out of bounds. Callers should handle null.
// =============================================================================

// Returns the headquarters entry active in a given year, or null if no hq
// data exists for this chain. If `year` is past the final hq period (e.g.,
// hq[].to was set to a transition year and the company hasn't moved since),
// returns the last entry rather than null -- handles "still based there"
// without requiring you to update the to=2026 every year.
//
// Used by:
//   - tooltip's tip-locations block (HQ row)
//   - snapshot card's HQ line
//   - future MAP view will use this to resolve which state to light up
function resolveHq(chain, year) {
  if (!chain.hq || !chain.hq.length) return null;
  for (const h of chain.hq) {
    if (year >= h.from && year < h.to) return h;
  }
  // year is past the last known hq period -- return the last entry
  return chain.hq[chain.hq.length - 1];
}

// Linear-interpolates franchise count between known data points. Franchise
// data in chains[].franchises is SPARSE -- typically 5-8 milestone points
// per brand, not annual figures. This function lets the UI smoothly resolve
// "approximately how many locations did Brand X have in 1985?" even if 1985
// isn't a recorded data point.
//
// Returns null if:
//   - chain has no franchise data
//   - year is before founded or after closed
//
// IMPORTANT: interpolated values are FAKE PRECISION. The franchiseDataAt()
// wrapper exposes a `reported` flag to distinguish real data points from
// interpolated ones, so the UI can mark them visually (● vs ~).
//
// If you add denser annual franchise data later (from 10-K filings etc.),
// this function still works correctly -- it just interpolates over shorter
// gaps.
function franchiseCountAt(chain, year) {
  if (!chain.franchises || !chain.franchises.length) return null;
  if (year < chain.founded || year > chain.end) return null;
  const pts = chain.franchises;
  if (year <= pts[0].year) return pts[0].count;
  if (year >= pts[pts.length - 1].year) return pts[pts.length - 1].count;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if (year >= a.year && year <= b.year) {
      const t = (year - a.year) / (b.year - a.year);
      return Math.round(a.count + t * (b.count - a.count));
    }
  }
  return null;
}

// Wrapper around franchiseCountAt that returns extra metadata for honest UI:
//   count:     interpolated count for `year`
//   reported:  true ONLY if `year` matches an exact data point in chain.franchises[]
//              -- snapshot cards mark these with ● (bold/colored) vs ~ (italic/dim)
//   prevCount: count for year-1 (also possibly interpolated)
//   delta:     count - prevCount, used for the YoY change pill on snapshot cards
//
// Returns null if no data exists at the queried year.
//
// Note: when `prevCount` itself is interpolated, the delta will be the slope of
// the interpolation -- constant across the gap between known points. This is
// expected and is exactly why we mark it visually as approximate.
function franchiseDataAt(chain, year) {
  const count = franchiseCountAt(chain, year);
  if (count == null) return null;
  const prevCount = franchiseCountAt(chain, year - 1);
  const reported = chain.franchises.some(p => p.year === year);
  const delta = prevCount != null ? count - prevCount : null;
  return { count, reported, prevCount, delta };
}

// Compact number formatter for display in tight spaces (bar labels, snapshot
// cards). 24500 -> '24.5K', 1200000 -> '1.2M'. Strips trailing '.0'.
function fmtCount(n) {
  if (n == null) return '';
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

// once and for all.

// =============================================================================
// TIMELINE VIEW + getSorted() MEMOIZATION
// =============================================================================
// getSorted() is the single source of truth for "which chains, in what order,
// matter right now." Used by TIMELINE; LIFESPAN/GRAVEYARD/SNAPSHOT each filter
// chains independently so they don't currently call this. Memoized because
// switching tabs back and forth shouldn't re-filter 143 chains every time.
//
// MUST CALL invalidateSortCache() WHEN:
//   - sortMode changes
//   - searchQuery changes
//   - activeFilters changes (any cat toggled)
// rerender() handles all three. If you wire new state into the sort/filter
// logic, also add it to getCacheKey() so the memoization recognizes when to
// invalidate.
// =============================================================================

function getSorted() {
  const key = getCacheKey();
  if (_sortedCache && _sortedKey === key) {
    searchCount.textContent = searchQuery ? _sortedCache.length + ' RESULTS' : '';
    return _sortedCache;
  }
  let arr = chains.filter(c => activeFilters.has(c.cat));
  if (searchQuery) {
    arr = arr.filter(c =>
      c.name.toLowerCase().includes(searchQuery) ||
      (c.desc && c.desc.toLowerCase().includes(searchQuery)) ||
      (c.tagline && c.tagline.toLowerCase().includes(searchQuery))
    );
  }
  searchCount.textContent = searchQuery ? arr.length + ' RESULTS' : '';
  if (sortMode === 'duration') arr.sort((a,b) => b.duration - a.duration || a.founded - b.founded);
  else if (sortMode === 'founded') arr.sort((a,b) => a.founded - b.founded);
  else if (sortMode === 'name') arr.sort((a,b) => a.name.localeCompare(b.name));
  else if (sortMode === 'cat') arr.sort((a,b) => a.cat.localeCompare(b.cat) || a.founded - b.founded);
  _sortedCache = arr;
  _sortedKey = key;
  return arr;
}

// world-coord helper: convert year value to x-pixel position on the timeline.
function yearToPx(y) { return (y - YEAR_START) * pxPerYear; }

// =============================================================================
// PERFORMANCE TRICK: GRID LINES AS CSS GRADIENT (don't undo this)
// =============================================================================
// The original code drew 30+ absolutely-positioned <div>s per row to render
// year tick lines. With 143 chains x 30 ticks = 4290 extra DOM nodes per
// timeline render. Killed scroll perf and made re-renders sluggish.
//
// This function builds a layered CSS repeating-linear-gradient that draws
// the same grid as a single background-image on each row's track. Two layers:
//   - thin lines every 5 years (subtle)
//   - bolder lines every 10 years (decade markers)
// Zero DOM nodes added. Re-rendered automatically when pxPerYear changes.
// =============================================================================
function buildGridBg() {
  const step = pxPerYear * 5;
  const decade = pxPerYear * 10;
  return (
    `repeating-linear-gradient(to right,#e8dfc8 0,#e8dfc8 1px,transparent 1px,transparent ${step}px),` +
    `repeating-linear-gradient(to right,rgba(200,176,128,0.35) 0,rgba(200,176,128,0.35) 1px,transparent 1px,transparent ${decade}px)`
  );
}

// memoization storage. _sortedCache is the last result; _sortedKey is what
// inputs produced it. invalidateSortCache() should be called after any state
// change that affects filter/sort outputs.
let _sortedCache = null, _sortedKey = '';
function getCacheKey() {
  return sortMode + '|' + searchQuery + '|' + [...activeFilters].sort().join(',');
}
function invalidateSortCache() { _sortedCache = null; _sortedKey = ''; }

// =============================================================================
// TIMELINE render() -- horizontal Gantt-style chart
// =============================================================================
// Builds the entire timeline DOM in a DocumentFragment, then commits it via
// chart.replaceChildren(frag) -- single layout pass per render, no incremental
// appendChild thrashing.
//
// For each chain in the sorted list:
//   - sticky-positioned label column on the left (chain name + years)
//   - track containing the colored bar (founded -> end of life)
//   - if chain has ownership[] data, a thinner ribbon below the bar showing
//     parent-company eras as connected colored segments with subtle transitions
//
// Grid background is the CSS gradient (see buildGridBg above). Bar labels
// include current location count in the format "1955  McDonald's  43.5K"
// when chain.franchises has data.
// =============================================================================
function render() {
  const sorted = getSorted();
  const chart = document.getElementById('chart');
  const totalPx = (YEAR_END - YEAR_START) * pxPerYear;
  const gridBg = buildGridBg();

  const frag = document.createDocumentFragment();

  // axis
  const axis = document.createElement('div');
  axis.id = 'axis-row';
  for (let y = YEAR_START; y <= YEAR_END; y++) {
    const tick = document.createElement('div');
    tick.className = 'year-tick' + (y % 10 === 0 ? ' decade' : '');
    tick.style.width = pxPerYear + 'px';
    if (y % 10 === 0) tick.textContent = y;
    axis.appendChild(tick);
  }
  frag.appendChild(axis);

  sorted.forEach(chain => {
    const color = cats[chain.cat]?.color || '#888';
    const hasRibbon = chain.ownership && chain.ownership.length > 0;
    const rowH = hasRibbon ? 42 : 28;

    const row = document.createElement('div');
    row.className = 'row' + (chain.dead ? ' dead' : '');
    row.style.minHeight = rowH + 'px';

    // label
    const label = document.createElement('div');
    label.className = 'row-label';
    label.style.minHeight = rowH + 'px';
    label.innerHTML =
      `<span class="lname"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${color};margin-right:4px;vertical-align:middle;flex-shrink:0"></span>${chain.name}</span>` +
      `<span class="lyear">${chain.founded}${chain.closed ? ' - '+chain.closed : ' - now'}</span>` +
      (chain.ownership ? `<span class="lacq">${chain.ownership.length} OWNERS</span>` : '');
    label.addEventListener('click', () => showTip(chain, null));
    row.appendChild(label);

    // track -- grid drawn via repeating gradient instead of ~30 grid-line divs
    const track = document.createElement('div');
    track.className = 'row-track' + (hasRibbon ? ' has-ribbon' : '');
    track.style.width = totalPx + 'px';
    track.style.minHeight = rowH + 'px';
    track.style.backgroundImage = gridBg;

    // main bar
    const bar = document.createElement('div');
    bar.className = 'bar' + (chain.dead ? ' dead' : '');
    const left = yearToPx(chain.founded);
    const width = Math.max(pxPerYear, yearToPx(chain.end) - left);
    bar.style.left = left + 'px';
    bar.style.width = width + 'px';
    bar.style.background = color;
    const bl = document.createElement('span');
    bl.className = 'bar-label';
    const currentCount = franchiseCountAt(chain, chain.end);
    bl.textContent = chain.founded + '  ' + chain.name + (currentCount != null ? '  ' + fmtCount(currentCount) : '');
    bar.appendChild(bl);
    bar.addEventListener('click', e => { e.stopPropagation(); showTip(chain, null); });
    track.appendChild(bar);

    // ownership ribbon
    if (hasRibbon) {
      const ribbon = document.createElement('div');
      ribbon.className = 'ribbon';
      const ownStart = chain.ownership[0].from;
      const ownEnd = chain.ownership[chain.ownership.length - 1].to;
      ribbon.style.left = yearToPx(ownStart) + 'px';
      ribbon.style.width = Math.max(4, yearToPx(ownEnd) - yearToPx(ownStart)) + 'px';

      chain.ownership.forEach((own, idx) => {
        const seg = document.createElement('div');
        seg.className = 'ribbon-seg';
        const segW = Math.max(2, yearToPx(own.to) - yearToPx(own.from));
        seg.style.width = segW + 'px';
        seg.style.background = own.color;
        seg.style.flexShrink = '0';

        if (pxPerYear >= 6 && segW > 30) {
          const lbl = document.createElement('span');
          lbl.className = 'ribbon-seg-label';
          lbl.textContent = own.owner;
          seg.appendChild(lbl);
        }

        if (idx < chain.ownership.length - 1) {
          const div = document.createElement('div');
          div.className = 'ribbon-div';
          div.style.borderLeftColor = own.color;
          seg.appendChild(div);
        }

        seg.addEventListener('click', e => { e.stopPropagation(); showTip(chain, own); });
        ribbon.appendChild(seg);
      });
      track.appendChild(ribbon);
    }

    row.appendChild(track);
    frag.appendChild(row);
  });

  chart.replaceChildren(frag);
}

// =============================================================================
// TOOLTIP / DETAIL PANEL  (showTip)
// =============================================================================
// Renders the floating panel at bottom of screen with full chain details.
// Three call signatures:
//   showTip(chain)
//      - generic info, contextYear defaults to chain.end (today for live brands,
//        close year for dead ones)
//   showTip(chain, ownershipEntry)
//      - same, but highlights a specific ownership era (used by ribbon segment
//        clicks on timeline view)
//   showTip(chain, null, contextYear)
//      - resolves time-aware fields (HQ, location count) at the requested year.
//        Used by SNAPSHOT cards so the panel matches the slider year.
//
// Sections rendered (graceful no-op when data absent):
//   tip-name, tip-tagline           always
//   tip-meta                        always (cat, founded, closed/active, duration)
//   tip-locations                   ORIGIN, HQ@year, LOCATIONS@year, sparkline,
//                                    CEO, CHAIR, FOUNDER, leadership notes
//   tip-desc                        prose description
//   tip-own-chain                   per-owner timeline strip
//   tip-eras                        decade narrative blurbs
//
// Tooltip is a SHARED single DOM element. There used to be a bug where the
// tooltip's children rendered without a wrapper -- fixed by wrapping in a
// <div id="tooltip">. The tooltip also stops click propagation so taps inside
// don't trigger the document-level "close tooltip" handler.
// =============================================================================
function showTip(chain, selectedOwn, contextYear) {
  const color = cats[chain.cat]?.color || '#c8940a';
  // year context for resolved fields. snapshot view passes its slider year;
  // other views default to chain.end (current year if alive, closing year if dead).
  const yr = contextYear != null ? contextYear : chain.end;

  document.getElementById('tip-name').textContent = chain.name;
  document.getElementById('tip-name').style.color = color;
  document.getElementById('tip-tagline').textContent = chain.tagline || '';
  document.getElementById('tip-meta').textContent =
    `${cats[chain.cat]?.label || chain.cat} // FOUNDED ${chain.founded} // ${chain.closed ? 'CLOSED ' + chain.closed : 'ACTIVE 2026'} // ${chain.duration} YRS`;

  // location + franchise block
  const locEl = document.getElementById('tip-locations');
  locEl.innerHTML = '';
  const rows = [];
  if (chain.origin) {
    rows.push(`<div class="tip-loc-row"><span class="tip-loc-label">ORIGIN</span><span class="tip-loc-value">${chain.origin.city}, ${chain.origin.state}</span></div>`);
  }
  if (chain.hq && chain.hq.length) {
    const hq = resolveHq(chain, yr);
    if (hq) {
      const same = chain.origin && hq.city === chain.origin.city && hq.state === chain.origin.state;
      rows.push(`<div class="tip-loc-row"><span class="tip-loc-label">HQ ${yr}</span><span class="tip-loc-value">${hq.city}, ${hq.state}${same ? ' <span class="tip-loc-year">(same as origin)</span>' : ''}</span></div>`);
    }
  }
  if (chain.franchises && chain.franchises.length) {
    const count = franchiseCountAt(chain, yr);
    if (count != null) {
      rows.push(`<div class="tip-loc-row"><span class="tip-loc-label">LOCATIONS ${yr}</span><span class="tip-loc-value">${count.toLocaleString()}</span></div>`);
    }
    // mini sparkline of known data points
    const spark = chain.franchises.map(p => `${p.year}:${fmtCount(p.count)}`).join('  ');
    rows.push(`<div class="tip-franchise-spark">${spark}</div>`);
  }
  // leadership
  if (chain.leadership) {
    const L = chain.leadership;
    if (L.ceo)      rows.push(`<div class="tip-loc-row"><span class="tip-loc-label">CEO</span><span class="tip-loc-value">${L.ceo}</span></div>`);
    if (L.chair && L.chair !== L.ceo)
                    rows.push(`<div class="tip-loc-row"><span class="tip-loc-label">CHAIR</span><span class="tip-loc-value">${L.chair}</span></div>`);
    if (L.founder)  rows.push(`<div class="tip-loc-row"><span class="tip-loc-label">FOUNDER</span><span class="tip-loc-value">${L.founder}</span></div>`);
    if (L.notes)    rows.push(`<div class="tip-franchise-spark" style="font-style:italic">${L.notes}</div>`);
  }
  locEl.innerHTML = rows.join('');

  document.getElementById('tip-desc').textContent = chain.desc || '';

  // ownership chain summary
  const ownEl = document.getElementById('tip-own-chain');
  ownEl.innerHTML = '';
  if (chain.ownership && chain.ownership.length > 0) {
    const div = document.createElement('div');
    div.className = 'own-chain';
    const title = document.createElement('div');
    title.className = 'own-chain-title';
    title.textContent = 'OWNERSHIP CHAIN';
    div.appendChild(title);
    chain.ownership.forEach(own => {
      const r = document.createElement('div');
      r.className = 'own-chain-row';
      if (selectedOwn && own === selectedOwn) r.style.fontWeight = 'bold';
      r.innerHTML = `<span class="own-dot" style="background:${own.color}"></span><span>${own.owner}</span><span class="own-years">${own.from} - ${own.to}</span>`;
      r.addEventListener('click', e => { e.stopPropagation(); showTip(chain, own); });
      div.appendChild(r);
    });
    ownEl.appendChild(div);
  }

  // era details
  const eraEl = document.getElementById('tip-eras');
  eraEl.innerHTML = '';
  const eraSource = selectedOwn ? chain.eras : chain.eras;
  if (eraSource) {
    const block = document.createElement('div');
    block.className = 'era-block';
    Object.entries(eraSource).sort((a,b) => a[0]-b[0]).forEach(([decade, text]) => {
      const d = document.createElement('div');
      d.className = 'era-decade';
      d.textContent = decade + 's';
      const t = document.createElement('div');
      t.className = 'era-text';
      t.textContent = text;
      block.appendChild(d);
      block.appendChild(t);
    });
    eraEl.appendChild(block);
  }

  tooltip.style.display = 'block';
}

document.getElementById('tip-close').addEventListener('click', e => { e.stopPropagation(); tooltip.style.display = 'none'; });
// clicks inside the tooltip should not close it -- only outside clicks do.
tooltip.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => { tooltip.style.display = 'none'; });

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sortMode = btn.dataset.sort;
    rerender();
  });
});

// ---- TAB SWITCHING ----
let activeTab = 'timeline';
const tabViews = {
  timeline:  document.getElementById('chart-wrap'),
  lifespan:  document.getElementById('lifespan-wrap'),
  graveyard: document.getElementById('graveyard-wrap'),
  snapshot:  document.getElementById('snapshot-wrap'),
  radial:    document.getElementById('radial-wrap'),
  map:       document.getElementById('map-wrap'),
};

function switchTab(tab) {
  activeTab = tab;
  Object.entries(tabViews).forEach(([key, el]) => {
    el.style.display = key === tab ? '' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  if (tab === 'timeline')  render();
  if (tab === 'lifespan')  renderLifespan(false);
  if (tab === 'graveyard') renderLifespan(true);
  if (tab === 'snapshot')  renderSnapshot();
  if (tab === 'radial')    renderRadial();
  if (tab === 'map')       renderMap();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// =============================================================================
// RADIAL VIEW -- the most complex view in the file
// =============================================================================
// Polar/radar chart drawn on <canvas>. Spokes radiate from center, length =
// the active radial metric value. Rendered with full pan + pinch-zoom + drag
// + double-tap-to-reset, all hand-rolled (no library).
//
// SEPARATION OF CONCERNS:
//   renderRadial()           -- Called when the view is shown OR when filter/
//                               metric/sort state changes. Re-derives the data,
//                               sizes the canvas, caches geometry in
//                               _radialBaseGeom, then triggers drawRadial().
//                               Also calls attachRadialInteractions() (idempotent).
//
//   drawRadial()             -- Draws one frame using current radialView state
//                               (scale, panX, panY). Called every animation
//                               frame during pan/pinch via scheduleRadialDraw().
//
//   attachRadialInteractions() -- Binds touch/mouse handlers ONCE per canvas
//                                 (uses canvas._radialBound flag). Handles wheel,
//                                 mouse drag, single-touch drag, two-touch pinch,
//                                 double-tap, and click hit-testing for tooltip.
//
//   scheduleRadialDraw()     -- requestAnimationFrame-throttled redraw. Use
//                               this from gesture handlers, not drawRadial()
//                               directly.
//
// COORDINATE SYSTEMS:
//   "world" coords = unzoomed positions in the canvas (origin at top-left of
//                    canvas, cx/cy = canvas center).
//   "screen" coords = where things actually render after applying
//                     scale + panX + panY.
//   toScreen(wx, wy) converts world to screen.
//
//   Geometry (spokes, dots, scale rings) is computed in world coords, then
//   transformed to screen as the last step.
//
//   Labels are computed in SCREEN coords directly (constant pixel size, anchor
//   at the dot's screen position). This is the "Google Maps trick" -- text
//   stays readable at every zoom level because it never scales with the map.
//
// LABEL PLACEMENT (3 passes):
//   Pass 1: Try each chain name at standard 8px gap from its dot.
//   Pass 2: Retry the unplaced ones at tighter 3px gap.
//   Pass 3: (only when metric=ownership AND scale >= 2) Owner-segment labels
//           drawn at each segment's midpoint. Goes through the same OBB
//           collision system as chain labels.
//
//   Collision detection uses Oriented Bounding Boxes (OBB) with the Separating
//   Axis Theorem. This was a critical fix -- earlier code used Axis-Aligned
//   Bounding Boxes (AABB), which for a rotated label is the diagonal of its
//   actual rect, much wider than reality. AABBs caused valid labels to be
//   incorrectly rejected. The obbOverlap() function projects both rects onto
//   each one's axes and looks for a separating axis; if any axis cleanly
//   separates them, no collision.
//
// ZOOM ANCHORING:
//   zoomAt(anchorX, anchorY, newScale) computes new pan values such that the
//   point currently at (anchorX, anchorY) stays at that screen position after
//   the zoom. This is how pinch-zoom feels natural -- the spot between your
//   fingers stays put while everything else scales around it. Without this,
//   pinch zoom feels like the chart is sliding away from you.
//
// METRIC-AWARE RENDERING:
//   When radialMetric === 'ownership', drawRadial draws SEGMENTED spokes
//   instead of single-color spokes. Each segment is colored with the matching
//   ownership[].color, sized proportionally to (to - from) tenure years.
//   Notch ticks drawn at handoff points. For chains still owned today,
//   the last segment runs through chain.end (so currently-owned brands span
//   to 2026). Owner names render at segment midpoints in pass 3 of label layout.
//
//   Other metrics keep simple single-color spokes (category color).
//
// IF YOU ADD A NEW METRIC, the renderRadial filter automatically drops chains
// where the metric returns null. Sort by the metric value descending so longest-
// lived/highest-value chains get layout priority.
//
// IF YOU ADD A "MAP VIEW," the same gesture-handling pattern (zoomAt, double-
// tap-to-reset, scheduleDraw) will translate cleanly. attachRadialInteractions
// is a good template.
// =============================================================================

const radialView = { scale: 1, panX: 0, panY: 0 };
let _radialData = [], _radialBaseGeom = null, _radialRaf = false;

function renderRadial() {
  const wrap = document.getElementById('radial-wrap');
  const canvas = document.getElementById('radial-canvas');
  const dpr = window.devicePixelRatio || 1;
  const W = Math.min(window.innerWidth, 700);
  const H = Math.min(window.innerHeight - 88, Math.max(W, window.innerHeight - 200));
  // size the canvas backing store at devicePixelRatio for crisp rendering
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  wrap.style.display = 'flex';
  wrap.style.justifyContent = 'center';
  wrap.style.alignItems = 'flex-start';

  // filter + sort by current metric. Drop chains with no value for this metric.
  const metric = radialMetrics[radialMetric] || radialMetrics.duration;
  let data = chains.filter(c => activeFilters.has(c.cat));
  if (searchQuery) data = data.filter(c => c.name.toLowerCase().includes(searchQuery));
  data = data
    .map(c => ({ chain: c, value: metric.valueOf(c) }))
    .filter(d => d.value != null && d.value > 0);
  data.sort((a, b) => b.value - a.value);
  _radialData = data;

  const cx = W / 2;
  const cy = H / 2;
  const maxValue = data.length ? data[0].value : 1;
  const maxR = Math.min(cx, cy) * 0.85;
  const minR = 22;
  const angleStep = data.length ? (Math.PI * 2) / data.length : 0;

  _radialBaseGeom = { W, H, cx, cy, minR, maxR, maxValue, angleStep, dpr, metric };

  // bind interactions once per render-pass
  attachRadialInteractions(canvas);

  drawRadial();
}

// draw the current frame at radialView's scale/pan
function drawRadial() {
  if (!_radialBaseGeom) return;
  const canvas = document.getElementById('radial-canvas');
  const ctx = canvas.getContext('2d');
  const { W, H, cx, cy, minR, maxR, maxValue, angleStep, dpr, metric } = _radialBaseGeom;
  const data = _radialData;
  const { scale, panX, panY } = radialView;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#f0e8d5';
  ctx.fillRect(0, 0, W, H);

  if (!data.length) {
    // empty state hint
    ctx.fillStyle = '#8a6e3a';
    ctx.font = '12px Share Tech Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('No chains with data for: ' + metric.label, W/2, H/2);
    ctx.font = '10px Share Tech Mono, monospace';
    ctx.fillText('change metric in the menu', W/2, H/2 + 18);
    return;
  }

  // helper: world (unzoomed) point -> screen point
  const toScreen = (wx, wy) => ({
    x: (wx - cx) * scale + cx + panX,
    y: (wy - cy) * scale + cy + panY,
  });

  // scale rings keyed off the current metric's ticks
  metric.ticks.forEach(t => {
    if (t > maxValue) return;
    const rWorld = minR + (t / maxValue) * (maxR - minR);
    if (rWorld > maxR) return;
    const rScreen = rWorld * scale;
    const center = toScreen(cx, cy);
    ctx.beginPath();
    ctx.arc(center.x, center.y, rScreen, 0, Math.PI * 2);
    ctx.strokeStyle = '#c8a060';
    ctx.lineWidth = 0.5;
    ctx.globalAlpha = 0.3;
    ctx.stroke();
    ctx.globalAlpha = 1;
    if (scale < 3) {
      ctx.fillStyle = '#8a6e3a';
      ctx.font = '9px Share Tech Mono, monospace';
      ctx.textAlign = 'left';
      ctx.fillText(metric.tickLabel(t), center.x + rScreen + 3, center.y + 3);
    }
  });

  // spokes + dots (geometry scales)
  const labelCands = [];
  const ownerLegendCands = []; // populated only when metric is 'ownership'
  const isOwnershipMetric = radialMetric === 'ownership';

  data.forEach((d, i) => {
    const { chain, value } = d;
    const angle = i * angleStep - Math.PI / 2;
    const lineLen = minR + (value / maxValue) * (maxR - minR);
    const catColor = cats[chain.cat]?.color || '#888';

    const baseW = { x: cx + Math.cos(angle) * (minR + 2), y: cy + Math.sin(angle) * (minR + 2) };
    const tipW  = { x: cx + Math.cos(angle) * lineLen,    y: cy + Math.sin(angle) * lineLen };
    const baseS = toScreen(baseW.x, baseW.y);
    const tipS  = toScreen(tipW.x, tipW.y);

    if (isOwnershipMetric && chain.ownership && chain.ownership.length) {
      // segments along the spoke, proportional to each owner's tenure.
      // current owner extends to chain.end (so still-owned chains run to 2026 or close-year).
      const segs = chain.ownership.map((o, idx) => {
        const isLast = idx === chain.ownership.length - 1;
        const to = isLast ? chain.end : o.to;
        return { owner: o.owner, color: o.color, span: Math.max(1, to - o.from) };
      });
      const totalSpan = segs.reduce((s, x) => s + x.span, 0);

      // walk fractions 0..1 along the spoke (skipping the inner minR+2 stub)
      let acc = 0;
      const uvx = Math.cos(angle), uvy = Math.sin(angle);
      const innerR = minR + 2;
      const outerR = lineLen;

      segs.forEach((seg, idx) => {
        const t0 = acc / totalSpan;
        acc += seg.span;
        const t1 = acc / totalSpan;
        const r0 = innerR + t0 * (outerR - innerR);
        const r1 = innerR + t1 * (outerR - innerR);
        const a = toScreen(cx + uvx * r0, cy + uvy * r0);
        const b = toScreen(cx + uvx * r1, cy + uvy * r1);

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = seg.color;
        ctx.lineWidth = chain.dead ? 1.5 : 2.5;
        ctx.globalAlpha = chain.dead ? 0.55 : 0.95;
        ctx.stroke();
        ctx.globalAlpha = 1;

        // small notch tick at the boundary between segments (not at the spoke base)
        if (idx > 0) {
          const nLen = 3.5;
          const perpX = -uvy, perpY = uvx;
          ctx.beginPath();
          ctx.moveTo(a.x - perpX * nLen, a.y - perpY * nLen);
          ctx.lineTo(a.x + perpX * nLen, a.y + perpY * nLen);
          ctx.strokeStyle = '#3a2a10';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // queue an owner-label at the segment midpoint for later (drawn after chain names)
        const tm = (t0 + t1) / 2;
        const rm = innerR + tm * (outerR - innerR);
        const mid = toScreen(cx + uvx * rm, cy + uvy * rm);
        ownerLegendCands.push({
          chain, owner: seg.owner, color: seg.color, angle,
          screen: mid, span: seg.span,
        });
      });
    } else {
      // standard single-color spoke
      ctx.beginPath();
      ctx.moveTo(baseS.x, baseS.y);
      ctx.lineTo(tipS.x, tipS.y);
      ctx.strokeStyle = catColor;
      ctx.lineWidth = chain.dead ? 1 : 1.8;
      ctx.globalAlpha = chain.dead ? 0.45 : 0.85;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // tip dot (always category color so the chain stays identifiable)
    ctx.beginPath();
    ctx.arc(tipS.x, tipS.y, chain.dead ? 2.5 : 3.5, 0, Math.PI * 2);
    ctx.fillStyle = catColor;
    ctx.globalAlpha = chain.dead ? 0.5 : 1;
    ctx.fill();
    ctx.globalAlpha = 1;

    labelCands.push({ chain, angle, worldR: lineLen, screen: tipS, color: catColor, priority: value });
  });

  // center circle
  const cs = toScreen(cx, cy);
  const cr = Math.max(20, minR * scale * 0.9);
  ctx.beginPath();
  ctx.arc(cs.x, cs.y, cr, 0, Math.PI * 2);
  ctx.fillStyle = '#c8940a';
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(14, cr * 0.55)}px Share Tech Mono, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('QSR', cs.x, cs.y);

  // labels: constant screen-size, drawn radially outward from each dot.
  // Two-pass placement: first try a normal gap, then retry unplaced labels at a
  // tighter gap to slip into corners that were too far from the dots in pass 1.
  // Collision uses oriented bounding rects (SAT). Sort by priority (duration desc).
  labelCands.sort((a, b) => b.priority - a.priority);
  const placed = [];
  // shrink font slightly at high zoom so denser bands of dots can each get a label
  const fontPx = scale > 4 ? 10 : 11;
  ctx.font = `bold ${fontPx}px Share Tech Mono, monospace`;
  ctx.textBaseline = 'middle';
  const padX = 2, padY = 2;
  const th = fontPx + 1;

  // ---------------------------------------------------------------------------
  // OBB collision via Separating Axis Theorem.
  // Each rect: { cx, cy, hw, hh, angle }
  //   - cx,cy = center in screen coords
  //   - hw,hh = half-width, half-height (rect extends ±hw on local x, ±hh on y)
  //   - angle = rotation in radians (0 = horizontal text reading right)
  //
  // SAT works by projecting both rects onto each rect's two principal axes
  // (4 axes total). If any axis shows a gap between the projections, the
  // rects don't overlap. If all four axes show overlap, they do.
  //
  // Why not AABB? AABB takes the axis-aligned bounding box of a ROTATED rect,
  // which for a long label rotated 45° is much wider than the actual label.
  // Adjacent rotated labels would falsely register as colliding. SAT projects
  // onto the rects' OWN axes, so the test matches what's drawn on screen.
  // ---------------------------------------------------------------------------
  function obbOverlap(a, b) {
    const ax1 = Math.cos(a.angle), ay1 = Math.sin(a.angle);
    const ax2 = -ay1, ay2 = ax1;
    const bx1 = Math.cos(b.angle), by1 = Math.sin(b.angle);
    const bx2 = -by1, by2 = bx1;
    const axes = [[ax1,ay1],[ax2,ay2],[bx1,by1],[bx2,by2]];
    const dx = b.cx - a.cx, dy = b.cy - a.cy;
    for (const [ux, uy] of axes) {
      const projDist = Math.abs(dx * ux + dy * uy);
      const aProj = a.hw * Math.abs(ax1*ux + ay1*uy) + a.hh * Math.abs(ax2*ux + ay2*uy);
      const bProj = b.hw * Math.abs(bx1*ux + by1*uy) + b.hh * Math.abs(bx2*ux + by2*uy);
      if (projDist > aProj + bProj) return false;
    }
    return true;
  }

  // ---------------------------------------------------------------------------
  // tryPlace: attempt to place one chain label at a given gap distance from
  // its dot. Handles rotation, flipping for left-half spokes, viewport culling,
  // collision check vs already-placed labels (in `placed` array, closure scope).
  // Returns true if drawn, false if collision/off-screen.
  //
  // Called twice per render (passes 1 and 2) with different gap values. Pass 1
  // tries 8px gap (clean spacing); pass 2 retries failures at 3px (tighter,
  // closer to the dot, often slips into space pass 1 missed).
  // ---------------------------------------------------------------------------
  function tryPlace(c, labelGap) {
    const text = c.chain.name;
    const tw = ctx.measureText(text).width;
    const lx = c.screen.x + Math.cos(c.angle) * labelGap;
    const ly = c.screen.y + Math.sin(c.angle) * labelGap;

    let rot = c.angle, flip = false;
    if (rot > Math.PI / 2 || rot < -Math.PI / 2) { rot += Math.PI; flip = true; }

    const dirX = Math.cos(rot), dirY = Math.sin(rot);
    const cxL = flip ? lx - dirX * (tw / 2) : lx + dirX * (tw / 2);
    const cyL = flip ? ly - dirY * (tw / 2) : ly + dirY * (tw / 2);

    const aabbR = (tw + th) / 2 + 4;
    if (cxL + aabbR < 0 || cxL - aabbR > W || cyL + aabbR < 0 || cyL - aabbR > H) return false;

    const myObb = { cx: cxL, cy: cyL, hw: tw / 2 + padX, hh: th / 2 + padY, angle: rot };
    for (let i = 0; i < placed.length; i++) {
      if (obbOverlap(myObb, placed[i])) return false;
    }
    placed.push(myObb);

    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(rot);
    ctx.textAlign = flip ? 'right' : 'left';
    ctx.fillStyle = c.chain.dead ? '#999' : '#2a1a05';
    ctx.fillText(text, 0, 0);
    ctx.restore();
    return true;
  }

  // pass 1 -- normal offset
  const unplaced = [];
  labelCands.forEach(c => { if (!tryPlace(c, 8)) unplaced.push(c); });
  // pass 2 -- tight offset for ones that didn't fit
  unplaced.forEach(c => tryPlace(c, 3));

  // pass 3 -- owner segment labels (only on ownership metric, only when zoomed enough
  // for the segments to be visually meaningful). Drawn perpendicular to the spoke
  // so they don't collide with the spoke itself, in the segment's own color.
  if (isOwnershipMetric && scale >= 2 && ownerLegendCands.length) {
    const ownerFontPx = scale > 4 ? 9 : 10;
    ctx.font = `${ownerFontPx}px Share Tech Mono, monospace`;
    ctx.textBaseline = 'middle';
    const ownerTh = ownerFontPx + 1;

    // sort by span (longer-tenure owners win their slot first)
    ownerLegendCands.sort((a, b) => b.span - a.span);

    ownerLegendCands.forEach(c => {
      const text = c.owner;
      const tw = ctx.measureText(text).width;

      // place perpendicular to the spoke -- on the side that points toward the
      // larger-angle direction, just so segments aren't all stacked on the same side.
      const perpX = -Math.sin(c.angle), perpY = Math.cos(c.angle);
      const perpGap = 6;
      const lx = c.screen.x + perpX * perpGap;
      const ly = c.screen.y + perpY * perpGap;

      // text rotated to match perpendicular so it sits parallel to spoke direction
      let rot = c.angle;
      let flip = false;
      if (rot > Math.PI / 2 || rot < -Math.PI / 2) { rot += Math.PI; flip = true; }

      // rect for collision (against the same `placed` array)
      const dirX = Math.cos(rot), dirY = Math.sin(rot);
      const cxL = flip ? lx - dirX * (tw / 2) : lx + dirX * (tw / 2);
      const cyL = flip ? ly - dirY * (tw / 2) : ly + dirY * (tw / 2);

      const aabbR = (tw + ownerTh) / 2 + 4;
      if (cxL + aabbR < 0 || cxL - aabbR > W || cyL + aabbR < 0 || cyL - aabbR > H) return;

      const myObb = { cx: cxL, cy: cyL, hw: tw / 2 + 2, hh: ownerTh / 2 + 2, angle: rot };
      let collides = false;
      for (let i = 0; i < placed.length; i++) {
        if (obbOverlap(myObb, placed[i])) { collides = true; break; }
      }
      if (collides) return;
      placed.push(myObb);

      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(rot);
      ctx.textAlign = flip ? 'right' : 'left';
      ctx.fillStyle = c.color;
      ctx.fillText(text, 0, 0);
      ctx.restore();
    });
  }

  // hud: zoom indicator + reset button hint (only when zoomed)
  if (scale > 1.05 || panX !== 0 || panY !== 0) {
    ctx.fillStyle = 'rgba(58,42,16,0.7)';
    ctx.font = '10px Share Tech Mono, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`${scale.toFixed(2)}x  ·  double-tap to reset`, 8, 14);
  }
}

function scheduleRadialDraw() {
  if (_radialRaf) return;
  _radialRaf = true;
  requestAnimationFrame(() => { _radialRaf = false; drawRadial(); });
}

// =============================================================================
// RADIAL GESTURE HANDLERS
// =============================================================================
// Binds touch/mouse events ONCE per canvas (canvas._radialBound flag prevents
// re-binding when renderRadial is called repeatedly). All event handlers
// update radialView state (scale, panX, panY) and call scheduleRadialDraw()
// to redraw on the next animation frame.
//
// State variables (closure-scoped):
//   dragging          true while a single-finger or mouse drag is in progress
//   movedDuringDrag   set to true if pointer moved >3px during drag, used to
//                     suppress the click handler so dragging doesn't trigger
//                     a tooltip on accidental release
//   pinchInitial      snapshot of pinch start state (distance, midpoint,
//                     scale, pan) -- ratios computed from this for stability
//   lastTapTime       for double-tap detection (resets view if 2 taps <280ms apart)
//
// The window-level mousemove/mouseup handlers exist so a drag that starts on
// the canvas continues even if the cursor leaves the canvas during the drag.
// touchend always cancels both drag and pinch state.
// =============================================================================
function attachRadialInteractions(canvas) {
  if (canvas._radialBound) return;
  canvas._radialBound = true;

  let dragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;
  let movedDuringDrag = false;
  let pinchInitial = null;
  let lastTapTime = 0;

  function clientToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  // ---------------------------------------------------------------------------
  // zoomAt: zoom anchored at a screen-space point. The point under your
  // fingers (or under the mouse cursor) stays put while everything else scales
  // around it. This is the "Google Maps feel" -- without it pinch zoom feels
  // like the chart slides away.
  //
  // Math: Given the screen-to-world projection
  //   screenX = (worldX - cx) * scale + cx + panX
  // we solve for worldX given the current scale/pan, then recompute panX
  // such that worldX still maps to the same screen position at the new scale.
  // Same for Y axis.
  //
  // Scale is clamped to [0.5, 8]. Out-of-range pinches stop expanding/shrinking
  // but don't error.
  // ---------------------------------------------------------------------------
  function zoomAt(anchorX, anchorY, newScale) {
    if (!_radialBaseGeom) return;
    const { cx, cy } = _radialBaseGeom;
    const oldScale = radialView.scale;
    newScale = Math.max(0.5, Math.min(8, newScale));
    if (newScale === oldScale) return;
    // world-coords of anchor at current pan/scale:
    // screenX = (worldX - cx) * scale + cx + panX  =>  worldX = (screenX - cx - panX) / scale + cx
    const worldX = (anchorX - cx - radialView.panX) / oldScale + cx;
    const worldY = (anchorY - cy - radialView.panY) / oldScale + cy;
    radialView.scale = newScale;
    // solve new pan so that the same worldX,Y still maps to anchorX,Y
    radialView.panX = anchorX - cx - (worldX - cx) * newScale;
    radialView.panY = anchorY - cy - (worldY - cy) * newScale;
    scheduleRadialDraw();
  }

  function resetView() {
    radialView.scale = 1;
    radialView.panX = 0;
    radialView.panY = 0;
    scheduleRadialDraw();
  }

  // wheel zoom (desktop)
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const p = clientToCanvas(e.clientX, e.clientY);
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    zoomAt(p.x, p.y, radialView.scale * factor);
  }, { passive: false });

  // mouse drag (desktop)
  canvas.addEventListener('mousedown', e => {
    dragging = true;
    movedDuringDrag = false;
    dragStartX = e.clientX; dragStartY = e.clientY;
    panStartX = radialView.panX; panStartY = radialView.panY;
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
    if (Math.abs(dx) + Math.abs(dy) > 3) movedDuringDrag = true;
    radialView.panX = panStartX + dx;
    radialView.panY = panStartY + dy;
    scheduleRadialDraw();
  });
  window.addEventListener('mouseup', () => { dragging = false; });

  // touch: 1 finger = pan, 2 fingers = pinch zoom
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      const p = clientToCanvas(e.touches[0].clientX, e.touches[0].clientY);
      dragging = true;
      movedDuringDrag = false;
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      panStartX = radialView.panX; panStartY = radialView.panY;

      // double-tap detection
      const now = Date.now();
      if (now - lastTapTime < 280) {
        resetView();
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
    } else if (e.touches.length === 2) {
      dragging = false;
      const a = clientToCanvas(e.touches[0].clientX, e.touches[0].clientY);
      const b = clientToCanvas(e.touches[1].clientX, e.touches[1].clientY);
      pinchInitial = {
        dist: Math.hypot(a.x - b.x, a.y - b.y),
        cx: (a.x + b.x) / 2,
        cy: (a.y + b.y) / 2,
        scale: radialView.scale,
        panX: radialView.panX,
        panY: radialView.panY,
      };
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && dragging) {
      e.preventDefault();
      const dx = e.touches[0].clientX - dragStartX;
      const dy = e.touches[0].clientY - dragStartY;
      if (Math.abs(dx) + Math.abs(dy) > 3) movedDuringDrag = true;
      radialView.panX = panStartX + dx;
      radialView.panY = panStartY + dy;
      scheduleRadialDraw();
    } else if (e.touches.length === 2 && pinchInitial) {
      e.preventDefault();
      const a = clientToCanvas(e.touches[0].clientX, e.touches[0].clientY);
      const b = clientToCanvas(e.touches[1].clientX, e.touches[1].clientY);
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const newScale = Math.max(0.5, Math.min(8, pinchInitial.scale * (dist / pinchInitial.dist)));
      // anchor at the midpoint between fingers
      zoomAt(pinchInitial.cx, pinchInitial.cy, newScale);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    dragging = false;
    pinchInitial = null;
  });

  // tap to identify -- only fires if not a drag
  canvas.addEventListener('click', e => {
    if (movedDuringDrag) { movedDuringDrag = false; return; }
    if (!_radialBaseGeom) return;
    const p = clientToCanvas(e.clientX, e.clientY);
    const { cx, cy, minR, maxR, maxValue, angleStep } = _radialBaseGeom;
    const { scale, panX, panY } = radialView;

    // hit test in screen space
    let hit = null, hitDist = 18;
    _radialData.forEach((d, i) => {
      const angle = i * angleStep - Math.PI / 2;
      const lineLen = minR + (d.value / maxValue) * (maxR - minR);
      const wx = cx + Math.cos(angle) * lineLen;
      const wy = cy + Math.sin(angle) * lineLen;
      const sx = (wx - cx) * scale + cx + panX;
      const sy = (wy - cy) * scale + cy + panY;
      const dist = Math.hypot(p.x - sx, p.y - sy);
      if (dist < hitDist) { hit = d.chain; hitDist = dist; }
    });
    if (hit) showTip(hit, null);
  });
}

// =============================================================================
// LIFESPAN + GRAVEYARD VIEWS  (shared render function)
// =============================================================================
// Horizontal bar chart sorted by duration, longest first. The same render
// function powers both views with a graveyardMode flag:
//   graveyardMode=false  -> LIFESPAN  (all chains)
//   graveyardMode=true   -> GRAVEYARD (filtered to chain.dead === true)
//
// Each view has its own DOM containers (#ls-axis/#ls-chart vs #gy-axis/#gy-chart)
// but they share the same CSS rules via combined selectors. There used to be
// a bug where #gy-axis had no CSS at all, so its tick divs stacked vertically
// instead of laying out horizontally as flex -- fixed by combining the
// selectors. Don't separate them again.
//
// LS_PX is the pixels-per-year scale on these views (independent from the
// timeline view's pxPerYear, which is user-controlled). Hardcoded to 3px/yr
// because lifespan/graveyard don't have a zoom slider.
// =============================================================================
const LS_PX = 3;

function renderLifespan(graveyardMode) {
  const axisEl  = document.getElementById(graveyardMode ? 'gy-axis'  : 'ls-axis');
  const chartEl = document.getElementById(graveyardMode ? 'gy-chart' : 'ls-chart');

  let data = chains.filter(c => activeFilters.has(c.cat));
  if (searchQuery) data = data.filter(c => c.name.toLowerCase().includes(searchQuery) || (c.desc && c.desc.toLowerCase().includes(searchQuery)));
  if (graveyardMode) data = data.filter(c => c.dead);
  data.sort((a,b) => b.duration - a.duration);

  const maxDur = data.length ? data[0].duration : 100;
  const trackW = Math.max(300, maxDur * LS_PX + 40);

  const axisFrag = document.createDocumentFragment();
  for (let y = 0; y <= maxDur + 10; y++) {
    const tick = document.createElement('div');
    tick.className = 'ls-tick' + (y % 50 === 0 ? ' major' : '');
    tick.style.width = LS_PX + 'px';
    if (y % 50 === 0) tick.textContent = y + 'yr';
    axisFrag.appendChild(tick);
  }
  axisEl.replaceChildren(axisFrag);

  if (data.length === 0) {
    chartEl.replaceChildren();
    chartEl.innerHTML = '<div style="padding:24px;font-size:12px;color:#8a6e3a;font-family:Share Tech Mono,monospace;">No chains match current filters.</div>';
    return;
  }

  const chartFrag = document.createDocumentFragment();
  data.forEach(chain => {
    const color = cats[chain.cat]?.color || '#888';
    const row = document.createElement('div');
    row.className = 'ls-row' + (chain.dead ? ' dead' : '');

    const label = document.createElement('div');
    label.className = 'ls-label';
    label.innerHTML = `<span class="lname"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${color};margin-right:4px;vertical-align:middle"></span>${chain.name}</span><span class="lyrs">${chain.founded}${chain.closed ? ' - '+chain.closed : ' - now'} &nbsp; ${chain.duration} yrs</span>`;
    label.addEventListener('click', () => showTip(chain, null));
    row.appendChild(label);

    const track = document.createElement('div');
    track.className = 'ls-track';
    track.style.minWidth = trackW + 'px';

    const bar = document.createElement('div');
    bar.className = 'ls-bar' + (chain.dead ? ' dead' : '');
    bar.style.width = Math.max(4, chain.duration * LS_PX) + 'px';
    bar.style.background = color;
    const bl = document.createElement('span');
    bl.className = 'ls-bar-label';
    bl.textContent = chain.duration + ' yrs  ' + chain.name;
    bar.appendChild(bl);
    bar.addEventListener('click', e => { e.stopPropagation(); showTip(chain, null); });
    track.appendChild(bar);
    row.appendChild(track);
    chartFrag.appendChild(row);
  });
  chartEl.replaceChildren(chartFrag);
}

// =============================================================================
// SNAPSHOT VIEW
// =============================================================================
// Year-slider view showing all brands alive at the slider year as a grid of
// cards. Each card resolves time-aware fields at snapYear:
//   - age = snapYear - chain.founded
//   - location count via franchiseDataAt() with reported/interpolated marker
//   - YoY delta vs (snapYear - 1) shown as colored pill (green=gain, red=loss)
//   - HQ city via resolveHq()
//   - ownership era via simple find() over chain.ownership[]
//
// Tapping a card opens the tooltip with snapYear passed as contextYear, so
// the tooltip's HQ / location count match what the card showed.
//
// PERFORMANCE:
//   - Slider drag is rAF-throttled (_snapPending guard) so dragging stays
//     smooth on slow phones. Year readout updates immediately for tactile
//     feedback; the grid catches up on the next frame.
//   - Grid built via DocumentFragment, single replaceChildren commit.
//
// HISTORY:
//   - Default year used to be 1955 (peak QSR origin era). Confused users who
//     thought the displayed ages were brand current ages, so we changed the
//     default to 2026. Slider still goes back to 1880 for historical browsing.
// =============================================================================
let snapYear = 2026;

function renderSnapshot() {
  const yr = snapYear;
  document.getElementById('snap-year-display').textContent = yr;

  const alive = chains.filter(c =>
    activeFilters.has(c.cat) && c.founded <= yr && c.end >= yr &&
    (!searchQuery || c.name.toLowerCase().includes(searchQuery))
  );

  const catCounts = {};
  alive.forEach(c => { catCounts[c.cat] = (catCounts[c.cat] || 0) + 1; });
  const topCats = Object.entries(catCounts).sort((a,b) => b[1]-a[1]).slice(0,3)
    .map(([k,v]) => `${cats[k]?.label||k} (${v})`).join('  /  ');

  document.getElementById('snap-alive-count').textContent = alive.length + ' BRANDS OPERATING';
  document.getElementById('snap-cat-count').textContent = topCats;

  const grid = document.getElementById('snap-grid');

  if (alive.length === 0) {
    grid.replaceChildren();
    grid.innerHTML = '<div style="padding:24px;font-size:12px;color:#8a6e3a;">No brands match current filters for this year.</div>';
    return;
  }

  alive.sort((a,b) => a.founded - b.founded);
  const frag = document.createDocumentFragment();
  alive.forEach(chain => {
    const color = cats[chain.cat]?.color || '#888';
    const age = yr - chain.founded;
    let ownerText = '';
    if (chain.ownership) {
      const own = chain.ownership.find(o => yr >= o.from && yr < o.to);
      if (own) ownerText = own.owner;
    }
    const fd = franchiseDataAt(chain, yr);
    const hq = resolveHq(chain, yr);

    // location line: count + reported/~ marker + YoY delta
    let countLine = '';
    if (fd) {
      const marker = fd.reported ? '●' : '~';
      const cls = fd.reported ? 'sc-count reported' : 'sc-count interp';
      let deltaStr = '';
      if (fd.delta != null && fd.delta !== 0) {
        const sign = fd.delta > 0 ? '+' : '';
        const dcls = fd.delta > 0 ? 'sc-delta up' : 'sc-delta down';
        deltaStr = ` <span class="${dcls}">${sign}${fd.delta.toLocaleString()}</span>`;
      }
      countLine = `<span class="${cls}" style="color:${color}"><span class="sc-marker">${marker}</span>${fd.count.toLocaleString()} locations${deltaStr}</span>`;
    }

    const card = document.createElement('div');
    card.className = 'snap-card';
    card.style.background = color + '18';
    card.style.borderColor = color;
    card.innerHTML =
      `<span class="sc-name" style="color:${color}">${chain.name}</span>` +
      `<span class="sc-age" style="color:${color}">${chain.founded} &nbsp; ${age} yr${age!==1?'s':''} old</span>` +
      countLine +
      (hq ? `<span class="sc-hq" style="color:${color}">HQ: ${hq.city}, ${hq.state}</span>` : '') +
      (ownerText ? `<span class="sc-owner" style="color:${color}">${ownerText}</span>` : '');
    card.addEventListener('click', e => { e.stopPropagation(); showTip(chain, null, snapYear); });
    frag.appendChild(card);
  });
  grid.replaceChildren(frag);
}

let _snapPending = false;
document.getElementById('snap-slider').addEventListener('input', e => {
  snapYear = parseInt(e.target.value);
  // immediately update the year readout for tactile feedback
  document.getElementById('snap-year-display').textContent = snapYear;
  if (_snapPending) return;
  _snapPending = true;
  requestAnimationFrame(() => { _snapPending = false; renderSnapshot(); });
});

// =============================================================================
// MAP VIEW -- D3 + us-atlas TopoJSON (real state shapes)
// =============================================================================
// Loads us-atlas states-10m.json from CDN once, projects with d3.geoAlbersUsa,
// draws real state paths. Fallback message if CDN unavailable.
// =============================================================================

const US_CODES = new Set([
  'AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA',
  'KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ',
  'NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT',
  'VA','WA','WV','WI','WY','DC'
]);

// FIPS code to state abbreviation lookup
const FIPS_TO_STATE = {
  '01':'AL','02':'AK','04':'AZ','05':'AR','06':'CA','08':'CO','09':'CT','10':'DE',
  '11':'DC','12':'FL','13':'GA','15':'HI','16':'ID','17':'IL','18':'IN','19':'IA',
  '20':'KS','21':'KY','22':'LA','23':'ME','24':'MD','25':'MA','26':'MI','27':'MN',
  '28':'MS','29':'MO','30':'MT','31':'NE','32':'NV','33':'NH','34':'NJ','35':'NM',
  '36':'NY','37':'NC','38':'ND','39':'OH','40':'OK','41':'OR','42':'PA','44':'RI',
  '45':'SC','46':'SD','47':'TN','48':'TX','49':'UT','50':'VT','51':'VA','53':'WA',
  '54':'WV','55':'WI','56':'WY'
};

function getHqStateAt(chain, year) {
  if (!chain.hq) return null;
  let h = chain.hq.find(o => year >= o.from && year < o.to);
  if (!h) h = chain.hq[chain.hq.length - 1];
  return (h && US_CODES.has(h.state)) ? h.state : null;
}
function getOriginState(chain) {
  if (!chain.origin) return null;
  return US_CODES.has(chain.origin.state) ? chain.origin.state : null;
}

let mapYear = 2026;
let mapMode = 'hq';
let mapChain = null;
let _mapPending = false;
let _mapReady = false;   // true once D3 + TopoJSON loaded and SVG built
let _geoPath = null;
let _stateFeatures = null;

function loadMapDeps(callback) {
  if (_mapReady) { callback(); return; }

  // Load D3 then topojson then the atlas data, sequentially
  function loadScript(src, cb) {
    const s = document.createElement('script');
    s.src = src; s.onload = cb;
    s.onerror = () => {
      document.getElementById('map-svg-container').innerHTML =
        '<div style="padding:24px;font-family:Share Tech Mono,monospace;font-size:12px;color:#8a6e3a;">MAP UNAVAILABLE -- CDN blocked. Open in a browser with internet access.</div>';
    };
    document.head.appendChild(s);
  }

  loadScript('https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js', () => {
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js', () => {
      fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
        .then(r => r.json())
        .then(us => {
          const container = document.getElementById('map-svg-container');
          const W = Math.min(container.clientWidth || 600, 860);
          const H = Math.round(W * 0.62);

          const projection = d3.geoAlbersUsa().scale(W * 1.28).translate([W / 2, H / 2]);
          _geoPath = d3.geoPath().projection(projection);
          _stateFeatures = topojson.feature(us, us.objects.states).features;

          const svg = d3.select(container).append('svg')
            .attr('viewBox', `0 0 ${W} ${H}`)
            .style('width','100%').style('max-width', W+'px').style('display','block');

          // Draw state paths
          svg.append('g').attr('id','map-states')
            .selectAll('path')
            .data(_stateFeatures)
            .enter().append('path')
              .attr('class','state-path')
              .attr('id', d => 'state-' + (FIPS_TO_STATE[d.id] || d.id))
              .attr('data-state', d => FIPS_TO_STATE[d.id] || '')
              .attr('d', _geoPath)
              .on('click', function(event, d) {
                const code = FIPS_TO_STATE[d.id];
                if (code) showStateTip(code);
              });

          // State borders mesh
          svg.append('path')
            .datum(topojson.mesh(us, us.objects.states, (a,b) => a !== b))
            .attr('fill','none')
            .attr('stroke','#c8b070')
            .attr('stroke-width','0.6')
            .attr('d', _geoPath);

          // Populate chain dropdown
          const sel = document.getElementById('map-chain-select');
          chains.filter(c => c.hq || c.origin).sort((a,b) => a.name.localeCompare(b.name))
            .forEach(c => {
              const o = document.createElement('option');
              o.value = c.name; o.textContent = c.name;
              sel.appendChild(o);
            });

          _mapReady = true;
          callback();
        })
        .catch(() => {
          document.getElementById('map-svg-container').innerHTML =
            '<div style="padding:24px;font-family:Share Tech Mono,monospace;font-size:12px;color:#8a6e3a;">MAP UNAVAILABLE -- could not fetch atlas data. Check your connection.</div>';
        });
    });
  });
}

function renderMap() {
  document.getElementById('map-year-display').textContent = mapYear;
  loadMapDeps(() => {
    populateExpansionSelect();
    applyMapColors();
    renderMapLegend();
  });
}

let mapExpansionChain = null;
let _playInterval = null;

function applyMapColors() {
  if (!_mapReady) return;
  const yr = mapYear;
  const active = chains.filter(c => activeFilters.has(c.cat) && c.founded <= yr && c.end >= yr);

  // Reset all states
  d3.selectAll('.state-path').style('fill', '#e8dfc8').style('stroke', null).style('stroke-width', null);

  if (mapMode === 'hq') {
    const hqMap = {};
    active.forEach(c => {
      const s = getHqStateAt(c, yr);
      if (s) { if (!hqMap[s]) hqMap[s] = []; hqMap[s].push(c.name); }
    });
    Object.entries(hqMap).forEach(([code, names]) => {
      const a = Math.min(0.95, 0.25 + names.length * 0.09);
      d3.select('#state-' + code).style('fill', `rgba(200,148,10,${a})`);
    });
    document.getElementById('map-stats-line').textContent =
      Object.keys(hqMap).length + ' STATES WITH HQ  /  ' + active.length + ' CHAINS ACTIVE IN ' + yr;

  } else if (mapMode === 'origin') {
    const origMap = {};
    chains.forEach(c => {
      const s = getOriginState(c);
      if (s) { if (!origMap[s]) origMap[s] = []; origMap[s].push(c.name); }
    });
    Object.entries(origMap).forEach(([code, names]) => {
      const a = Math.min(0.95, 0.25 + names.length * 0.09);
      d3.select('#state-' + code).style('fill', `rgba(184,112,0,${a})`);
    });
    document.getElementById('map-stats-line').textContent =
      Object.keys(origMap).length + ' STATES  /  ' + chains.filter(c=>c.origin).length + ' CHAINS HAVE ORIGIN DATA';

  } else if (mapMode === 'chain') {
    const c = mapChain ? chains.find(ch => ch.name === mapChain) : null;
    if (c) {
      const os = getOriginState(c);
      const hs = getHqStateAt(c, yr);
      if (os) d3.select('#state-' + os).style('fill', '#c8940a');
      if (hs && hs !== os) d3.select('#state-' + hs).style('fill', '#cc4400');
      if (hs && hs === os) d3.select('#state-' + hs).style('fill', '#8a4400');
      let stat = c.name + '  /  ';
      if (os) stat += 'ORIGIN: ' + os + '  ';
      if (hs) stat += 'HQ in ' + yr + ': ' + hs;
      if (!c.hq && !c.origin) stat += '(no location data)';
      document.getElementById('map-stats-line').textContent = stat;
    } else {
      document.getElementById('map-stats-line').textContent = 'SELECT A CHAIN TO FOCUS';
    }

  } else if (mapMode === 'expansion') {
    const c = mapExpansionChain ? chains.find(ch => ch.name === mapExpansionChain) : null;
    if (c && c.stateExpansion) {
      const entered = c.stateExpansion.filter(e => e.year <= yr);
      const maxYear = Math.max(...c.stateExpansion.map(e => e.year));
      const minYear = Math.min(...c.stateExpansion.map(e => e.year));
      const span = maxYear - minYear || 1;

      entered.forEach(e => {
        const age = yr - e.year;
        // Color: recent entries bright orange, older entries darken toward brown
        const t = (e.year - minYear) / span; // 0=first state, 1=last state
        // Use a warm ramp: early=deep amber, recent=bright orange-red
        const r = Math.round(180 + t * 60);
        const g = Math.round(100 - t * 60);
        const b = 10;
        d3.select('#state-' + e.state).style('fill', `rgb(${r},${g},${b})`);
      });

      // Highlight states entered THIS year with a bright outline
      const thisYear = c.stateExpansion.filter(e => e.year === yr);
      thisYear.forEach(e => {
        d3.select('#state-' + e.state)
          .style('fill', '#ffcc00')
          .style('stroke', '#cc4400')
          .style('stroke-width', '2');
      });

      const stateCount = entered.length;
      const newThis = thisYear.length;
      let stat = c.name + '  /  ' + stateCount + ' STATES BY ' + yr;
      if (newThis) stat += '  /  NEW: ' + thisYear.map(e => e.state).join(', ');
      document.getElementById('map-stats-line').textContent = stat;
    } else if (c && !c.stateExpansion) {
      document.getElementById('map-stats-line').textContent = c.name + ' -- no state expansion data yet';
    } else {
      document.getElementById('map-stats-line').textContent = 'SELECT A CHAIN TO SEE STATE-BY-STATE EXPANSION';
    }
  }
}

function renderMapLegend() {
  const leg = document.getElementById('map-legend');
  if (mapMode === 'hq') {
    leg.innerHTML = '<div class="map-leg-item"><div class="map-leg-swatch" style="background:rgba(200,148,10,0.3)"></div>1 HQ</div><div class="map-leg-item"><div class="map-leg-swatch" style="background:rgba(200,148,10,0.65)"></div>4-5 HQs</div><div class="map-leg-item"><div class="map-leg-swatch" style="background:rgba(200,148,10,0.95)"></div>8+ HQs</div><div class="map-leg-item" style="color:#8a6e3a;font-size:9px;letter-spacing:0.05em">TAP STATE FOR DETAIL</div>';
  } else if (mapMode === 'origin') {
    leg.innerHTML = '<div class="map-leg-item"><div class="map-leg-swatch" style="background:rgba(184,112,0,0.3)"></div>1 ORIGIN</div><div class="map-leg-item"><div class="map-leg-swatch" style="background:rgba(184,112,0,0.95)"></div>8+ ORIGINS</div><div class="map-leg-item" style="color:#8a6e3a;font-size:9px;letter-spacing:0.05em">TAP STATE FOR DETAIL</div>';
  } else if (mapMode === 'chain') {
    leg.innerHTML = '<div class="map-leg-item"><div class="map-leg-swatch" style="background:#c8940a"></div>ORIGIN</div><div class="map-leg-item"><div class="map-leg-swatch" style="background:#cc4400"></div>CURRENT HQ</div><div class="map-leg-item"><div class="map-leg-swatch" style="background:#8a4400"></div>ORIGIN = HQ</div>';
  } else if (mapMode === 'expansion') {
    leg.innerHTML = '<div class="map-leg-item"><div class="map-leg-swatch" style="background:#b46410"></div>EARLIER ENTRY</div><div class="map-leg-item"><div class="map-leg-swatch" style="background:#f05010"></div>LATER ENTRY</div><div class="map-leg-item"><div class="map-leg-swatch" style="background:#ffcc00;border-color:#cc4400"></div>THIS YEAR</div><div class="map-leg-item" style="color:#8a6e3a;font-size:9px">TAP STATE FOR DETAILS</div>';
  }
}

function showStateTip(code) {
  const tip = document.getElementById('map-state-tip');
  const yr = mapYear;
  const lines = [];

  if (mapMode === 'hq') {
    const here = chains.filter(c =>
      activeFilters.has(c.cat) && c.founded <= yr && c.end >= yr &&
      getHqStateAt(c, yr) === code
    );
    lines.push('<strong>' + code + ' &mdash; HQ CHAINS IN ' + yr + '</strong>');
    if (here.length) here.forEach(c => lines.push(c.name + ' (est. ' + c.founded + ')'));
    else lines.push('no active HQs with data');
  } else if (mapMode === 'origin') {
    const here = chains.filter(c => getOriginState(c) === code);
    lines.push('<strong>' + code + ' &mdash; ORIGIN CHAINS</strong>');
    if (here.length) here.forEach(c => lines.push(c.name + ' (est. ' + c.founded + ')'));
    else lines.push('no origin data for this state');
  } else if (mapMode === 'chain') {
    const c = mapChain ? chains.find(ch => ch.name === mapChain) : null;
    if (c) {
      const os = getOriginState(c);
      const hs = getHqStateAt(c, yr);
      const roles = [];
      if (os === code) roles.push('ORIGIN');
      if (hs === code) roles.push('HQ in ' + yr);
      lines.push('<strong>' + c.name + ' &mdash; ' + code + '</strong>');
      lines.push(roles.length ? roles.join(' + ') : 'No known connection');
    } else { lines.push('Select a chain first'); }
  } else if (mapMode === 'expansion') {
    const c = mapExpansionChain ? chains.find(ch => ch.name === mapExpansionChain) : null;
    if (c && c.stateExpansion) {
      const entry = c.stateExpansion.find(e => e.state === code);
      lines.push('<strong>' + code + ' &mdash; ' + (c.name) + '</strong>');
      if (entry && entry.year <= yr) {
        lines.push('ENTERED: ' + entry.year);
        if (entry.notes) lines.push(entry.notes);
      } else if (entry) {
        lines.push('Entered ' + entry.year + ' (not yet in ' + yr + ')');
      } else {
        lines.push('No expansion data for this state');
      }
    } else {
      lines.push('Select a chain in EXPANSION mode');
    }
  }

  tip.innerHTML = lines.join('<br>');
  tip.style.display = 'block';
  clearTimeout(tip._t);
  tip._t = setTimeout(() => { tip.style.display = 'none'; }, 5000);
}

// MAP controls
document.getElementById('map-slider').addEventListener('input', e => {
  mapYear = parseInt(e.target.value);
  document.getElementById('map-year-display').textContent = mapYear;
  if (_mapPending) return;
  _mapPending = true;
  requestAnimationFrame(() => { _mapPending = false; if (_mapReady) applyMapColors(); });
});

document.querySelectorAll('.map-mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.id === 'map-play-btn') return; // handled separately
    mapMode = btn.dataset.mode;
    document.querySelectorAll('.map-mode-btn').forEach(b => {
      if (b.id !== 'map-play-btn') b.classList.toggle('active', b === btn);
    });
    document.getElementById('map-chain-select').style.display = mapMode === 'chain' ? 'inline-block' : 'none';
    document.getElementById('map-expansion-select').style.display = mapMode === 'expansion' ? 'inline-block' : 'none';
    document.getElementById('map-play-btn').style.display = mapMode === 'expansion' ? 'inline-block' : 'none';
    // Set slider to founding year of selected expansion chain when switching to expansion
    if (mapMode === 'expansion' && mapExpansionChain) {
      const c = chains.find(ch => ch.name === mapExpansionChain);
      if (c && c.stateExpansion) {
        const minYr = Math.min(...c.stateExpansion.map(e => e.year));
        mapYear = minYr;
        const slider = document.getElementById('map-slider');
        slider.value = mapYear;
        document.getElementById('map-year-display').textContent = mapYear;
      }
    }
    if (_mapReady) { applyMapColors(); renderMapLegend(); } else renderMap();
  });
});

// Populate expansion select once map loads
function populateExpansionSelect() {
  const sel = document.getElementById('map-expansion-select');
  if (sel.options.length > 1) return;
  chains.filter(c => c.stateExpansion && c.stateExpansion.length)
    .sort((a,b) => a.name.localeCompare(b.name))
    .forEach(c => {
      const o = document.createElement('option');
      o.value = c.name;
      o.textContent = c.name + ' (' + c.stateExpansion.length + ' states)';
      sel.appendChild(o);
    });
  // Default to McDonald's
  sel.value = "McDonald's";
  mapExpansionChain = "McDonald's";
}

document.getElementById('map-expansion-select').addEventListener('change', e => {
  mapExpansionChain = e.target.value || null;
  if (mapExpansionChain) {
    const c = chains.find(ch => ch.name === mapExpansionChain);
    if (c && c.stateExpansion) {
      mapYear = Math.min(...c.stateExpansion.map(e => e.year));
      const slider = document.getElementById('map-slider');
      slider.value = mapYear;
      document.getElementById('map-year-display').textContent = mapYear;
    }
  }
  if (_mapReady) { applyMapColors(); renderMapLegend(); }
});

// PLAY button -- animates the slider year forward 1 year at a time
document.getElementById('map-play-btn').addEventListener('click', () => {
  const btn = document.getElementById('map-play-btn');
  if (_playInterval) {
    clearInterval(_playInterval);
    _playInterval = null;
    btn.textContent = 'PLAY';
    return;
  }
  btn.textContent = 'STOP';
  const c = mapExpansionChain ? chains.find(ch => ch.name === mapExpansionChain) : null;
  const maxYr = c && c.stateExpansion ? Math.max(...c.stateExpansion.map(e => e.year)) + 2 : 2026;
  _playInterval = setInterval(() => {
    if (mapYear >= maxYr) {
      clearInterval(_playInterval);
      _playInterval = null;
      btn.textContent = 'PLAY';
      return;
    }
    mapYear++;
    const slider = document.getElementById('map-slider');
    slider.value = mapYear;
    document.getElementById('map-year-display').textContent = mapYear;
    if (_mapReady) applyMapColors();
  }, 180);
});

document.getElementById('map-chain-select').addEventListener('change', e => {
  mapChain = e.target.value || null;
  if (_mapReady) { applyMapColors(); renderMapLegend(); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('#map-svg-container') && !e.target.closest('#map-state-tip')) {
    document.getElementById('map-state-tip').style.display = 'none';
  }
});

// ============================================================================
// DEEP LINKING
// ============================================================================
// External apps can link directly to a chain by URL fragment.
// Example:  qsr-timeline.vercel.app/#chain/mcdonalds
// On page load, if the URL has a fragment matching a chain slug, its tooltip
// opens automatically. Users can also tap the link icon on any open tooltip
// to copy that chain's URL to clipboard.
//
// Slug rule (deterministic so external tools can construct URLs without a
// lookup): lowercase, drop apostrophes, ampersand becomes "and", any other
// non-alphanumeric becomes hyphens, collapse hyphen runs, trim ends.
// ============================================================================

function slugify(name) {
  return name.toLowerCase()
    .replace(/'/g, '')
    .replace(/&/g, 'and')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .replace(/-+/g, '-');
}

function chainBySlug(slug) {
  return chains.find(c => slugify(c.name) === slug) || null;
}

function openChainFromHash() {
  const hash = window.location.hash.slice(1);
  if (!hash.startsWith('chain/')) return;
  const slug = hash.slice(6);
  const chain = chainBySlug(slug);
  if (chain) showTip(chain, null);
}

window.addEventListener('hashchange', openChainFromHash);

document.getElementById('tip-link').addEventListener('click', e => {
  e.stopPropagation();
  const name = document.getElementById('tip-name').textContent;
  const chain = chains.find(c => c.name === name);
  if (!chain) return;
  const url = window.location.origin + window.location.pathname + '#chain/' + slugify(chain.name);
  const toast = document.getElementById('tip-copied');
  const showToast = () => {
    toast.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { toast.style.display = 'none'; }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(showToast, () => window.prompt('Copy this URL:', url));
  } else {
    window.prompt('Copy this URL:', url);
  }
});

render();
setTimeout(openChainFromHash, 50);
</script>
