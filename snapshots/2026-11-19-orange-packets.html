<style>

.sub{color:var(--muted);font-size:12px;display:flex;gap:12px;white-space:nowrap;overflow:hidden;height:16px;margin-top:4px}

nav button.on{border-color:var(--red);color:var(--red)}

main{padding:6px 10px 120px}

.row{display:flex;align-items:center;gap:10px}
.pk{width:44px;height:34px;border-radius:6px;flex:none;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);border:2px solid rgba(0,0,0,.15)}
.pk:after{content:"";position:absolute;top:3px;left:4px;right:4px;height:3px;border-top:2px dashed rgba(255,255,255,.7)}
.name{font-weight:700}
.meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:16px}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:20px}
.flav{height:34px;overflow:hidden}
.slot{min-height:78px}
.grow{flex:1;min-width:0}
.btns{display:flex;gap:6px;margin-top:8px}
button.act{flex:1;padding:10px 6px;border:none;border-radius:10px;font-weight:700;font-size:13px;color:#fff;background:var(--red)}
button.act.alt{background:var(--blue)}
button.act.ok{background:var(--green)}
button.act:disabled{background:#cfc6bb}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);width:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:#fff1c9;color:#8a6200;margin-left:4px}
.tag.hit{background:#ffe0d9;color:var(--red)}

.flav{font-size:13px;color:var(--muted);font-style:italic;margin-top:4px}
#ticker{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);padding:8px 12px;font-size:13px;max-height:96px;overflow:hidden;z-index:6}
#ticker div{padding:2px 0;color:var(--muted)}
#ticker div:first-child{color:var(--ink);font-weight:600}
.shelf{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.shelf .pk{width:34px;height:26px}
.bin{text-align:center;font-size:10px;color:var(--muted);width:52px}
input[type=range]{width:100%}
.big{font-size:20px;font-weight:800}
.pop{position:fixed;inset:0;background:rgba(43,36,32,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.pop .card{max-width:380px;text-align:center}
#evt{position:fixed;inset:0;background:rgba(255,250,240,.94);z-index:30;display:none}
#evt .box{position:absolute;left:16px;right:16px;top:150px;background:#fff;border:3px solid var(--red);border-radius:16px;padding:14px;text-align:center}
#evt .kicker{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--red)}
#evt .big{margin:6px 0}
#evt .fx{margin-top:8px;font-weight:700;color:var(--blue)}
#evtGo{position:absolute;top:18px;right:12px;padding:10px 16px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-weight:800;color:var(--ink)}
#evtBait{position:absolute;padding:10px 6px;border:none;border-radius:10px;font-weight:700;font-size:13px;color:#fff;background:var(--red);transform:translate(-50%,-50%);width:44%}
.haha{position:fixed;z-index:40;font-weight:900;color:var(--red);pointer-events:none;transform:translate(-50%,-50%);animation:up 1.4s ease-out forwards;text-align:center;font-size:18px}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-90px}}
.pk.glit{background-image:linear-gradient(115deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.9) 30%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.8) 68%,rgba(255,255,255,0) 76%)!important;background-size:250% 100%!important;animation:shine 1.6s linear infinite;box-shadow:0 0 0 2px #ffd700,inset 0 -6px 0 rgba(0,0,0,.12)}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.tag.gl{background:#fff4b8;color:#a07800}
.tag.evt{background:#dde9ff;color:var(--blue)}
</style>
</head>

const HEADS=[
 'Customer asks if the milk packet needs refrigeration. It does. It always did.',

let S;
function fresh(){const s={cash:5,fame:0,tapLv:1,lineLv:1,mkt:1,flat:.25,owned:{},lines:{},stock:{},hits:{},rd:null,camp:null,glit:{},events:[],nextEvt:75,demand:1,won:false,earned:0,start:Date.now()};
 STAPLE.forEach(id=>{s.owned[id]=1;s.lines[id]=0;s.stock[id]=0});return s}
function load(){try{const r=localStorage.getItem('packetbaron1');S=r?Object.assign(fresh(),JSON.parse(r)):fresh()}catch(e){S=fresh()}}
function save(){try{localStorage.setItem('packetbaron1',JSON.stringify(S))}catch(e){}}
load();
const $=id=>document.getElementById(id);
const byId=id=>P.find(p=>p.id===id);
function money(v){if(v>=1e6)return '$'+(v/1e6).toFixed(2)+'M';if(v>=1e4)return '$'+(v/1e3).toFixed(1)+'K';return '$'+v.toFixed(2)}
function num(v){return v>=1e4?(v/1e3).toFixed(1)+'K':Math.floor(v).toString()}
function lineCost(id){const p=byId(id);return (6+p.tier*25)*Math.pow(1.17,S.lines[id]||0)}
function tapAmt(){return 10*S.tapLv}
function lineRate(){return 3*Math.pow(1.5,S.lineLv-1)}
function ownedList(){return P.filter(p=>S.owned[p.id])}
function novelCount(){return ownedList().filter(p=>p.tier>0).length}
function galleryOpen(){return novelCount()>=3}
function variety(){return ownedList().filter(p=>(S.stock[p.id]||0)>=1).length}
function royalty(){let r=0;for(const id in S.hits){r+=S.hits[id]}return r}
function custRate(){if(!galleryOpen())return 0;const v=variety();return v*0.25*S.mkt*Math.pow(.25/S.flat,1.6)*(1+S.fame/200)}
let tab='factory',log=[],lastRate=0,acc=0,cAcc=0,hAcc=0;

function pop(t,b){$('popT').textContent=t;$('popB').textContent=b;$('pop').style.display='flex'}

function startRD(id){const p=byId(id);if(S.rd||S.cash<p.rd)return;S.cash-=p.rd;S.rd={id,left:p.t,tot:p.t};say('R and D begins on '+p.n+'. Lab coats on.');draw()}
function finishRD(){const p=byId(S.rd.id);S.owned[p.id]=1;S.lines[p.id]=0;S.stock[p.id]=0;S.rd=null;S.fame+=p.tier*5;
 const chance=0.18+p.tier*0.03;
 if(Math.random()<chance){const r=Math.round(p.tier*p.tier*4+p.tier*6);S.hits[p.id]=r;S.fame+=p.tier*15;pop('A HIT PACKET',p.n+' is the next big thing. Royalties pour in at '+money(r)+' per second.');say(p.n+' goes viral. Royalties unlocked.')}
 else say(p.n+' invented. Public response: confused.');
 if(!galleryOpen()&&novelCount()===2)say('One more invention and the Packet Gallery can open.');

function evFx(id,k){let m=1;(S.events||[]).forEach(e=>{if(e.ids.includes(id))m*=e[k]});return m}
function isGlit(id){return !!(S.glit&&S.glit[id])}

function priceOf(p){return p.price*evFx(p.id,'price')*(isGlit(p.id)?4:1)}
function glitCost(p){return Math.round(30+(p.rd||10)*0.6)}

function evOn(id){return (S.events||[]).some(e=>e.ids.includes(id))}
let lastTap={x:innerWidth/2,y:innerHeight/2};
function fireEvent(){const pool=EVENTS.filter(e=>e.ids.some(id=>S.owned[id])&&!(S.events||[]).some(x=>x.n===e.n));if(!pool.length)return;
 const e=pool[Math.floor(Math.random()*pool.length)];S.events=S.events||[];S.events.push({n:e.n,ids:e.ids,cost:e.cost,price:e.price,dem:e.dem,left:120});
 const fx=[];if(e.cost!==1)fx.push('cost x'+e.cost);if(e.price!==1)fx.push('price x'+e.price);if(e.dem!==1)fx.push('demand x'+e.dem);
 $('evtT').textContent=e.n;$('evtB').textContent=e.b;$('evtF').textContent=e.ids.filter(id=>byId(id)).map(id=>byId(id).n).join(', ')+': '+fx.join(', ')+' for 2 minutes';
 const bait=$('evtBait');bait.style.left=Math.min(innerWidth-80,Math.max(80,lastTap.x))+'px';bait.style.top=Math.max(300,Math.min(innerHeight-60,lastTap.y))+'px';
 $('evt').style.display='block';say('WORLD NEWS: '+e.n)}
function haha(x,y){const d=document.createElement('div');d.className='haha';d.style.left=x+'px';d.style.top=y+'px';d.innerHTML='hahaha<br><small>you clicked the wrong spot lol</small>';document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}
function campMult(){return S.camp?S.camp.m:1}
function demandMult(){return (S.demand||1)*campMult()*(1+S.fame/400)}
function demOf(p){return demandMult()*evFx(p.id,'dem')}
function runCamp(i){const c=CAMPS[i];if(S.camp||S.cash<c.c)return;S.cash-=c.c;S.camp={n:c.n,m:c.m,left:c.t,tot:c.t};say(c.n+' launched. Demand x'+c.m+'.');draw()}
const UP=[
 {k:'tapLv',n:'Bigger Squeezer',d:'Doubles packets per squeeze.',c:l=>25*Math.pow(6,l-1)},
 {k:'lineLv',n:'Faster Lines',d:'Every line runs 50 percent faster.',c:l=>60*Math.pow(5,l-1)},
 {k:'demand',n:'Distributor Deal',d:'Wholesale buyers take 50 percent more packets, forever.',c:l=>40*Math.pow(5,l-1)},
 {k:'mkt',n:'Gallery Billboard',d:'50 percent more Gallery customers.',c:l=>300*Math.pow(4,l-1)}
];
function buyUp(i){const u=UP[i],lv=u.k==='demand'?Math.round((S.demand-1)*2+1):S[u.k],c=u.c(lv);if(S.cash<c)return;S.cash-=c;if(u.k==='mkt'||u.k==='demand'){S[u.k]=Math.round((S[u.k]+0.5)*10)/10}else S[u.k]+=1;say(u.n+' purchased.');draw()}
function setFlat(v){S.flat=parseFloat(v);$('flatv').textContent=money(S.flat);$('custv').textContent=custRate().toFixed(2)+' customers per second'}
function reset(){if(!window.__r){window.__r=1;say('Tap Start Over again to wipe the company.');setTimeout(()=>window.__r=0,3000);return}S=fresh();save();log=[];say('A new packet empire begins.');draw()}
function pk(c,g){return '<div class="pk'+(g?' glit':'')+'" style="background-color:'+c+'"></div>'}
function draw(){
 $('cash').textContent=money(S.cash);$('rate').textContent=money(lastRate)+'/s';$('fame').textContent='Fame '+Math.floor(S.fame);$('royal').textContent='Royalties '+money(royalty())+'/s';
 $('goal').style.width=Math.min(100,S.earned/1e6*100)+'%';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('galTab').classList.toggle('lock',!galleryOpen());
 let h='';
 if(tab==='factory'){
  h+='<div class="card slot"><div class="name">Wholesale demand x'+demandMult().toFixed(2)+(S.camp?'<span class="tag hit">'+S.camp.n+'</span>':'')+'</div><div class="meta">Buyers take '+(14*demandMult()).toFixed(1)+' staples and '+(1.5*demandMult()).toFixed(1)+' novelties per second of each kind. Run campaigns in the Office.</div></div>';
  h+='<h3>Your packets</h3>';
  ownedList().forEach(p=>{const lc=lineCost(p.id);
   h+='<div class="card"><div class="row">'+pk(p.c,isGlit(p.id))+'<div class="grow"><div class="name">'+p.n+(isGlit(p.id)?'<span class="tag gl">GLITTER</span>':'')+(S.hits[p.id]?'<span class="tag hit">HIT</span>':'')+(p.tier===0?'<span class="tag">staple</span>':'')+(evOn(p.id)?'<span class="tag evt">NEWS</span>':'')+'</div><div class="meta">Stock '+num(S.stock[p.id]||0)+' . Lines '+(S.lines[p.id]||0)+' . Cost '+money(costOf(p))+' . Wholesale '+money(priceOf(p))+'</div></div></div>'+
   '<div class="btns"><button class="act" data-do="squeeze(\''+p.id+'\')">Squeeze '+tapAmt()+'</button><button class="act alt" '+(S.cash<lc?'disabled':'')+' data-do="buyLine(\''+p.id+'\')">Line '+money(lc)+'</button><button class="act ok" '+(isGlit(p.id)||S.cash<glitCost(p)?'disabled':'')+' data-do="glitter(\''+p.id+'\')">'+(isGlit(p.id)?'Glittered':'Glitter '+money(glitCost(p)))+'</button></div></div>'});
  h+='<div class="flav" style="padding:4px">Wholesale buyers take staples fast and novelties slowly. Margins are thin. That is the whole point.</div>';
 }
 if(tab==='lab'){
  if(S.rd){const p=byId(S.rd.id);h+='<div class="card slot"><div class="row">'+pk(p.c)+'<div class="grow"><div class="name">Researching '+p.n+'</div><div class="meta">'+Math.ceil(S.rd.left)+'s left</div><div class="bar"><i style="width:'+(100-S.rd.left/S.rd.tot*100)+'%"></i></div></div></div></div>'}
  else h+='<div class="card slot"><div class="name">Lab is idle</div><div class="meta">Pick a packet below to invent.</div><div class="bar"><i></i></div></div>';
  h+='<h3>Next big packet</h3>';
  const avail=P.filter(p=>p.tier>0&&!S.owned[p.id]);
  avail.slice(0,5).forEach(p=>{const ok=!p.req||p.req.every(r=>S.owned[r]);
   h+='<div class="card"><div class="row">'+pk(ok?p.c:'#ddd')+'<div class="grow"><div class="name">'+p.n+'</div><div class="meta">'+money(p.rd)+' . '+p.t+'s . absurdity '+p.tier+'</div><div class="flav">'+(ok?p.f:'Needs '+p.req.map(r=>byId(r).n).join(' and ')+' first.')+'</div></div></div>'+
   '<div class="btns"><button class="act ok" '+(!ok||S.rd||S.cash<p.rd?'disabled':'')+' data-do="startRD(\''+p.id+'\')">Invent</button></div></div>'});
  if(!avail.length)h+='<div class="card">Every packet that should not exist now exists.</div>';
 }
 if(tab==='gallery'){
  if(!galleryOpen())h+='<div class="card">Invent 3 new packets to open the Packet Gallery.</div>';
  else{h+='<div class="card"><div class="name">Flat price, any packet</div><div class="big" id="flatv">'+money(S.flat)+'</div><input type="range" min="0.05" max="3" step="0.05" value="'+S.flat+'" oninput="setFlat(this.value)"><div class="meta" id="custv">'+custRate().toFixed(2)+' customers per second</div><div class="flav">Each customer grabs a handful of 10 to 40 packets, any mix, one price each. More kinds stocked means more customers.</div></div>';
   h+='<div class="card"><div class="name">On the shelf: '+variety()+' kinds</div><div class="shelf">'+ownedList().map(p=>'<div class="bin">'+pk((S.stock[p.id]||0)>=1?p.c:'#eee',isGlit(p.id))+num(S.stock[p.id]||0)+'</div>').join('')+'</div></div>';}
 }
 if(tab==='office'){
  h+='<h3>Marketing campaigns</h3>';
  if(!S.camp)h+='<div class="card slot"><div class="name">No campaign running</div><div class="meta">Demand at normal levels.</div><div class="bar"><i></i></div></div>';
  if(S.camp)h+='<div class="card slot"><div class="name">'+S.camp.n+' running<span class="tag hit">demand x'+S.camp.m+'</span></div><div class="meta">'+Math.ceil(S.camp.left)+'s left</div><div class="bar"><i style="width:'+(100-S.camp.left/S.camp.tot*100)+'%"></i></div></div>';
  CAMPS.forEach((c,i)=>{h+='<div class="card"><div class="name">'+c.n+'<span class="tag">x'+c.m+' for '+c.t+'s</span></div><div class="flav">'+c.f+'</div><div class="btns"><button class="act ok" '+(S.camp||S.cash<c.c?'disabled':'')+' data-do="runCamp('+i+')">Launch '+money(c.c)+'</button></div></div>'});
  h+='<h3>Upgrades</h3>';
  UP.forEach((u,i)=>{const lv=u.k==='demand'?Math.round((S.demand-1)*2+1):S[u.k];const c=u.c(lv);h+='<div class="card"><div class="name">'+u.n+'<span class="tag">lv '+lv+'</span></div><div class="meta">'+u.d+'</div><div class="btns"><button class="act alt" '+(S.cash<c?'disabled':'')+' data-do="buyUp('+i+')">'+money(c)+'</button></div></div>'});
  h+='<h3>The dream</h3><div class="card"><div class="name">Become the next ketchup guy</div><div class="meta">Lifetime earnings '+money(S.earned)+' of $1.00M</div><div class="flav">Packets invented: '+novelCount()+' of '+(P.length-4)+'. Hit packets: '+Object.keys(S.hits).length+'.</div></div>';
  h+='<div class="btns"><button class="act" data-do="reset()">Start Over</button></div>';
 }
 $('main').innerHTML=h;
}
$('evtGo').addEventListener('pointerdown',e=>{e.preventDefault();$('evt').style.display='none';draw()});
$('evtBait').addEventListener('pointerdown',e=>{e.preventDefault();haha(e.clientX,e.clientY)});
$('evt').addEventListener('pointerdown',e=>{if(e.target.id==='evt'||e.target.closest('.box'))e.preventDefault()});
$('main').addEventListener('pointerdown',e=>{lastTap={x:e.clientX,y:e.clientY};const b=e.target.closest('button[data-do]');if(!b||b.disabled)return;e.preventDefault();new Function(b.dataset.do)()});
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.t==='gallery'&&!galleryOpen()){say('Gallery opens after 3 inventions.');return}tab=b.dataset.t;draw();window.scrollTo(0,0)});
let before=S.cash,secAcc=0,earnSec=0;
function tick(dt){
 let gain=0;
 ownedList().forEach(p=>{const n=(S.lines[p.id]||0)*lineRate()*dt;const c=n*costOf(p);if(S.cash>=c){S.cash-=c;gain-=c;S.stock[p.id]=(S.stock[p.id]||0)+n}
  const cap=(p.tier===0?14:1.5)*dt*demOf(p);const sold=Math.min(S.stock[p.id]||0,cap);S.stock[p.id]-=sold;const r=sold*priceOf(p);S.cash+=r;gain+=r;S.earned+=r});
 if(galleryOpen()){cAcc+=custRate()*dt;while(cAcc>=1){cAcc-=1;const shelf=ownedList().filter(p=>(S.stock[p.id]||0)>=1);if(!shelf.length)break;let want=10+Math.floor(Math.random()*31),got=0;
  for(let i=0;i<want;i++){const p=shelf[Math.floor(Math.random()*shelf.length)];if(S.stock[p.id]>=1){S.stock[p.id]-=1;got++}}
  const r=got*S.flat;S.cash+=r;gain+=r;S.earned+=r;S.fame+=got*0.002}}
 const roy=royalty()*dt;S.cash+=roy;gain+=roy;S.earned+=roy;
 S.events=(S.events||[]).filter(e=>{e.left-=dt;if(e.left<=0){say(e.n+' is old news. Market back to normal.');return false}return true});
 if($('evt').style.display!=='block'){S.nextEvt=(S.nextEvt==null?75:S.nextEvt)-dt;if(S.nextEvt<=0){S.nextEvt=70+Math.random()*80;fireEvent()}}
 if(S.camp){S.camp.left-=dt;if(S.camp.left<=0){say(S.camp.n+' wrapped up. Demand back to normal.');S.camp=null}}
 if(S.rd){S.rd.left-=dt;if(S.rd.left<=0)finishRD()}
 secAcc+=dt;earnSec+=gain;if(secAcc>=1){lastRate=earnSec/secAcc;secAcc=0;earnSec=0}
 hAcc+=dt;if(hAcc>22){hAcc=0;if(novelCount()>0)say(HEADS[Math.floor(Math.random()*HEADS.length)])}
 if(!S.won&&S.earned>=1e6){S.won=true;pop('YOU ARE THE KETCHUP GUY NOW','One million dollars from packets that never should have existed. Keep inventing.')}
}
let last=performance.now(),dAcc=0,sAcc=0;
function loop(now){const dt=Math.min(1,(now-last)/1000);last=now;tick(dt);dAcc+=dt;sAcc+=dt;
 if(dAcc>.5){dAcc=0;const ae=document.activeElement;if(!(ae&&ae.type==='range'))draw();else{$('cash').textContent=money(S.cash)}}
 if(sAcc>5){sAcc=0;save()}requestAnimationFrame(loop)}
say('You make ketchup, mustard, mayo and soy sauce. The margins are terrible.');
draw();requestAnimationFrame(loop);
</script>
</body>
</html>
