<!DOCTYPE html>
<!-- Source device: Blue Phone (Termux/Android). Blue accent palette, light theme only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hackercons Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f0e6;
    --panel:#fffdf8;
    --ink:#1a1a1a;
    --muted:#6f6857;
    --accent:#2563eb;
    --accent-dark:#1f5fd0;
    --accent-soft:#9bb8f2;
    --track:#e7e0d1;
    --line:#ddd4c2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    -webkit-font-smoothing:antialiased;
    padding:16px;
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:640px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
  h1{
    font-family:'Bebas Neue',Impact,sans-serif;
    font-weight:400;
    font-size:40px;
    letter-spacing:2px;
    margin:0;
    color:var(--accent);
    line-height:.9;
  }
  .sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;white-space:nowrap}
  .stage{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border:2px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .stage video{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:contain;
    background:#000;
    transition:opacity .25s ease;
  }
  .stage video.standby{opacity:0;pointer-events:none}
  .overlay{
    position:absolute;inset:0;
    display:none;
    align-items:center;justify-content:center;
    text-align:center;
    color:#fff;
    font-size:13px;
    letter-spacing:.5px;
    padding:24px;
    background:rgba(0,0,0,.55);
    cursor:pointer;
  }
  .overlay.show{display:flex}
  .controls{display:flex;gap:8px;margin-top:12px}
  button{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:14px 8px;
    border-radius:8px;
    border:2px solid var(--accent);
    cursor:pointer;
    flex:1;
  }
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:active{background:var(--accent-dark)}
  .btn-ghost{background:var(--panel);color:var(--accent)}
  .btn-ghost:active{background:#eef3ff}
  button:disabled{opacity:.4;cursor:not-allowed}
  .bars{margin-top:14px}
  .barrow{margin-bottom:10px}
  .barlabel{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
  .track{height:8px;background:var(--track);border-radius:6px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--accent);transition:width .12s linear}
  .fill.buffer{background:var(--accent-soft)}
  .info{
    margin-top:14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
  }
  .title-now{font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:1px;line-height:1.05;margin:0 0 10px;color:var(--ink)}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13px}
  .meta .k{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
  .meta b{font-weight:600;word-break:break-word}
  .status{margin-top:12px;font-size:11px;color:var(--muted);min-height:14px}
  footer{margin-top:14px;font-size:10px;color:var(--muted);text-align:center;letter-spacing:.5px}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Hackercons<br>Roulette</h1>
      <div class="sub">Blue Phone</div>
    </header>

    <div class="stage" id="stage">
      <video id="v0" playsinline preload="auto"></video>
      <video id="v1" playsinline preload="auto" class="standby"></video>
      <div class="overlay" id="overlay"><div id="overlayText">Loading collection</div></div>
    </div>

    <div class="controls">
      <button class="btn-primary" id="playBtn" disabled>Loading</button>
      <button class="btn-ghost" id="skipBtn" disabled>Skip</button>
      <button class="btn-ghost" id="pauseBtn" disabled>Pause</button>
    </div>

    <div class="bars">
      <div class="barrow">
        <div class="barlabel"><span>Clip</span><span id="clipTime">0 / 30s</span></div>
        <div class="track"><div class="fill" id="clipFill"></div></div>
      </div>
      <div class="barrow">
        <div class="barlabel"><span>Standby buffer</span><span id="bufPct">0%</span></div>
        <div class="track"><div class="fill buffer" id="bufFill"></div></div>
      </div>
    </div>

    <div class="info">
      <div class="title-now" id="nowTitle">Ready when you are</div>
      <div class="meta">
        <div><span class="k">Source</span><b id="mId">-</b></div>
        <div><span class="k">Clip start</span><b id="mStart">-</b></div>
        <div><span class="k">Talk length</span><b id="mDur">-</b></div>
        <div><span class="k">Clips played</span><b id="mCount">0</b></div>
      </div>
      <div class="status" id="status">Loading the hackercons collection.</div>
    </div>

    <footer>Source: archive.org / hackercons collection</footer>
  </div>

<script>
(function(){
  'use strict';

  var SEARCH = 'https://archive.org/advancedsearch.php?q=collection%3Ahackercons+AND+mediatype%3Amovies&fl[]=identifier&fl[]=title&rows=400&page=1&output=json';
  var META = 'https://archive.org/metadata/';
  var DL = 'https://archive.org/download/';
  var CLIP_MS = 30000;
  var MIN_SIZE = 15000000;

  var pool = [];     // {identifier, title}
  var ring = [];     // recently played identifiers
  var ringMax = 15;

  var slots = [
    { vid:document.getElementById('v0'), id:null, title:'', file:'', start:0, dur:0, ready:false },
    { vid:document.getElementById('v1'), id:null, title:'', file:'', start:0, dur:0, ready:false }
  ];
  var active = 0;
  var clipCount = 0;
  var waiting = false;
  var started = false;
  var paused = false;

  var clipStartT = 0;
  var pausedElapsed = 0;
  var ticker = null;

  var elOverlay = document.getElementById('overlay');
  var elOverlayText = document.getElementById('overlayText');
  var elPlay = document.getElementById('playBtn');
  var elSkip = document.getElementById('skipBtn');
  var elPause = document.getElementById('pauseBtn');
  var elClipFill = document.getElementById('clipFill');
  var elClipTime = document.getElementById('clipTime');
  var elBufFill = document.getElementById('bufFill');
  var elBufPct = document.getElementById('bufPct');
  var elNowTitle = document.getElementById('nowTitle');
  var elMId = document.getElementById('mId');
  var elMStart = document.getElementById('mStart');
  var elMDur = document.getElementById('mDur');
  var elMCount = document.getElementById('mCount');
  var elStatus = document.getElementById('status');

  function status(t){ elStatus.textContent = t; }
  function overlay(t){
    if(t){ elOverlayText.textContent = t; elOverlay.classList.add('show'); }
    else { elOverlay.classList.remove('show'); }
  }

  function randInt(max){
    if(max <= 0) return 0;
    var b = new Uint32Array(1);
    crypto.getRandomValues(b);
    return b[0] % max;
  }

  function fmt(sec){
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return m + ':' + (s<10?'0':'') + s;
  }

  function loadPool(){
    overlay('Loading collection');
    status('Discovering talks in the hackercons collection.');
    return fetch(SEARCH)
      .then(function(r){ return r.json(); })
      .then(function(j){
        var docs = (j && j.response && j.response.docs) || [];
        pool = docs.map(function(d){ return { identifier:d.identifier, title:d.title || d.identifier }; });
        if(!pool.length) throw new Error('no items returned');
        ringMax = Math.min(15, Math.max(3, Math.floor(pool.length * 0.2)));
        status(pool.length + ' talks found. Tap Play.');
        overlay(null);
        elPlay.disabled = false;
        elPlay.textContent = 'Play';
      });
  }

  function pickItem(){
    if(!pool.length) return null;
    var avail = pool.filter(function(p){ return ring.indexOf(p.identifier) === -1; });
    while(!avail.length && ring.length){
      ring.shift();
      avail = pool.filter(function(p){ return ring.indexOf(p.identifier) === -1; });
    }
    if(!avail.length) avail = pool;
    return avail[randInt(avail.length)];
  }

  function pushRing(id){
    ring.push(id);
    while(ring.length > ringMax) ring.shift();
  }

  function dropFromPool(id){
    pool = pool.filter(function(p){ return p.identifier !== id; });
  }

  function resolveMp4(identifier){
    return fetch(META + identifier)
      .then(function(r){ return r.json(); })
      .then(function(j){
        var files = (j && j.files) || [];
        var best = null;
        for(var i=0;i<files.length;i++){
          var f = files[i];
          var name = f.name || '';
          if(!/\.mp4$/i.test(name)) continue;
          var size = Number(f.size || 0);
          if(size <= MIN_SIZE) continue;
          if(!best || size > Number(best.size || 0)) best = f;
        }
        return best ? best.name : null;
      });
  }

  function loadIntoSlot(idx, attempt, onReady){
    attempt = attempt || 0;
    var slot = slots[idx];
    slot.ready = false;
    slot.id = null;

    if(attempt > 8){ status('Trouble finding a playable talk. Tap Skip to retry.'); return; }

    var item = pickItem();
    if(!item){ status('Pool is empty.'); return; }

    resolveMp4(item.identifier).then(function(file){
      if(!file){
        dropFromPool(item.identifier);
        return loadIntoSlot(idx, attempt+1, onReady);
      }

      slot.id = item.identifier;
      slot.title = item.title;
      slot.file = file;

      var v = slot.vid;
      v.oncanplay = null; v.onseeked = null; v.onerror = null;

      var seekRequested = false;
      var seekDone = false;

      var watchdog = setTimeout(function(){
        if(!seekDone){
          v.onerror = null;
          dropFromPool(item.identifier);
          loadIntoSlot(idx, attempt+1, onReady);
        }
      }, 12000);

      v.onerror = function(){
        clearTimeout(watchdog);
        dropFromPool(item.identifier);
        loadIntoSlot(idx, attempt+1, onReady);
      };

      v.oncanplay = function(){
        if(seekRequested || seekDone) return;
        seekRequested = true;
        var d = v.duration;
        if(!isFinite(d) || d < 45){
          slot.dur = isFinite(d) ? d : 0;
          slot.start = 10;
        } else {
          slot.dur = d;
          var hi = Math.floor(d - 35);
          slot.start = 10 + randInt(Math.max(1, hi - 10));
        }
        try { v.currentTime = slot.start; } catch(e){}
      };

      v.onseeked = function(){
        if(seekDone) return;
        seekDone = true;
        clearTimeout(watchdog);
        slot.ready = true;
        if(onReady){ onReady(); return; }
        if(idx !== active && waiting) doSwap();
      };

      v.src = DL + item.identifier + '/' + encodeURIComponent(file);
      v.load();
    }).catch(function(){
      dropFromPool(item.identifier);
      loadIntoSlot(idx, attempt+1, onReady);
    });
  }

  function playActive(){
    var v = slots[active].vid;
    var pr = v.play();
    if(pr && pr.catch){
      pr.catch(function(){
        overlay('Tap to start');
        var onTap = function(){
          elOverlay.removeEventListener('click', onTap);
          slots[active].vid.play();
          overlay(null);
        };
        elOverlay.addEventListener('click', onTap);
      });
    }
  }

  function startTimer(){
    clipStartT = performance.now();
    pausedElapsed = 0;
    paused = false;
    elPause.textContent = 'Pause';
    if(ticker) clearInterval(ticker);
    ticker = setInterval(tick, 100);
  }

  function tick(){
    if(paused) return;
    var elapsed = performance.now() - clipStartT;
    if(elapsed > CLIP_MS) elapsed = CLIP_MS;
    elClipFill.style.width = ((elapsed / CLIP_MS) * 100).toFixed(1) + '%';
    elClipTime.textContent = Math.floor(elapsed/1000) + ' / 30s';
    if(elapsed >= CLIP_MS) advance();
  }

  function advance(){
    var standby = slots[active === 0 ? 1 : 0];
    if(standby.ready){
      doSwap();
    } else if(!waiting){
      waiting = true;
      overlay('Buffering next clip');
      status('Waiting for the standby buffer.');
    }
  }

  function doSwap(){
    var prev = active;
    active = active === 0 ? 1 : 0;
    waiting = false;

    var a = slots[active], p = slots[prev];
    a.vid.classList.remove('standby');
    p.vid.classList.add('standby');
    p.vid.pause();

    overlay(null);
    pushRing(a.id);
    clipCount++;
    updateNowPlaying();
    startTimer();
    playActive();

    loadIntoSlot(prev);
  }

  function skip(){
    if(!started) return;
    var standbyIdx = active === 0 ? 1 : 0;
    slots[standbyIdx].ready = false;
    slots[standbyIdx].vid.pause();
    overlay('Loading a fresh clip');
    status('Skip: loading a different talk.');
    elClipFill.style.width = '100%';
    waiting = true;
    loadIntoSlot(standbyIdx);
  }

  function togglePause(){
    if(!started) return;
    if(!paused){
      paused = true;
      pausedElapsed = performance.now() - clipStartT;
      slots[active].vid.pause();
      elPause.textContent = 'Resume';
      status('Paused.');
    } else {
      paused = false;
      clipStartT = performance.now() - pausedElapsed;
      slots[active].vid.play();
      elPause.textContent = 'Pause';
      status('Playing.');
    }
  }

  function updateNowPlaying(){
    var a = slots[active];
    elNowTitle.textContent = a.title || a.id || '-';
    elMId.textContent = a.id || '-';
    elMStart.textContent = fmt(a.start);
    elMDur.textContent = a.dur ? fmt(a.dur) : 'unknown';
    elMCount.textContent = String(clipCount);
  }

  function updateBuffer(){
    if(!started){ elBufFill.style.width = '0%'; elBufPct.textContent = '0%'; return; }
    var s = slots[active === 0 ? 1 : 0];
    var v = s.vid, need = 30, got = 0;
    try{
      var b = v.buffered;
      for(var i=0;i<b.length;i++){
        var lo = Math.max(b.start(i), s.start);
        var hi = Math.min(b.end(i), s.start + need);
        if(hi > lo) got += hi - lo;
      }
    }catch(e){}
    var pct = Math.min(100, (got / need) * 100);
    if(s.ready && pct < 2) pct = 100;
    elBufFill.style.width = pct.toFixed(0) + '%';
    elBufPct.textContent = pct.toFixed(0) + '%';
  }

  function start(){
    if(started){ skip(); return; }
    elPlay.disabled = true;
    overlay('Loading first talk');
    status('Loading the first talk.');
    loadIntoSlot(active, 0, function(){
      started = true;
      elPlay.disabled = false;
      elPlay.textContent = 'New Clip';
      elSkip.disabled = false;
      elPause.disabled = false;
      overlay(null);
      clipCount++;
      updateNowPlaying();
      startTimer();
      playActive();
      loadIntoSlot(active === 0 ? 1 : 0);
    });
  }

  elPlay.addEventListener('click', start);
  elSkip.addEventListener('click', skip);
  elPause.addEventListener('click', togglePause);
  setInterval(updateBuffer, 400);

  loadPool().catch(function(e){
    overlay('Could not reach archive.org. Serve over https such as Vercel, then reload.');
    status('Collection load failed: ' + (e && e.message ? e.message : 'unknown') + '. This will not work from a file path, only from https.');
  });
})();
</script>
</body>
</html>
