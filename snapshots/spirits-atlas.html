<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SPIRITS ATLAS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#060e1f; --surface:#0d1730; --border:#2a3a5c;
  --beer:#ffaa00; --wine:#d966ff; --whiskey:#ff8855; --gin:#44ff77;
  --vodka:#22e5ff; --rum:#ff3d6b; --tequila:#ffe844; --other:#6a80a0;
  --text:#d8eaff; --dim:#6a80a0; --accent:#22e5ff;
  --origin:#ff8855; --dist:#3399ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;display:flex;flex-direction:column;}

header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;gap:6px;}
.logo{font-family:'Orbitron',monospace;font-weight:900;font-size:13px;letter-spacing:4px;color:var(--accent);text-shadow:0 0 16px var(--accent),0 0 30px rgba(34,229,255,0.3);white-space:nowrap;}
.logo span{color:#fff;}
.stat-pills{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.pill{font-size:8px;padding:2px 6px;border-radius:3px;border:1px solid;letter-spacing:1px;white-space:nowrap;}

.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
.tab{flex:1;padding:8px 0;text-align:center;font-size:9px;letter-spacing:1px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;text-transform:uppercase;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);text-shadow:0 0 8px var(--accent);}

.view{display:none;flex:1;overflow:hidden;flex-direction:column;}
.view.active{display:flex;}

#globe-view{position:relative;}
#globe-container{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
#globe-container svg{cursor:grab;touch-action:none;}
#globe-container svg:active{cursor:grabbing;}

.legend{position:absolute;bottom:10px;left:8px;background:rgba(6,14,31,0.93);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:8px;letter-spacing:1px;backdrop-filter:blur(4px);}
.legend-title{color:var(--dim);margin-bottom:6px;font-size:7px;letter-spacing:2px;}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.legend-label{color:var(--text);font-size:7px;}

.search-panel{position:absolute;top:8px;right:8px;background:rgba(6,14,31,0.95);border:1px solid var(--border);border-radius:6px;padding:9px 10px;font-size:8px;letter-spacing:1px;backdrop-filter:blur(4px);width:min(220px,58vw);z-index:50;}
.search-panel-label{color:var(--dim);font-size:7px;letter-spacing:2px;margin-bottom:5px;}
.search-panel input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:10px;padding:6px 8px;outline:none;letter-spacing:1px;}
.search-panel input:focus{border-color:var(--accent);box-shadow:0 0 8px rgba(34,229,255,0.25);}
.search-panel input::placeholder{color:var(--dim);}
.search-results{margin-top:6px;max-height:160px;overflow-y:auto;}
.sr-item{font-size:8px;padding:4px 6px;border-radius:3px;cursor:pointer;border-left:2px solid transparent;margin-bottom:2px;color:var(--dim);}
.sr-item:hover{background:rgba(34,229,255,0.07);color:var(--text);}
.sr-item.selected{color:var(--accent);border-left-color:var(--accent);background:rgba(34,229,255,0.06);}
.sr-name{font-size:8px;color:var(--text);}
.sr-sub{font-size:7px;color:var(--dim);}

#tooltip{position:absolute;background:rgba(6,14,31,0.97);border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:9px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:100;max-width:200px;backdrop-filter:blur(8px);}
#tooltip.show{opacity:1;}
.tt-country{font-family:'Orbitron',monospace;font-size:11px;color:#fff;margin-bottom:5px;font-weight:700;}
.tt-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:2px;}
.tt-key{color:var(--dim);font-size:8px;}
.tt-val{color:var(--text);text-align:right;font-size:8px;}
.tt-cats{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
.tt-cat{font-size:7px;padding:2px 4px;border-radius:2px;border:1px solid;letter-spacing:1px;}

#detail-panel{position:absolute;top:0;right:-100%;width:min(290px,92vw);height:100%;background:var(--surface);border-left:1px solid var(--border);transition:right .3s ease;z-index:200;overflow-y:auto;padding:14px 12px;}
#detail-panel.open{right:0;}
#panel-backdrop{position:absolute;top:0;left:0;right:0;bottom:0;z-index:199;display:none;}
#panel-backdrop.show{display:block;}
.panel-close{position:absolute;top:10px;right:10px;background:none;border:1px solid var(--border);color:var(--dim);cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:11px;padding:3px 8px;border-radius:3px;}
.panel-close:hover{color:var(--text);border-color:var(--text);}
.panel-country{font-family:'Orbitron',monospace;font-weight:900;font-size:13px;color:#fff;margin-bottom:3px;padding-right:36px;line-height:1.3;}
.panel-count{color:var(--dim);font-size:9px;letter-spacing:2px;margin-bottom:12px;}
.spirit-card{background:rgba(0,0,0,0.35);border:1px solid var(--border);border-left:3px solid;border-radius:4px;padding:8px 10px;margin-bottom:8px;}
.sc-name{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;color:#fff;margin-bottom:3px;}
.sc-sub{color:var(--accent);font-size:8px;letter-spacing:1px;margin-bottom:5px;}
.sc-meta{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px;}
.sc-tag{font-size:7px;padding:2px 4px;border-radius:2px;border:1px solid var(--border);color:var(--dim);letter-spacing:1px;}
.sc-desc{font-size:8px;color:#99b0cc;line-height:1.5;}
.sc-origin{font-size:7px;color:var(--origin);margin-top:4px;}
.panel-section{font-size:8px;letter-spacing:2px;color:var(--dim);margin:12px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px;}
.dist-tag{display:inline-block;font-size:7px;padding:2px 5px;border-radius:2px;border:1px solid #3399ff44;color:#3399ff;margin:2px 2px 2px 0;letter-spacing:1px;}

#list-view{flex-direction:column;}
.search-bar{padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.search-bar input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:11px;padding:7px 11px;outline:none;letter-spacing:1px;}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 8px rgba(34,229,255,0.25);}
.search-bar input::placeholder{color:var(--dim);}
.filter-row{display:flex;gap:5px;padding:7px 12px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;}
.filter-btn{font-size:7px;padding:3px 7px;border-radius:3px;border:1px solid;cursor:pointer;white-space:nowrap;letter-spacing:1px;background:none;font-family:'Share Tech Mono',monospace;transition:all .15s;opacity:0.45;}
.filter-btn.active{opacity:1;}
#list-container{flex:1;overflow-y:auto;padding:8px 12px;}
.list-item{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-left:3px solid;border-radius:4px;padding:8px 10px;margin-bottom:7px;cursor:pointer;transition:background .15s;}
.list-item:hover{background:rgba(34,229,255,0.06);}
.li-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:3px;}
.li-name{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;color:#fff;}
.li-abv{font-size:8px;color:var(--dim);white-space:nowrap;}
.li-producer{font-size:8px;color:var(--accent);margin-bottom:3px;}
.li-origin{font-size:7px;color:var(--dim);}
.li-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px;}

@keyframes pulse{0%{r:4;opacity:.9;}70%{r:11;opacity:0;}100%{r:4;opacity:0;}}
.pulse-ring{animation:pulse 2.2s infinite;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
body::after{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.02) 2px,rgba(0,0,0,0.02) 4px);pointer-events:none;z-index:9999;}
.globe-hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:7px;color:var(--dim);letter-spacing:2px;pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>
<header>
  <div class="logo">SPIRITS<span>ATLAS</span></div>
  <div class="stat-pills" id="stat-pills"></div>
</header>
<div class="tabs">
  <div class="tab active" data-view="globe-view">◉ GLOBE</div>
  <div class="tab" data-view="list-view">≡ CATALOG</div>
</div>

<!-- ═══ GLOBE VIEW ═══ -->
<div id="globe-view" class="view active">
  <div id="globe-container">
    <div class="globe-hint">DRAG TO ROTATE · TAP COUNTRY FOR SPIRITS</div>
    <svg id="globe"></svg>

    <div class="search-panel">
      <div class="search-panel-label">SEARCH SPIRITS</div>
      <input type="text" id="globe-search" placeholder="BEER, WINE, WHISKEY...">
      <div class="search-results" id="globe-search-results"></div>
    </div>

    <div class="legend" id="legend-box">
      <div class="legend-title">SPIRIT TYPE</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--beer)"></div><div class="legend-label">BEER / ALE</div></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--wine)"></div><div class="legend-label">WINE</div></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--whiskey)"></div><div class="legend-label">WHISKEY / BOURBON</div></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--gin)"></div><div class="legend-label">GIN</div></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--vodka)"></div><div class="legend-label">VODKA</div></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--rum)"></div><div class="legend-label">RUM</div></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--tequila)"></div><div class="legend-label">TEQUILA / MEZCAL</div></div>
      <div id="legend-extras">
        <div class="legend-item"><div class="legend-dot" style="background:var(--dist)"></div><div class="legend-label">DISTRIBUTION COUNTRY</div></div>
      </div>
    </div>

    <div id="tooltip">
      <div class="tt-country" id="tt-country"></div>
      <div class="tt-row"><span class="tt-key">ORIGIN SPIRITS</span><span class="tt-val" id="tt-count"></span></div>
      <div class="tt-row"><span class="tt-key">ALSO DISTRIBUTES</span><span class="tt-val" id="tt-level"></span></div>
      <div class="tt-cats" id="tt-cats"></div>
    </div>
  </div>

  <div id="panel-backdrop"></div>
  <div id="detail-panel">
    <button class="panel-close" id="panel-close">✕</button>
    <div class="panel-country" id="panel-country"></div>
    <div class="panel-count" id="panel-count"></div>
    <div id="panel-incidents"></div>
  </div>
</div>

<!-- ═══ LIST VIEW ═══ -->
<div id="list-view" class="view">
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="SEARCH NAME, PRODUCER, COUNTRY...">
  </div>
  <div class="filter-row" id="filter-row"></div>
  <div id="list-container"></div>
</div>

// HELPERS
// ═══════════════════════════════════════════════════════════════════
function getFiltered() {
  return SPIRITS.filter(s => {
    if(activeCategory && s.type !== activeCategory) return false;
    if(searchQuery) {
      const q = searchQuery.toLowerCase();
      return s.name.toLowerCase().includes(q) || s.producer.toLowerCase().includes(q) ||
        s.origin.toLowerCase().includes(q) || s.type.toLowerCase().includes(q) ||
        s.desc.toLowerCase().includes(q);
    }
    return true;
  });
}

function getOriginSpirits(country) {
  return SPIRITS.filter(s => s.origin === country);
}

function getDistSpirits(country) {
  return SPIRITS.filter(s => s.distribution && s.distribution.includes(country) && s.origin !== country);
}

function getDominantType(spirits) {
  if(!spirits.length) return null;
  const c = {};
  spirits.forEach(s => c[s.type] = (c[s.type]||0)+1);
  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];
}

function getGlobeCountryFill(numId) {
  const country = NUM_TO_COUNTRY[numId];
  if(!country) return null;
  if(selectedSpirit) {
    const s = selectedSpirit;
    if(s.origin === country) return { color: TYPE_COLOR[s.type], opacity: 0.9, isOrigin: true, isDist: false };
    if(s.distribution && s.distribution.includes(country)) return { color: '#3399ff', opacity: 0.6, isOrigin: false, isDist: true };
    return { color: '#1a3055', opacity: 0.7, isOrigin: false, isDist: false };
  }
  const originSpirits = getOriginSpirits(country);
  if(originSpirits.length) {
    const dom = getDominantType(originSpirits);
    return { color: TYPE_COLOR[dom], opacity: 0.5 + (originSpirits.length/20)*0.4, isOrigin: true, isDist: false };
  }
  return null;
}

function renderStats() {
  const f = getFiltered();
  const origins = new Set(f.map(s => s.origin)).size;
  document.getElementById('stat-pills').innerHTML = `
    <div class="pill" style="color:#22e5ff;border-color:#22e5ff33">${f.length} SPIRITS</div>
    <div class="pill" style="color:#d966ff;border-color:#d966ff33">${origins} ORIGIN NATIONS</div>
    ${selectedSpirit ? `<div class="pill" style="color:${TYPE_COLOR[selectedSpirit.type]};border-color:${TYPE_COLOR[selectedSpirit.type]}44">◉ ${selectedSpirit.name.toUpperCase()}</div>` : ''}
  `;
}

function buildSpiritPanel(spirit) {
  const distList = spirit.distribution || [];
  const html = `
    <div class="spirit-card" style="border-left-color:${TYPE_COLOR[spirit.type]}">
      <div class="sc-name">${spirit.name}</div>
      <div class="sc-sub">${spirit.producer}</div>
      <div class="sc-meta">
        <span class="sc-tag" style="border-color:${TYPE_COLOR[spirit.type]}55;color:${TYPE_COLOR[spirit.type]}">${TYPE_LABEL[spirit.type]}</span>
        <span class="sc-tag">ABV ${spirit.abv}</span>
        <span class="sc-tag">EST. ${spirit.founded}</span>
      </div>
      <div class="sc-desc">${spirit.desc}</div>
      <div class="sc-origin">⊕ ORIGIN: ${spirit.origin.toUpperCase()}</div>
    </div>
    <div class="panel-section">DISTRIBUTED IN ${distList.length} COUNTRIES</div>
    <div style="padding:0 2px">${distList.map(c => `<span class="dist-tag">${c.toUpperCase()}</span>`).join('')}</div>
  `;
  openPanel(spirit.name.toUpperCase(), `${TYPE_LABEL[spirit.type]} · ${spirit.origin.toUpperCase()}`, html);
}

function buildCountryPanel(country) {
  const originSpirits = getOriginSpirits(country);
  const distSpirits = getDistSpirits(country);
  let html = '';
  if(originSpirits.length) {
    html += `<div class="panel-section">ORIGINATING HERE (${originSpirits.length})</div>`;
    html += originSpirits.map(s => `
      <div class="spirit-card" style="border-left-color:${TYPE_COLOR[s.type]};cursor:pointer" data-sid="${s.id}">
        <div class="sc-name">${s.name}</div>
        <div class="sc-sub">${s.producer}</div>
        <div class="sc-meta">
          <span class="sc-tag" style="color:${TYPE_COLOR[s.type]};border-color:${TYPE_COLOR[s.type]}44">${TYPE_LABEL[s.type]}</span>
          <span class="sc-tag">ABV ${s.abv}</span>
        </div>
        <div class="sc-desc">${s.desc.substring(0,80)}...</div>
      </div>`).join('');
  }
  if(distSpirits.length) {
    html += `<div class="panel-section">ALSO DISTRIBUTED HERE (${distSpirits.length})</div>`;
    html += distSpirits.slice(0,15).map(s => `
      <div class="spirit-card" style="border-left-color:#3399ff88;cursor:pointer" data-sid="${s.id}">
        <div class="sc-name" style="color:#cce8ff">${s.name}</div>
        <div class="sc-sub">${s.origin}</div>
        <div class="sc-meta"><span class="sc-tag" style="color:#3399ff;border-color:#3399ff44">${TYPE_LABEL[s.type]}</span></div>
      </div>`).join('');
    if(distSpirits.length > 15) html += `<div style="font-size:8px;color:var(--dim);padding:4px 2px">...AND ${distSpirits.length-15} MORE</div>`;
  }
  const subtitle = `${originSpirits.length} ORIGIN · ${distSpirits.length} DISTRIBUTED`;
  openPanel(country.toUpperCase(), subtitle, html);
  // Click on spirit cards
  setTimeout(() => {
    document.querySelectorAll('.spirit-card[data-sid]').forEach(el => {
      el.addEventListener('click', () => {
        const s = SPIRITS.find(x => x.id === el.dataset.sid);
        if(s) { selectedSpirit = s; renderGlobe(); renderStats(); buildSpiritPanel(s); }
      });
    });
  }, 50);
}

// ═══════════════════════════════════════════════════════════════════
// GLOBE INIT
// ═══════════════════════════════════════════════════════════════════
async function initGlobe() {
  const container = document.getElementById('globe-container');
  const W = container.clientWidth, H = container.clientHeight;
  const R = Math.min(W, H) * 0.42;
  svg = d3.select('#globe').attr('width', W).attr('height', H);
  svg.append('g').selectAll('circle')
    .data(Array.from({length:250}, () => ({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.2,o:Math.random()*0.55+0.15})))
    .enter().append('circle').attr('cx', d=>d.x).attr('cy', d=>d.y).attr('r', d=>d.r).attr('fill','white').attr('opacity', d=>d.o);

  const defs = svg.append('defs');
  const glow = defs.append('filter').attr('id','glow');
  glow.append('feGaussianBlur').attr('stdDeviation','4').attr('result','coloredBlur');
  const fm = glow.append('feMerge');
  fm.append('feMergeNode').attr('in','coloredBlur');
  fm.append('feMergeNode').attr('in','SourceGraphic');
  const og = defs.append('radialGradient').attr('id','og').attr('cx','38%').attr('cy','38%').attr('r','60%');
  og.append('stop').attr('offset','0%').attr('stop-color','#071428');
  og.append('stop').attr('offset','100%').attr('stop-color','#030a14');

  projection = d3.geoOrthographic().scale(R).translate([W/2,H/2]).clipAngle(90).rotate(rotation);
  pathGen = d3.geoPath().projection(projection);
  g = svg.append('g');
  g.append('circle').attr('cx',W/2).attr('cy',H/2).attr('r',R).attr('fill','url(#og)').attr('filter','url(#glow)');
  g.append('circle').attr('cx',W/2).attr('cy',H/2).attr('r',R+2).attr('fill','none').attr('stroke','#22e5ff').attr('stroke-width','1.5').attr('opacity','0.18');
  g.append('circle').attr('cx',W/2).attr('cy',H/2).attr('r',R+7).attr('fill','none').attr('stroke','#22e5ff').attr('stroke-width','0.8').attr('opacity','0.07');

  try {
    const resp = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    world = await resp.json();
    countriesFeatures = topojson.feature(world, world.objects.countries).features;
    renderGlobe();
    setupGlobeInteractions();
  } catch(e) { console.warn('World data failed', e); }
}

// ═══════════════════════════════════════════════════════════════════
// RENDER GLOBE
// ═══════════════════════════════════════════════════════════════════
function renderGlobe() {
  if(!world) return;
  g.selectAll('.country,.graticule').remove();
  g.append('path').datum(d3.geoGraticule()()).attr('class','graticule')
    .attr('d',pathGen).attr('fill','none').attr('stroke','#1e3060').attr('stroke-width','0.4');

  const tt = document.getElementById('tooltip');

  g.selectAll('.country').data(countriesFeatures).enter().append('path').attr('class','country')
    .attr('d', pathGen)
    .attr('fill', d => {
      const info = getGlobeCountryFill(+d.id);
      return info ? info.color : '#1a3055';
    })
    .attr('fill-opacity', d => {
      const info = getGlobeCountryFill(+d.id);
      return info ? info.opacity : 0.75;
    })
    .attr('stroke', d => {
      const info = getGlobeCountryFill(+d.id);
      if(info && info.isOrigin) return info.color;
      if(info && info.isDist) return '#3399ff';
      return '#3a5580';
    })
    .attr('stroke-width', d => {
      const info = getGlobeCountryFill(+d.id);
      return (info && (info.isOrigin || info.isDist)) ? '0.9' : '0.4';
    })
    .on('mousemove touchmove', function(event, d) {
      if(isDragging) return;
      const country = NUM_TO_COUNTRY[+d.id];
      if(!country) return;
      const orig = getOriginSpirits(country);
      const dist = getDistSpirits(country);
      if(!orig.length && !dist.length) return;
      const types = [...new Set(orig.map(s=>s.type))];
      document.getElementById('tt-country').textContent = country.toUpperCase();
      document.getElementById('tt-count').textContent = orig.length || '—';
      document.getElementById('tt-level').textContent = dist.length || '—';
      document.getElementById('tt-cats').innerHTML = types.map(t => `<span class="tt-cat" style="color:${TYPE_COLOR[t]};border-color:${TYPE_COLOR[t]}55">${TYPE_LABEL[t]}</span>`).join('');
      posTooltip(event, tt); tt.classList.add('show');
    })
    .on('mouseleave touchend', () => tt.classList.remove('show'))
    .on('click touchstart', function(event, d) {
      if(isDragging) return;
      const country = NUM_TO_COUNTRY[+d.id];
      if(!country) return;
      const orig = getOriginSpirits(country);
      const dist = getDistSpirits(country);
      if(!orig.length && !dist.length) return;
      buildCountryPanel(country);
    });
}

function posTooltip(event, tt) {
  const rect = document.getElementById('globe-container').getBoundingClientRect();
  const cx = event.touches ? event.touches[0].clientX : event.clientX;
  const cy = event.touches ? event.touches[0].clientY : event.clientY;
  let x = cx-rect.left+14, y = cy-rect.top-10;
  if(x+210>rect.width) x = cx-rect.left-220;
  if(y+140>rect.height) y = cy-rect.top-140;
  tt.style.left = x+'px'; tt.style.top = y+'px';
}

// ═══════════════════════════════════════════════════════════════════
// DRAG TO ROTATE
// ═══════════════════════════════════════════════════════════════════
function setupGlobeInteractions() {
  const svgEl = document.getElementById('globe');
  function onStart(x,y) { isDragging=false; lastPos=[x,y]; }
  function onMove(x,y) {
    if(!lastPos) return;
    const dx=x-lastPos[0], dy=y-lastPos[1];
    if(Math.abs(dx)>3||Math.abs(dy)>3) isDragging=true;
    if(!isDragging) return;
    rotation[0]+=dx*0.4; rotation[1]-=dy*0.4;
    rotation[1]=Math.max(-90,Math.min(90,rotation[1]));
    projection.rotate(rotation);
    g.selectAll('path').attr('d',pathGen);
    lastPos=[x,y];
  }
  function onEnd() {
    lastPos=null;
    setTimeout(()=>{ isDragging=false; renderGlobe(); },60);
  }
  svgEl.addEventListener('mousedown',e=>onStart(e.clientX,e.clientY));
  window.addEventListener('mousemove',e=>{if(lastPos)onMove(e.clientX,e.clientY);});
  window.addEventListener('mouseup',onEnd);
  svgEl.addEventListener('touchstart',e=>{e.preventDefault();onStart(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  svgEl.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1)onMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  svgEl.addEventListener('touchend',onEnd);
}

// ═══════════════════════════════════════════════════════════════════
// LIST VIEW
// ═══════════════════════════════════════════════════════════════════
function renderList() {
  const types = ['beer','wine','whiskey','gin','vodka','rum','tequila','other'];
  const regions = ['Oregon','Washington','Idaho','Arizona','California'];
  document.getElementById('filter-row').innerHTML =
    `<button class="filter-btn ${!activeCategory?'active':''}" data-cat="" style="color:#fff;border-color:#ffffff44">ALL</button>` +
    types.map(t=>`<button class="filter-btn ${activeCategory===t?'active':''}" data-cat="${t}" style="color:${TYPE_COLOR[t]};border-color:${TYPE_COLOR[t]}">${TYPE_LABEL[t]}</button>`).join('') +
    `<span style="color:var(--dim);font-size:7px;padding:0 4px;align-self:center;white-space:nowrap">│</span>` +
    regions.map(r=>`<button class="filter-btn ${activeRegion===r?'active':''}" data-region="${r}" style="color:#a0c8ff;border-color:#a0c8ff">${r.toUpperCase()}</button>`).join('');
  document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => { activeCategory=btn.dataset.cat||null; renderList(); renderGlobe(); renderStats(); });
  });
  document.querySelectorAll('.filter-btn[data-region]').forEach(btn => {
    btn.addEventListener('click', () => { activeRegion = activeRegion===btn.dataset.region ? null : btn.dataset.region; renderList(); renderStats(); });
  });
  const items = getFiltered().filter(s => !activeRegion || s.region===activeRegion).sort((a,b)=>a.name.localeCompare(b.name));
  const regionTag = s => s.region ? `<span class="inc-tag" style="border-color:#a0c8ff33;color:#a0c8ff">${s.region.toUpperCase()}</span>` : '';
  const regionLine = s => s.region ? `<span style="color:#a0c8ff">${s.region.toUpperCase()} · </span>` : '';
  document.getElementById('list-container').innerHTML = items.length === 0
    ? `<div style="color:var(--dim);font-size:10px;padding:20px;text-align:center">NO SPIRITS MATCH FILTER</div>`
    : items.map(s =>
      `<div class="list-item" style="border-left-color:${TYPE_COLOR[s.type]}" data-id="${s.id}">` +
      `<div class="li-header"><div class="li-name">${s.name}</div><div class="li-abv">${s.abv}</div></div>` +
      `<div class="li-producer">${s.producer}</div>` +
      `<div class="li-origin">${regionLine(s)}${s.origin.toUpperCase()} · ${s.distribution?.length||0} COUNTRIES</div>` +
      `<div class="li-tags"><span class="inc-tag" style="border-color:${TYPE_COLOR[s.type]}55;color:${TYPE_COLOR[s.type]}">${TYPE_LABEL[s.type]}</span>${regionTag(s)}</div>` +
      `</div>`).join('');
  document.querySelectorAll('.list-item').forEach(el => {
    el.addEventListener('click', () => {
      const s = SPIRITS.find(x => x.id === el.dataset.id);
      if(!s) return;
      selectedSpirit = s;
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      document.querySelector('[data-view="globe-view"]').classList.add('active');
      document.getElementById('globe-view').classList.add('active');
      renderGlobe(); renderStats(); buildSpiritPanel(s);
    });
  });
}

document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderList(); renderStats();
});

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
renderStats();
initGlobe();
renderList();
</script>
