    function hslRgb(h, s, l) {
      s /= 100; l /= 100;
      const a = s * Math.min(l, 1 - l);
      const f = n => { const k = (n + h / 30) % 12; return Math.round(255*(l - a*Math.max(Math.min(k-3,9-k,1),-1))); };
      return `${f(0)},${f(8)},${f(4)}`;
    }

    function StrainWheel() {

      const ringRadius = (ring) => INNER + ((OUTER - INNER) / 4) * ring;

              <text x={CX} y={CY+2}  textAnchor="middle" fontSize={7}  fill="rgba(255,255,255,0.4)" letterSpacing={2}>STRAIN</text>
              <text x={CX} y={CY+14} textAnchor="middle" fontSize={7}  fill="rgba(255,255,255,0.4)" letterSpacing={2}>WHEEL</text>
              <text x={CX} y={CY+26} textAnchor="middle" fontSize={6}  fill="rgba(255,255,255,0.2)" letterSpacing={1}>{STRAINS.length + CBD_STRAINS.length} strains</text>

              {SEGMENT_LABELS.map(seg => {
                const inner = polarToXY(seg.angle, INNER-4), outer = polarToXY(seg.angle, OUTER+4);
                const lp = polarToXY(seg.angle, OUTER+32), sp = polarToXY(seg.angle, OUTER+44);
                const rot = seg.angle > 90 && seg.angle < 270 ? seg.angle+90 : seg.angle-90;
                return (
                  <g key={seg.angle}>
                    <line x1={inner.x} y1={inner.y} x2={outer.x} y2={outer.y} stroke="rgba(255,255,255,0.10)" strokeWidth={1} />
                    <text x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="middle" fontSize={7} letterSpacing={2} fill="rgba(255,255,255,0.38)" transform={`rotate(${rot},${lp.x},${lp.y})`}>{seg.label}</text>
                    <text x={sp.x} y={sp.y} textAnchor="middle" dominantBaseline="middle" fontSize={5.5} letterSpacing={1} fill="rgba(255,255,255,0.20)" transform={`rotate(${rot},${sp.x},${sp.y})`}>{seg.sub}</text>
                  </g>
                );
              })}

              {STRAINS.map(strain => {
                const ring = TYPE_CONFIG[strain.type].ring;
                const pos = polarToXY(strain.h, ringRadius(ring));
                const isActive = activeStrain && activeStrain.name === strain.name;
                const dim = isDimmed(strain);
                const isHit = searching && highlightedNames.has(strain.name);
                const dotColor = `hsl(${strain.h},${strain.s}%,${strain.l}%)`;
                const glowColor = `hsl(${strain.h},${strain.s}%,${Math.min(strain.l+18,90)}%)`;
                const size = (isActive || isHit) ? 10 : 7;
                const bc = strain.brand ? BRAND_CONFIG[strain.brand] : null;
                return (
                  <g key={strain.name} style={{ cursor: "pointer", opacity: dim ? 0.1 : 1, transition: "opacity 0.25s" }}
                    onMouseEnter={() => setHovered(strain)} onMouseLeave={() => setHovered(null)}
                    onClick={() => setSelected(selected && selected.name === strain.name ? null : strain)}>
                    {isActive && <>
                      <circle cx={pos.x} cy={pos.y} r={20} fill={dotColor} opacity={0.14} />
                      <circle cx={pos.x} cy={pos.y} r={13} fill={dotColor} opacity={0.22} />
                      <line x1={CX} y1={CY} x2={pos.x} y2={pos.y} stroke={dotColor} strokeWidth={0.6} opacity={0.4} strokeDasharray="3 4" />
                    </>}
                    {isHit && !isActive && <circle cx={pos.x} cy={pos.y} r={14} fill={dotColor} opacity={0.20} />}
                    {bc && <circle cx={pos.x} cy={pos.y} r={size+4} fill="none" stroke={bc.color} strokeWidth={1.5} opacity={brandFilter !== "all" && strain.brand === brandFilter ? 0.9 : 0.35} />}
                    <circle cx={pos.x} cy={pos.y} r={size+2} fill={dotColor} opacity={0.30} />
                    <circle cx={pos.x} cy={pos.y} r={size} fill={dotColor} stroke={isActive ? glowColor : "rgba(255,255,255,0.40)"} strokeWidth={isActive ? 1.8 : 0.6} />
                    <circle cx={pos.x-size*0.25} cy={pos.y-size*0.25} r={size*0.3} fill="rgba(255,255,255,0.45)" />
                  </g>
                );
              })}
            </svg>
          </div>

          <div style={{ width: "100%", maxWidth: 700, minHeight: 100, marginTop: 10, border: "1px solid rgba(255,255,255,0.10)", borderRadius: 4, padding: "14px 18px", background: activeStrain ? `linear-gradient(135deg, rgba(${hslRgb(activeStrain.h,activeStrain.s,activeStrain.l)},0.14), transparent)` : "rgba(255,255,255,0.025)", transition: "background 0.4s" }}>
            {activeStrain ? (
              <div style={{ display: "flex", alignItems: "flex-start", gap: 14 }}>
                <div style={{ width: 42, height: 42, borderRadius: "50%", background: `hsl(${activeStrain.h},${activeStrain.s}%,${activeStrain.l}%)`, boxShadow: `0 0 22px hsl(${activeStrain.h},${activeStrain.s}%,${activeStrain.l}%)`, flexShrink: 0 }} />
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                    <span style={{ fontSize: 17, fontFamily: "'Georgia',serif", color: "#f0ead8" }}>{activeStrain.name}</span>
                    <span style={{ fontSize: 8, letterSpacing: 2, padding: "2px 7px", border: `1px solid ${activeStrain.type === "cbd" ? "rgba(80,200,140,0.6)" : `hsl(${activeStrain.h},${activeStrain.s}%,${activeStrain.l}%)`}`, color: activeStrain.type === "cbd" ? "rgba(80,200,140,0.9)" : `hsl(${activeStrain.h},${activeStrain.s}%,${Math.min(activeStrain.l+20,90)}%)`, borderRadius: 2 }}>
                      {TYPE_CONFIG[activeStrain.type].label.toUpperCase()}
                    </span>
                    {activeStrain.type === "cbd" && activeStrain.cbd && (
                      <span style={{ fontSize: 8, letterSpacing: 2, padding: "2px 7px", border: "1px solid rgba(80,200,140,0.35)", color: "rgba(80,200,140,0.75)", borderRadius: 2 }}>CBD:THC {activeStrain.cbd}</span>
                    )}
                    {activeStrain.brand && BRAND_CONFIG[activeStrain.brand] && (
                      <span style={{ fontSize: 8, letterSpacing: 1.5, padding: "2px 8px", background: BRAND_CONFIG[activeStrain.brand].color + "22", border: `1px solid ${BRAND_CONFIG[activeStrain.brand].color}66`, color: BRAND_CONFIG[activeStrain.brand].color, borderRadius: 2 }}>
                        {BRAND_CONFIG[activeStrain.brand].label}
                      </span>
                    )}
                  </div>
                  <div style={{ fontSize: 11, color: "#aaa", marginTop: 6, lineHeight: 1.6 }}>{activeStrain.notes}</div>
                  {activeStrain.formats && (
                    <div style={{ marginTop: 8, display: "flex", gap: 5, flexWrap: "wrap" }}>
                      {activeStrain.formats.map(f => {
                        const fc = FORMAT_CONFIG[f];
                        if (!fc) return <span key={f} style={{ fontSize: 8, color: "#666", padding: "2px 6px", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 2 }}>{f.toUpperCase()}</span>;
                        return <span key={f} style={{ fontSize: 8, letterSpacing: 1.5, padding: "2px 8px", background: fc.color + "18", border: `1px solid ${fc.color}55`, color: fc.color, borderRadius: 2 }}>{fc.icon} {fc.label.toUpperCase()}</span>;
                      })}
                    </div>
                  )}
                  {activeStrain.effects && (
                    <div style={{ marginTop: 6, display: "flex", gap: 5, flexWrap: "wrap" }}>
                      {activeStrain.effects.map(e => {
                        const ec = EFFECT_CONFIG[e];
                        if (!ec) return null;
                        return <span key={e} style={{ fontSize: 8, letterSpacing: 1.5, padding: "2px 8px", background: ec.color + "18", border: `1px solid ${ec.color}55`, color: ec.color, borderRadius: 2 }}>{ec.label.toUpperCase()}</span>;
                      })}
                    </div>
                  )}
                  {activeStrain.terps && (
                    <div style={{ marginTop: 6, display: "flex", gap: 5, flexWrap: "wrap" }}>
                      {activeStrain.terps.map(t => {
                        const tc = TERP_CONFIG[t];
                        if (!tc) return null;
                        return (
                          <div key={t} title={tc.desc} style={{ display: "flex", alignItems: "center", gap: 4, padding: "2px 8px", background: tc.color + "18", border: `1px solid ${tc.color}50`, borderRadius: 2, cursor: "help" }}>
                            <div style={{ width: 5, height: 5, borderRadius: "50%", background: tc.color }} />
                            <span style={{ fontSize: 8, letterSpacing: 1.5, color: tc.color }}>{tc.label.toUpperCase()}</span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                  <div style={{ marginTop: 8, display: "flex", gap: 14, fontSize: 9, color: "#555", letterSpacing: 1 }}>
                    <span>HUE {activeStrain.h}°</span>
                    <span>SAT {activeStrain.s}%</span>
                    <span>LGT {activeStrain.l}%</span>
                    <span style={{ color: `hsl(${activeStrain.h},${activeStrain.s}%,${activeStrain.l}%)` }}>hsl({activeStrain.h},{activeStrain.s}%,{activeStrain.l}%)</span>
                  </div>
                </div>
              </div>
            ) : (
              <div style={{ textAlign: "center", color: "#555", fontSize: 11, letterSpacing: 2, paddingTop: 28 }}>HOVER OR SELECT A STRAIN</div>
            )}
          </div>

          <div style={{ display: "flex", gap: 16, marginTop: 14, flexWrap: "wrap", justifyContent: "center" }}>
            {[{r:3,l:"Pure (outer)"},{r:2,l:"Dominant (mid)"},{r:1,l:"True Hybrid (inner)"}].map(({r,l}) => (
              <div key={l} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 9, color: "#666", letterSpacing: 1 }}>
                <div style={{ width: r===3?10:r===2?8:6, height: r===3?10:r===2?8:6, borderRadius: "50%", background: "#777", border: "1px solid rgba(255,255,255,0.3)" }} />
                {l.toUpperCase()}
              </div>
            ))}
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 9, color: "rgba(80,200,140,0.65)", letterSpacing: 1 }}>
              <div style={{ width: 8, height: 8, borderRadius: "50%", background: "rgba(80,200,140,0.45)", border: "1px solid rgba(80,200,140,0.65)" }} />
              CBD SANCTUM
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 9, color: "#888", letterSpacing: 1 }}>
              <div style={{ width: 10, height: 10, borderRadius: "50%", background: "transparent", border: "1.5px solid #e8c060" }} />
              BRAND RING
            </div>
          </div>
          <div style={{ fontSize: 9, color: "#3a3848", marginTop: 14, letterSpacing: 2, textAlign: "center" }}>
            COLOR POSITION = PHENOTYPE CHARACTER · RING DEPTH = GENETIC PURITY · OUTER RING = BRAND HOUSE
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<StrainWheel />);
  </script>
</body>
</html>
