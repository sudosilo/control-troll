const scoreboardEl = document.getElementById('scoreboard');
const controlsEl = document.getElementById('controls');
const genreBadge = document.getElementById('genreBadge');
const turnBanner = document.getElementById('turnBanner');
const finalEl = document.getElementById('finalScreen');
const overlayEl = document.getElementById('overlay');

function currentPlayer() {
  return players[turnIndex];
}

function renderTurnBanner() {
  if (players.length > 1) {
    turnBanner.style.display = 'block';
    turnBanner.textContent = "▶ " + currentPlayer() + "'s turn";
  } else {
    turnBanner.style.display = 'none';
  }
}

function renderGenreGrid() {
  const grid = document.getElementById('genreGrid');
  grid.innerHTML = '';
  Object.keys(GENRES).forEach(g => {
    const b = document.createElement('button');
    b.className = 'genre-btn';
    b.textContent = g;
    b.addEventListener('click', () => {
      genre = g;
      genreScreen.style.display = 'none';
      setupEl.style.display = 'block';
    });
    grid.appendChild(b);
  });
}

function renderHighScores() {
  const el = document.getElementById('highScoresList');
  el.innerHTML = '<div class="empty">Loading...</div>';
  fetch('?action=leaderboard')
    .then(function(r) { return r.json(); })
    .then(function(list) {
      if (!list || !list.length) {
        el.innerHTML = '<div class="empty">No scores yet — be the first.</div>';
        return;
      }
      var rows = list.slice(0, 10).map(function(e) {
        return '<li>' + escapeHtml(e.name) + ' — $' + e.score +
          ' <span style="color:#a7b3c9;">(' + escapeHtml(e.genre) + ')</span></li>';
      });
      el.innerHTML = '<ol>' + rows.join('') + '</ol>';
    })
    .catch(function() {
      el.innerHTML = '<div class="empty">Leaderboard unavailable right now.</div>';
    });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function submitScores(entries) {
  entries.forEach(function(e) {
    fetch('?action=leaderboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: e.name, genre: e.genre, score: e.score })
    }).catch(function() { /* fail quietly, game still ends normally */ });
  });
}

renderGenreGrid();
renderHighScores();

document.getElementById('startBtn').addEventListener('click', () => {
  const raw = document.getElementById('playerInput').value.trim();
  players = raw ? raw.split(',').map(s=>s.trim()).filter(Boolean) : ['You'];
  scores = {}; used = {}; turnIndex = 0;
  players.forEach(p => scores[p] = 0);

  const allCells = [];
  CATS.forEach(cat => VALUES.forEach(val => allCells.push({cat, val})));
  dailyDouble = allCells[Math.floor(Math.random() * allCells.length)];

  setupEl.style.display = 'none';
  finalEl.style.display = 'none';
  boardWrapEl.style.display = 'block';
  scoreboardEl.style.display = 'flex';
  controlsEl.style.display = 'block';
  genreBadge.style.display = 'block';
  document.getElementById('genreBadgeText').textContent = genre;
  renderBoard();
  renderScoreboard();
  renderTurnBanner();
});

document.getElementById('changeGenreBtn').addEventListener('click', resetToGenreScreen);
document.getElementById('playAgainBtn').addEventListener('click', resetToGenreScreen);

function resetToGenreScreen() {
  genre = null; players = []; scores = {}; used = {}; current = null; dailyDouble = null; turnIndex = 0;
  boardWrapEl.style.display = 'none';
  scoreboardEl.style.display = 'none';
  controlsEl.style.display = 'none';
  genreBadge.style.display = 'none';
  turnBanner.style.display = 'none';
  finalEl.style.display = 'none';
  setupEl.style.display = 'none';
  genreScreen.style.display = 'block';
  renderHighScores();
}

function renderBoard() {
  boardEl.innerHTML = '';
  CATS.forEach(cat => {
    const h = document.createElement('div');
    h.className = 'cat-header';
    h.textContent = cat;
    boardEl.appendChild(h);
  });
  VALUES.forEach((val, idx) => {
    CATS.forEach(cat => {
      const key = cat + '|' + val;
      const tile = document.createElement('div');
      tile.className = 'tile' + (used[key] ? ' used' : '');
      if (!used[key]) {
        tile.innerHTML = '<span class="lvl">LEVEL ' + (idx+1) + '</span><span class="pts">$' + val + '</span>';
        tile.addEventListener('click', () => openClue(cat, val));
      }
      boardEl.appendChild(tile);
    });
  });
}

function renderScoreboard() {
  scoreboardEl.innerHTML = '';
  players.forEach((p, i) => {
    const pill = document.createElement('div');
    pill.className = 'score-pill';
    if (players.length > 1 && i === turnIndex) {
      pill.style.background = '#0b5ed7';
      pill.style.color = '#fff';
    }
    pill.textContent = p + ': $' + scores[p];
    scoreboardEl.appendChild(pill);
  });
}

function isDailyDouble(cat, val) {
  return dailyDouble && dailyDouble.cat === cat && dailyDouble.val === val;
}

function openClue(cat, val) {
  const key = cat + '|' + val;
  used[key] = true;
  const clue = GENRES[genre][cat].find(c => c[0] === val);
  current = { cat, val, answer: clue[2] };
  renderBoard();

  if (isDailyDouble(cat, val)) {
    openDailyDouble(cat, val, clue);
  } else {
    document.getElementById('ddTitle').style.display = 'none';
    document.getElementById('clueCard').classList.remove('dd-flash');
    const lvl = VALUES.indexOf(val) + 1;
    document.getElementById('clueCatVal').textContent = cat + ' — Level ' + lvl + ' ($' + val + ')';
    document.getElementById('clueBody').innerHTML = '<div id="clueText">' + clue[1] + '</div>';
    document.getElementById('answerText').innerHTML = '';
    const btns = document.getElementById('clueBtns');
    btns.innerHTML = '';
    const revealBtn = document.createElement('button');
    revealBtn.className = 'btn secondary';
    revealBtn.textContent = 'Reveal Answer';
    revealBtn.addEventListener('click', revealAnswer);
    btns.appendChild(revealBtn);
    overlayEl.style.display = 'flex';
  }
}

function openDailyDouble(cat, val, clue) {
  const card = document.getElementById('clueCard');
  document.getElementById('ddTitle').style.display = 'block';
  document.getElementById('clueCatVal').textContent = cat + ' — you found a Daily Double';
  document.getElementById('clueBody').innerHTML = '';
  document.getElementById('answerText').innerHTML = '';
  document.getElementById('clueBtns').innerHTML = '';
  card.classList.remove('dd-flash');
  void card.offsetWidth; // restart animation
  card.classList.add('dd-flash');
  overlayEl.style.display = 'flex';
  setTimeout(() => askWager(clue), 650);
}

function askWager(clue) {
  const cp = currentPlayer();
  const maxWager = Math.max(scores[cp], 1000);
  const defaultWager = Math.min(500, maxWager);
  const body = document.getElementById('clueBody');
  body.innerHTML = '<div>' + escapeHtml(cp) + ', place your wager (up to $' + maxWager + '):</div>' +
    '<input id="wagerInput" type="text" inputmode="numeric" pattern="[0-9]*" value="' + defaultWager + '" />';
  const btns = document.getElementById('clueBtns');
  btns.innerHTML = '';
  const goBtn = document.createElement('button');
  goBtn.className = 'btn';
  goBtn.textContent = 'Lock In Wager';
  goBtn.addEventListener('click', () => {
    const raw = document.getElementById('wagerInput').value.replace(/[^0-9]/g, '');
    let wager = parseInt(raw, 10);
    if (isNaN(wager) || wager < 5) wager = 5;
    if (wager > maxWager) wager = maxWager;
    current.wager = wager;
    current.isDD = true;
    showDailyDoubleClue(clue);
  });
  btns.appendChild(goBtn);
}

function showDailyDoubleClue(clue) {
  document.getElementById('clueBody').innerHTML = '<div id="clueText">' + clue[1] + '</div>';
  const btns = document.getElementById('clueBtns');
  btns.innerHTML = '';
  const revealBtn = document.createElement('button');
  revealBtn.className = 'btn secondary';
  revealBtn.textContent = 'Reveal Answer';
  revealBtn.addEventListener('click', revealAnswer);
  btns.appendChild(revealBtn);
}

function revealAnswer() {
  document.getElementById('answerText').innerHTML =
    'Answer: <span id="answerReveal">' + current.answer + '</span>';
  const btns = document.getElementById('clueBtns');
  btns.innerHTML = '';
  const cp = currentPlayer();

  const yes = document.createElement('button');
  yes.className = 'btn correct';
  const no = document.createElement('button');
  no.className = 'btn wrong';

  if (current.isDD) {
    yes.textContent = cp + ' got it (+$' + current.wager + ')';
    yes.addEventListener('click', () => finishAnswer(true));
    no.textContent = cp + ' missed it (-$' + current.wager + ')';
    no.addEventListener('click', () => finishAnswer(false));
  } else {
    yes.textContent = cp + ' got it right';
    yes.addEventListener('click', () => finishAnswer(true));
    no.textContent = cp + ' missed it';
    no.addEventListener('click', () => finishAnswer(false));
  }
  btns.appendChild(yes);
  btns.appendChild(no);
}

function finishAnswer(correct) {
  const cp = currentPlayer();
  if (current.isDD) {
    scores[cp] += correct ? current.wager : -current.wager;
  } else if (correct) {
    scores[cp] += current.val;
  }
  if (!correct && players.length > 1) {
    turnIndex = (turnIndex + 1) % players.length;
  }
  closeClue();
}

function closeClue() {
  overlayEl.style.display = 'none';
  document.getElementById('clueCard').classList.remove('dd-flash');
  current = null;
  renderScoreboard();
  renderTurnBanner();
  checkDone();
}

function checkDone() {
  const total = CATS.length * VALUES.length;
  if (Object.keys(used).length >= total) showFinal();
}

function showFinal() {
  boardWrapEl.style.display = 'none';
  scoreboardEl.style.display = 'none';
  controlsEl.style.display = 'none';
  genreBadge.style.display = 'none';
  turnBanner.style.display = 'none';
  finalEl.style.display = 'block';
  const list = document.getElementById('finalList');
  list.innerHTML = '';
  const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  sorted.forEach(([name, sc]) => {
    const row = document.createElement('div');
    row.textContent = name + ': $' + sc;
    list.appendChild(row);
  });
  submitScores(sorted.map(([name, sc]) => ({ name: name, genre: genre, score: sc })));
}
</script>
</body>
</html>
