<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<!-- BLUE CODE: source device Blue Phone -->
<title>Phantom Kitchen Hub</title>
<style>

:root { color-scheme: only light; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: #F6F4F1; }
body {
  margin: 0; min-height: 100vh; color: #23262B;
  font-family: "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 28px 16px 44px;
}
.hero { text-align: center; margin-bottom: 18px; }
.ghost { width: 74px; height: 74px; display: block; margin: 0 auto 8px; }
h1 { font-size: 24px; font-weight: 800; letter-spacing: 3px; margin: 0; color: #23262B; text-transform: uppercase; }
.sub { color: #6B7078; font-size: 13px; margin-top: 6px; }
.card {
  width: 100%; max-width: 420px; background: #FFFFFF; border: 1px solid #E4DFD8;
  border-top: 5px solid #F26B1D; border-radius: 8px; padding: 24px 22px; box-shadow: 0 6px 22px rgba(35, 38, 43, 0.06);
}
.card-title { font-size: 16px; font-weight: 800; margin: 0 0 16px; letter-spacing: 0.5px; }
label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: #6B7078; margin-bottom: 6px; }
input[type="text"] {
  width: 100%; padding: 12px 14px; margin-bottom: 18px; border: 1px solid #C9C3BA; border-radius: 6px;
  background: #FBFAF8; color: #23262B; font-family: "Courier New", monospace; font-size: 16px;
}
input[type="text"]:focus { outline: none; border-color: #F26B1D; box-shadow: 0 0 0 3px rgba(242, 107, 29, 0.2); }
button {
  width: 100%; padding: 14px; background: #F26B1D; color: #FFFFFF; border: none; border-radius: 6px;
  font-family: inherit; font-size: 14px; font-weight: 800; letter-spacing: 2px; cursor: pointer;
}
button:hover:not(:disabled) { background: #C7510F; }
button:disabled { background: #F5B58F; cursor: default; }
.strength-row { display: flex; align-items: center; gap: 8px; margin-top: -8px; margin-bottom: 14px; }
.strength-bar { flex: 1; height: 6px; background: #E9E4DC; border-radius: 3px; overflow: hidden; }
.strength-fill { height: 100%; width: 0%; background: #C0392B; transition: width 0.2s ease, background 0.2s ease; }
.strength-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #6B7078; min-width: 76px; text-align: right; }
.reset-row { text-align: right; margin-top: -4px; margin-bottom: 16px; }
.reset-row a { font-size: 12px; color: #C7510F; text-decoration: none; border-bottom: 1px dotted #C7510F; }
.result { display: none; margin-top: 18px; padding: 12px 14px; border-radius: 6px; font-size: 14px; line-height: 1.5; }
.result.show { display: block; }
.result.new { background: #FFF1E6; border: 1px solid #F26B1D; color: #8F3A09; }
.result.success { background: #E8F5EA; border: 1px solid #2E8B3E; color: #1B5A27; }
.result.fail { background: #FBECEA; border: 1px solid #C0392B; color: #7D2018; }
.brands { width: 100%; max-width: 420px; margin-top: 22px; }
.brands-title { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #6B7078; text-align: center; margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { background: #FFFFFF; border: 1px solid #E4DFD8; border-radius: 999px; padding: 6px 12px; font-size: 12px; color: #23262B; display: flex; align-items: center; gap: 6px; }
.live { width: 7px; height: 7px; border-radius: 50%; background: #2E8B3E; display: inline-block; }
.status { text-align: center; font-size: 12px; color: #6B7078; margin-top: 18px; }

</style>
</head>
<body>

<div class="hero">
  <svg class="ghost" viewBox="0 0 56 60" xmlns="http://www.w3.org/2000/svg">
    <path d="M9 56 V28 Q9 11 28 11 Q47 11 47 28 V56 L41 51 L34.5 56 L28 51 L21.5 56 L15 51 Z" fill="#FFFFFF" stroke="#23262B" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="21" cy="30" r="3" fill="#23262B"/>
    <circle cx="35" cy="30" r="3" fill="#23262B"/>
    <ellipse cx="28" cy="39" rx="3.2" ry="2.4" fill="#23262B"/>
    <path d="M16 15 Q12 5 21 5 Q23 0 28 2 Q33 0 35 5 Q44 5 40 15 Z" fill="#F26B1D" stroke="#23262B" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <h1>Phantom Kitchen Hub</h1>
  <div class="sub">Virtual brands. Real food. No dining room.</div>
</div>

<div class="card">
  <div class="card-title">Operator Sign In</div>

  <label for="username">OPERATOR ID</label>
  <input type="text" id="username" autocomplete="off" spellcheck="false">

  <label for="password">ACCESS KEY</label>
  <input type="text" id="password" autocomplete="off" spellcheck="false">

  <div class="strength-row">
    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    <span class="strength-label" id="strengthLabel"></span>
  </div>

  <div class="reset-row">
    <a href="#" id="resetLink">forgot access key?</a>
  </div>

  <button id="submitBtn">ENTER KITCHEN</button>

  <div class="result" id="result"></div>
</div>

<div class="brands">
  <div class="brands-title">VIRTUAL BRANDS ONLINE</div>
  <div class="chips">
    <span class="chip"><span class="live"></span>Wing Theory</span>
    <span class="chip"><span class="live"></span>Smash Lab</span>
    <span class="chip"><span class="live"></span>Bowl Society</span>
    <span class="chip"><span class="live"></span>Noodle Hour</span>
    <span class="chip"><span class="live"></span>Pie Department</span>
    <span class="chip"><span class="live"></span>Midnight Tacos</span>
  </div>
</div>
<div class="status">Hub status: ONLINE | Kitchen time <span id="clock"></span></div>

<script>

const LEVELS = [["RAW", "#C0392B"], ["PREP", "#E58A1F"], ["COOKING", "#B8860B"], ["PLATED", "#2E8B3E"], ["DELIVERED", "#23262B"]];
const EMPTY = '#E9E4DC';

function tickClock() {
  const c = document.getElementById('clock');
  if (c) c.textContent = new Date().toLocaleTimeString();
}
tickClock();
setInterval(tickClock, 1000);

function scoreStrength(u, p) {
  const combined = u + p;
  if (!combined) return { pct: 0, label: '', color: EMPTY };

  const uniqueChars = new Set(combined.toLowerCase()).size;
  const lengthScore = Math.min(combined.length / 16, 1);
  const varietyScore = Math.min(uniqueChars / 10, 1);
  const hasLower = /[a-z]/.test(combined);
  const hasUpper = /[A-Z]/.test(combined);
  const hasDigit = /[0-9]/.test(combined);
  const hasSymbol = /[^a-zA-Z0-9]/.test(combined);
  const classCount = [hasLower, hasUpper, hasDigit, hasSymbol].filter(Boolean).length;
  const classScore = classCount / 4;

  const raw = (lengthScore * 0.4) + (varietyScore * 0.35) + (classScore * 0.25);
  const pct = Math.round(raw * 100);
  const idx = pct < 20 ? 0 : pct < 45 ? 1 : pct < 70 ? 2 : pct < 90 ? 3 : 4;

  return { pct, label: LEVELS[idx][0], color: LEVELS[idx][1] };
}

function updateStrength() {
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const { pct, label, color } = scoreStrength(u, p);

  const fill = document.getElementById('strengthFill');
  const lbl = document.getElementById('strengthLabel');
  fill.style.width = pct + '%';
  fill.style.background = color;
  lbl.textContent = label;
}

document.getElementById('username').addEventListener('input', updateStrength);
document.getElementById('password').addEventListener('input', updateStrength);

function showResult(text, cls) {
  const el = document.getElementById('result');
  el.textContent = text;
  el.className = 'result show ' + cls;
}

const resultClassMap = {
  welcome_back: 'success',
  password_wrong: 'fail',
  username_wrong: 'fail',
  enrolled: 'new'
};

function passwordMeetsRequirements(p) {
  const hasUpper = /[A-Z]/.test(p);
  const hasDigit = /[0-9]/.test(p);
  const hasSymbol = /[^a-zA-Z0-9]/.test(p);
  return hasUpper && hasDigit && hasSymbol;
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const btn = document.getElementById('submitBtn');
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();

  if (!u || !p) {
    showResult('operator ID and access key are both required.', 'fail');
    return;
  }

  if (!passwordMeetsRequirements(p)) {
    showResult('access key needs a capital letter, a number, and a special character.', 'fail');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'ENTERING...';

  try {
    const res = await fetch('/api/attempt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();

    if (!res.ok) {
      showResult(data.error || 'ticket failed. try again.', 'fail');
    } else {
      showResult(data.message, resultClassMap[data.result] || 'fail');
    }
  } catch (e) {
    showResult('the hub could not be reached.', 'fail');
  }

  btn.disabled = false;
  btn.textContent = 'ENTER KITCHEN';
});

document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('submitBtn').click();
});

document.getElementById('resetLink').addEventListener('click', async (e) => {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();

  if (!u) {
    showResult('enter an operator ID first.', 'fail');
    return;
  }

  try {
    const res = await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u })
    });
    const data = await res.json();
    showResult(data.message || 'request received.', 'fail');
  } catch (err) {
    showResult('the hub could not be reached.', 'fail');
  }
});
</script>
</body>
</html>
